
<script type="module">
import { auth, db, authPersistenceReady } from "./assets/js/firebase.js";
import { doc, getDoc } from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const $ = id => document.getElementById(id);

const services = [
  { id: "api", name: "APIサーバー", check: checkApi },
  { id: "web", name: "Webサーバー", check: checkWeb },
  { id: "auth", name: "Firebase Authentication", check: checkAuth },
  { id: "firestore", name: "Cloud Firestore", check: checkFirestore }
];

function setStatus(id, ok) {
  const el = $(id);
  el.className = "status " + (ok ? "ok" : "error");
  el.textContent = ok ? "✓" : "✕";
}

async function checkApi() {
  const response = await fetch("/health", { cache: "no-store" });
  if (!response.ok) throw new Error("API error");

  const data = await response.json();
  if (data.ok !== true) throw new Error("API error");
}

async function checkWeb() {
  const response = await fetch("/", { cache: "no-store" });
  if (!response.ok) throw new Error("Web error");
}

async function checkAuth() {
  await authPersistenceReady;
  if (!auth) throw new Error("Auth unavailable");
}

async function checkFirestore() {
  await authPersistenceReady;

  if (!auth.currentUser) {
    throw new Error("未ログイン");
  }

  const snapshot = await getDoc(doc(db, "settings", "system"));
  if (!snapshot.exists()) throw new Error("Document unavailable");
}

async function runCheck(service) {
  try {
    await service.check();
    setStatus(service.id, true);
    return true;
  } catch (error) {
    console.error(service.name, error);
    setStatus(service.id, false);
    return false;
  }
}

async function updateStatus() {
  const results = await Promise.all(services.map(runCheck));
  const allOK = results.every(Boolean);

  $("summary").textContent = allOK
    ? "すべてのサービスが正常に稼働しています"
    : "一部のサービスで問題を確認しました";

  $("summary").className =
    "summary-message " + (allOK ? "ok" : "error");

  $("updated").textContent =
    "最終確認：" +
    new Date().toLocaleString("ja-JP", {
      timeZone: "Asia/Tokyo"
    }) + " JST";
}

await authPersistenceReady;
updateStatus();
setInterval(updateStatus, 30000);
</script>
