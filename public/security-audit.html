
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEB Course-plus セキュリティ診断</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#f3f6fb;color:#172033;font-family:Arial,"Noto Sans JP",sans-serif}
main{max-width:900px;margin:auto}
.panel{background:white;border:1px solid #dce3ed;border-radius:14px;padding:22px;margin:16px 0}
h1{font-size:24px}
h2{font-size:17px}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}
input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px}
button{padding:12px 18px;border:0;border-radius:8px;background:#2459cf;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#e9eef7;color:#24334b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.muted{font-size:13px;color:#65738a;line-height:1.7}
.notice{padding:12px;background:#fff8e8;border-left:4px solid #d18a00;font-size:13px}
.result{border-top:1px solid #e5eaf1;padding:12px 0;display:flex;justify-content:space-between;gap:10px}
.pass{color:#087443;font-weight:bold}
.fail{color:#b42318;font-weight:bold}
.skip{color:#8a5b00}
@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:12px}}
</style>
</head>
<body>
<main>
<h1>WEB Course-plus セキュリティ診断</h1>
<p class="muted">テスト環境向けの認証・権限チェックです。</p>

<div class="panel">
<div class="notice">
<strong>注意</strong><br>
必ず隔離したテスト環境で実行してください。
大量アクセス、バックドア設置、ログ消去は行いません。
</div>

<label>テスト環境URL</label>
<input id="base" placeholder="https://your-staging.onrender.com">
</div>

<div class="panel">
<h2>テスト用アカウント</h2>
<p class="muted">ロール別検査に必要な場合だけ入力してください。</p>

<div class="grid">
<div>
<label>生徒 Firebase IDトークン</label>
<input id="studentToken" type="password">
<label>生徒 セッションID</label>
<input id="studentSession" type="password">
</div>
<div>
<label>講師 Firebase IDトークン</label>
<input id="teacherToken" type="password">
<label>講師 セッションID</label>
<input id="teacherSession" type="password">
</div>
<div>
<label>管理者 Firebase IDトークン</label>
<input id="adminToken" type="password">
<label>管理者 セッションID</label>
<input id="adminSession" type="password">
</div>
<div>
<label>他人の授業ID</label>
<input id="foreignLesson">
</div>
</div>

<p>
<button id="run">診断を開始</button>
<button id="clear" class="secondary">消去</button>
</p>
</div>

<div class="panel">
<h2>診断結果</h2>
<p id="summary">未実行</p>
<div id="results">診断結果がここに表示されます。</div>
</div>

<p class="muted">
PASSは指定した拒否応答を確認した意味です。
システム全体の安全性を保証するものではありません。
</p>
</main>

<script>
const $ = id => document.getElementById(id);

function addResult(name,status,expected,detail=""){
 const ok=expected.includes(status);
 const div=document.createElement("div");
 div.className="result";

 const left=document.createElement("div");
 const title=document.createElement("strong");
 title.textContent=name;
 left.append(title);

 if(detail){
  const p=document.createElement("p");
  p.className="muted";
  p.textContent=detail;
  left.append(p);
 }

 const right=document.createElement("span");
 right.className=ok?"pass":"fail";
 right.textContent=(ok?"PASS":"FAIL")+" · HTTP "+status;

 div.append(left,right);
 $("results").append(div);
 return ok;
}

async function request(base,path,options={},expected=[401]){
 try{
  const r=await fetch(base+path,{
   ...options,
   cache:"no-store",
   credentials:"omit",
   signal:AbortSignal.timeout(10000)
  });
  const body=(await r.text()).slice(0,180);
  return addResult(path,r.status,expected,body);
 }catch(e){
  return addResult(path,"ERROR",expected,e.message);
 }
}

function auth(token,session){
 return {
  headers:{
   Authorization:"Bearer "+token,
   "X-Session-ID":session
  }
 };
}

$("run").onclick=async()=>{
 const base=($("base").value.trim()||location.origin).replace(/\/$/,"");

 if(!/^https:\/\//i.test(base)){
  alert("HTTPSのテスト環境URLを入力してください");
  return;
 }

 if(!confirm("隔離されたテスト環境ですか？\n"+base)){
  return;
 }

 $("run").disabled=true;
 $("results").replaceChildren();

 let passed=0;
 let total=0;

 async function test(...args){
  total++;
  if(await request(...args))passed++;
 }

 // 未認証アクセス
 await test(base,"/api/me",{},[401]);
 await test(base,"/api/student/lessons",{},[401]);
 await test(base,"/api/admin/overview",{},[401]);
 await test(base,"/api/admin/security",{},[401]);

 // 偽造トークン
 await test(
  base,
  "/api/me",
  {headers:{Authorization:"Bearer forged.invalid.token"}},
  [401]
 );

 const st=$("studentToken").value;
 const ss=$("studentSession").value;
 const tt=$("teacherToken").value;
 const ts=$("teacherSession").value;
 const at=$("adminToken").value;
 const as=$("adminSession").value;

 // 生徒から管理者API
 if(st&&ss){
  await test(
   base,
   "/api/admin/overview",
   auth(st,ss),
   [403]
  );
 }

 // 講師から管理者API
 if(tt&&ts){
  await test(
   base,
   "/api/admin/overview",
   auth(tt,ts),
   [403]
  );
 }

 // 管理者から生徒専用API
 if(at&&as){
  await test(
   base,
   "/api/student/lessons",
   auth(at,as),
   [403]
  );
 }

 // 他人の授業への入室
 const lesson=$("foreignLesson").value.trim();

 if(st&&ss&&lesson){
  const a=auth(st,ss);
  await test(
   base,
   "/api/livekit/token",
   {
    method:"POST",
    headers:{
     ...a.headers,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({lessonId:lesson})
   },
   [403]
  );
 }

 $("summary").textContent=
  passed+" PASS / "+(total-passed)+" その他 / "+total+" 項目";

 $("run").disabled=false;
};

$("clear").onclick=()=>{
 [
  "base","studentToken","studentSession",
  "teacherToken","teacherSession",
  "adminToken","adminSession","foreignLesson"
 ].forEach(id=>$(id).value="");

 $("results").textContent="診断結果がここに表示されます。";
 $("summary").textContent="未実行";
};
</script>
</body>
</html>
