
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生徒ダッシュボード | WEB Course-plus</title>
  <link rel="stylesheet" href="/assets/css/common.css">
</head>

<body>

<div class="app">

  <!-- Header -->
  <header class="app-header">

    <div class="header-left">
      <button class="menu-toggle" data-sidebar-toggle aria-label="メニュー">
        
      </button>

      <a href="/student/dashboard.html" class="brand">
        <span class="brand-mark">W</span>
        WEB Course-plus
      </a>
    </div>

    <div class="header-right">
      <div class="user-info">
        <span class="user-avatar" id="header-avatar">生</span>
        <span class="user-name" id="header-name">読み込み中</span>
      </div>

      <button class="btn btn-secondary btn-sm" data-logout>
        ログアウト
      </button>
    </div>

  </header>

  <!-- Sidebar -->
  <aside class="app-sidebar">

    <div class="sidebar-section">生徒メニュー</div>

    <a href="/student/dashboard.html" class="sidebar-link active">
      <span class="sidebar-icon"></span>
      ダッシュボード
    </a>

    <a href="/student/history.html" class="sidebar-link">
      <span class="sidebar-icon"></span>
      授業履歴
    </a>

    <a href="/student/profile.html" class="sidebar-link">
      <span class="sidebar-icon">○</span>
      アカウント情報
    </a>

    <div class="sidebar-section">アカウント</div>

    <button
      class="sidebar-link"
      data-logout
      style="width:100%;border:0;background:transparent;text-align:left"
    >
      <span class="sidebar-icon"></span>
      ログアウト
    </button>

  </aside>

  <!-- Main -->
  <main class="app-main">

    <div class="page-container">

      <div class="page-heading">
        <div>
          <h1 class="page-title">ダッシュボード</h1>
          <p class="page-description" id="welcome-message">
            あなたの授業予定を確認できます。
          </p>
        </div>
      </div>

      <div id="message" class="hidden mb-2" role="alert"></div>

      <!-- Statistics -->
      <section class="grid grid-3 mb-3">

        <div class="stat-card">
          <div class="stat-label">予定されている授業</div>
          <div class="stat-value" id="upcoming-count">-</div>
          <div class="stat-note">今後の授業</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">本日の授業</div>
          <div class="stat-value" id="today-count">-</div>
          <div class="stat-note">本日予定されている授業</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">終了した授業</div>
          <div class="stat-value" id="completed-count">-</div>
          <div class="stat-note">授業履歴</div>
        </div>

      </section>

      <!-- Upcoming lessons -->
      <section class="card">

        <div class="card-header">
          <div>
            <h2 class="card-title">授業予定</h2>
            <p class="card-description">
              講師から設定されたあなたの授業です。
            </p>
          </div>

          <a href="/student/history.html" class="btn btn-secondary btn-sm">
            授業履歴を見る
          </a>
        </div>

        <div id="lesson-loading" class="loading">
          <span class="spinner"></span>
          授業情報を読み込んでいます...
        </div>

        <div id="lesson-list" class="grid" style="gap:14px"></div>

        <div id="lesson-empty" class="empty-state hidden">
          <div class="empty-state-title">授業はまだ設定されていません</div>
          <p>
            講師が授業を設定すると、ここに表示されます。
          </p>
        </div>

      </section>

      <!-- Account information -->
      <section class="card mt-3">

        <div class="card-header">
          <h2 class="card-title">アカウント情報</h2>

          <a href="/student/profile.html" class="btn btn-secondary btn-sm">
            詳細を見る
          </a>
        </div>

        <div class="grid grid-2">

          <div>
            <div class="text-muted">氏名</div>
            <strong id="profile-name">-</strong>
          </div>

          <div>
            <div class="text-muted">メールアドレス</div>
            <strong id="profile-email">-</strong>
          </div>

        </div>

      </section>

      <footer id="app-footer"></footer>

    </div>

  </main>

</div>

<script type="module">
  import { auth, db } from "/assets/js/firebase.js";

  import {
    requireRole
  } from "/assets/js/auth.js";

  import {
    initializeSidebar,
    initializeLogout,
    formatDateTime,
    toDate,
    escapeHTML,
    showMessage,
    renderFooter
  } from "/assets/js/common.js";

  import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  // ========================================
  // DOM
  // ========================================

  const lessonList = document.getElementById("lesson-list");
  const lessonLoading = document.getElementById("lesson-loading");
  const lessonEmpty = document.getElementById("lesson-empty");

  let currentProfile = null;

  // ========================================
  // 初期化
  // ========================================

  initializeSidebar();
  initializeLogout();
  renderFooter();

  // ========================================
  // 日付処理
  // ========================================

  function isToday(date) {
    const now = new Date();

    return date.getFullYear() === now.getFullYear() &&
      date.getMonth() === now.getMonth() &&
      date.getDate() === now.getDate();
  }

  function canJoinLesson(lesson) {
    if (!["scheduled", "in_progress"].includes(lesson.status)) {
      return false;
    }

    const startAt = toDate(lesson.startAt);
    const endAt = toDate(lesson.endAt);

    if (!startAt || !endAt) return false;

    const now = new Date();

    const allowedStart = new Date(
      startAt.getTime() - 5 * 60 * 1000
    );

    const allowedEnd = new Date(
      endAt.getTime() + 30 * 60 * 1000
    );

    return now >= allowedStart && now <= allowedEnd;
  }

  function getStatusLabel(status) {
    const labels = {
      scheduled: ["予定", "badge-primary"],
      in_progress: ["授業中", "badge-success"],
      completed: ["終了", "badge-gray"],
      cancelled: ["キャンセル", "badge-danger"]
    };

    return labels[status] || ["不明", "badge-gray"];
  }

  // ========================================
  // 講師名取得
  // ========================================

  const teacherCache = new Map();

  async function getTeacherName(teacherId) {
    if (!teacherId) return "未設定";

    if (teacherCache.has(teacherId)) {
      return teacherCache.get(teacherId);
    }

    try {
      const snapshot = await getDoc(
        doc(db, "users", teacherId)
      );

      const name = snapshot.exists()
        ? (
            snapshot.data().displayName ||
            snapshot.data().name ||
            "講師"
          )
        : "講師";

      teacherCache.set(teacherId, name);

      return name;

    } catch (error) {
      console.error("[Teacher]", error);
      return "講師";
    }
  }

  // ========================================
  // 授業カード
  // ========================================

  async function createLessonCard(lesson) {
    const teacherName = await getTeacherName(lesson.teacherId);

    const status = getStatusLabel(lesson.status);

    const startAt = toDate(lesson.startAt);
    const endAt = toDate(lesson.endAt);

    const card = document.createElement("article");

    card.className = "card";
    card.style.padding = "18px";

    const title = escapeHTML(lesson.title || "個別指導");

    const subject = escapeHTML(lesson.subject || "教科未設定");

    const description = escapeHTML(
      lesson.description || "授業内容は設定されていません。"
    );

    const safeTeacher = escapeHTML(teacherName);

    const dateText = startAt
      ? formatDateTime(startAt)
      : "日時未設定";

    const timeText = startAt && endAt
      ? `${startAt.toLocaleTimeString("ja-JP", {
          hour: "2-digit",
          minute: "2-digit"
        })} ～ ${endAt.toLocaleTimeString("ja-JP", {
          hour: "2-digit",
          minute: "2-digit"
        })}`
      : "";

    const joinEnabled = canJoinLesson(lesson);

    card.innerHTML = `
      <div class="flex items-center justify-between gap-2"
           style="flex-wrap:wrap">

        <div>
          <span class="badge badge-primary">${subject}</span>
          <span class="badge ${status[1]}">${status[0]}</span>
        </div>

        <span class="text-muted" style="font-size:12px">
          ${escapeHTML(dateText)}
        </span>

      </div>

      <h3 style="font-size:17px;margin:14px 0 8px">
        ${title}
      </h3>

      <p class="text-muted" style="line-height:1.8;margin:0 0 14px">
        ${description}
      </p>

      <div class="grid grid-2" style="margin-bottom:15px">

        <div>
          <div class="text-muted" style="font-size:12px">担当講師</div>
          <strong>${safeTeacher}</strong>
        </div>

        <div>
          <div class="text-muted" style="font-size:12px">授業時間</div>
          <strong>${escapeHTML(timeText || "-")}</strong>
        </div>

      </div>

      <div class="flex items-center justify-between gap-2"
           style="flex-wrap:wrap">

        <span class="text-muted" style="font-size:12px">
          ${joinEnabled
            ? "オンライン授業に参加できます。"
            : "参加可能時間になると入室できます。"}
        </span>

        <button
          type="button"
          class="btn ${joinEnabled ? "btn-primary" : "btn-secondary"}"
          data-join="${escapeHTML(lesson.id)}"
          ${joinEnabled ? "" : "disabled"}
        >
          ${joinEnabled ? "授業に参加する" : "入室時間外"}
        </button>

      </div>
    `;

    const joinButton = card.querySelector("[data-join]");

    joinButton.addEventListener("click", () => {
      const lessonId = joinButton.dataset.join;

      window.location.href =
        `/lesson/room.html?lessonId=${encodeURIComponent(lessonId)}`;
    });

    return card;
  }

  // ========================================
  // 授業読み込み
  // ========================================

  async function loadLessons(uid) {
    lessonLoading.classList.remove("hidden");
    lessonEmpty.classList.add("hidden");
    lessonList.innerHTML = "";

    try {
      const lessonsQuery = query(
        collection(db, "lessons"),
        where("studentId", "==", uid)
      );

      const snapshot = await getDocs(lessonsQuery);

      const lessons = snapshot.docs.map(document => ({
        id: document.id,
        ...document.data()
      }));

      lessons.sort((a, b) => {
        const dateA = toDate(a.startAt)?.getTime() || 0;
        const dateB = toDate(b.startAt)?.getTime() || 0;

        return dateA - dateB;
      });

      const now = new Date();

      const upcoming = lessons.filter(lesson => {
        return (
          ["scheduled", "in_progress"].includes(lesson.status) &&
          toDate(lesson.endAt) &&
          toDate(lesson.endAt) >= now
        );
      });

      const completed = lessons.filter(
        lesson => lesson.status === "completed"
      );

      const todayLessons = upcoming.filter(lesson => {
        const date = toDate(lesson.startAt);
        return date && isToday(date);
      });

      document.getElementById("upcoming-count").textContent =
        upcoming.length;

      document.getElementById("today-count").textContent =
        todayLessons.length;

      document.getElementById("completed-count").textContent =
        completed.length;

      if (upcoming.length === 0) {
        lessonEmpty.classList.remove("hidden");
        return;
      }

      for (const lesson of upcoming) {
        const card = await createLessonCard(lesson);
        lessonList.appendChild(card);
      }

    } catch (error) {
      console.error("[Lessons]", error);

      showMessage(
        "授業情報を取得できませんでした。Firestoreのアクセス権限を確認してください。",
        "danger"
      );

    } finally {
      lessonLoading.classList.add("hidden");
    }
  }

  // ========================================
  // 起動
  // ========================================

  async function initializeDashboard() {
    try {
      const result = await requireRole("student");

      if (!result) return;

      const { user, profile } = result;

      currentProfile = profile;

      const displayName =
        profile.displayName ||
        profile.name ||
        "生徒";

      document.getElementById("header-name").textContent =
        displayName;

      document.getElementById("header-avatar").textContent =
        displayName.charAt(0);

      document.getElementById("welcome-message").textContent =
        `${displayName}さん、お疲れさまです。授業予定を確認しましょう。`;

      document.getElementById("profile-name").textContent =
        displayName;

      document.getElementById("profile-email").textContent =
        user.email || "-";

      await loadLessons(user.uid);

    } catch (error) {
      console.error("[Dashboard]", error);

      showMessage(
        error.message || "画面の読み込みに失敗しました。",
        "danger"
      );
    }
  }

  initializeDashboard();
</script>

</body>
</html>
