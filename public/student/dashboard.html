<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダッシュボード | WEB Course-plus</title>

  <link rel="stylesheet" href="/assets/css/common.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #182334;
      font-family: Inter, "Noto Sans JP", sans-serif;
    }

    .app {
      min-height: 100vh;
    }

    .app-main {
      min-width: 0;
    }

    .page-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px;
    }

    .page-heading {
      margin-bottom: 28px;
    }

    .page-title {
      margin: 0 0 8px;
      font-size: 27px;
      font-weight: 700;
    }

    .page-description {
      color: #64748b;
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat-card,
    .content-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);
    }

    .stat-label {
      color: #64748b;
      font-size: 14px;
    }

    .stat-value {
      margin: 10px 0 5px;
      font-size: 32px;
      font-weight: 700;
    }

    .stat-note {
      color: #94a3b8;
      font-size: 12px;
    }

    .content-card {
      margin-bottom: 22px;
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .card-heading h2 {
      margin: 0;
      font-size: 19px;
    }

    .card-description {
      margin: 6px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .lesson-list {
      display: grid;
      gap: 14px;
    }

    .lesson-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px;
      background: #fff;
    }

    .lesson-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lesson-title {
      margin: 13px 0 8px;
      font-size: 18px;
    }

    .lesson-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 16px 0;
    }

    .muted {
      color: #64748b;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .badge-green {
      background: #dcfce7;
      color: #166534;
    }

    .badge-gray {
      background: #f1f5f9;
      color: #475569;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 15px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .empty-state {
      padding: 35px 15px;
      text-align: center;
      color: #64748b;
    }

    .error-message {
      padding: 14px 16px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      margin-bottom: 18px;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    .account-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    footer {
      padding: 25px 0;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .page-container {
        padding: 20px 15px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .account-grid,
      .lesson-meta {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle"
              data-sidebar-toggle
              aria-label="メニュー"></button>

      <a href="/student/dashboard.html" class="brand">
        <span class="brand-mark">W</span>
        WEB Course-plus
      </a>
    </div>

    <div class="header-right">
      <div class="user-info">
        <span class="user-avatar" id="header-avatar">生</span>
        <span class="user-name" id="header-name">読み込み中</span>
      </div>

      <button class="btn btn-secondary btn-sm" data-logout>
        ログアウト
      </button>
    </div>
  </header>

  <aside class="app-sidebar">
    <div class="sidebar-section">生徒メニュー</div>

    <a href="/student/dashboard.html"
       class="sidebar-link active">
      <span class="sidebar-icon"></span>
      ダッシュボード
    </a>

    <a href="/student/history.html" class="sidebar-link">
      <span class="sidebar-icon"></span>
      授業履歴
    </a>

    <a href="/student/profile.html" class="sidebar-link">
      <span class="sidebar-icon"></span>
      アカウント情報
    </a>

    <div class="sidebar-section">アカウント</div>

    <button class="sidebar-link"
            data-logout
            style="width:100%;border:0;background:transparent;text-align:left">
      ログアウト
    </button>
  </aside>

  <main class="app-main">
    <div class="page-container">

      <div class="page-heading">
        <h1 class="page-title">ダッシュボード</h1>
        <p class="page-description" id="welcome-message">
          あなたの授業予定を確認できます。
        </p>
      </div>

      <div id="error-message"
           class="error-message hidden"
           role="alert"></div>

      <section class="stats">
        <div class="stat-card">
          <div class="stat-label">予定されている授業</div>
          <div class="stat-value" id="upcoming-count">-</div>
          <div class="stat-note">今後の授業</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">本日の授業</div>
          <div class="stat-value" id="today-count">-</div>
          <div class="stat-note">本日予定されている授業</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">終了した授業</div>
          <div class="stat-value" id="completed-count">-</div>
          <div class="stat-note">授業履歴</div>
        </div>
      </section>

      <section class="content-card">
        <div class="card-heading">
          <div>
            <h2>授業予定</h2>
            <p class="card-description">
              講師から設定されたあなたの授業です。
            </p>
          </div>

          <a href="/student/history.html" class="btn">
            授業履歴を見る
          </a>
        </div>

        <div id="lesson-loading" class="empty-state">
          授業情報を読み込んでいます...
        </div>

        <div id="lesson-list" class="lesson-list"></div>

        <div id="lesson-empty" class="empty-state hidden">
          授業はまだ設定されていません。
        </div>
      </section>

      <section class="content-card">
        <div class="card-heading">
          <h2>アカウント情報</h2>
          <a href="/student/profile.html" class="btn">
            詳細を見る
          </a>
        </div>

        <div class="account-grid">
          <div>
            <div class="muted">氏名</div>
            <strong id="profile-name">-</strong>
          </div>

          <div>
            <div class="muted">メールアドレス</div>
            <strong id="profile-email">-</strong>
          </div>
        </div>
      </section>

      <footer>
        © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
      </footer>

    </div>
  </main>
</div>

<script type="module">
  import { auth } from "/assets/js/firebase.js";

  import {
    requireRole
  } from "/assets/js/auth.js";

  import {
    initializeSidebar,
    initializeLogout
  } from "/assets/js/common.js";

  const $ = id => document.getElementById(id);

  initializeSidebar();
  initializeLogout();

  function showError(message) {
    $("error-message").textContent = message;
    $("error-message").classList.remove("hidden");
  }

  function toDate(value) {
    if (!value) return null;

    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function formatDate(date) {
    if (!date) return "日時未設定";

    return date.toLocaleString("ja-JP", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      weekday: "short",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function isToday(date) {
    if (!date) return false;

    const now = new Date();

    return date.getFullYear() === now.getFullYear() &&
      date.getMonth() === now.getMonth() &&
      date.getDate() === now.getDate();
  }

  function canJoin(lesson) {
    if (!["scheduled", "in_progress"].includes(lesson.status)) {
      return false;
    }

    const start = toDate(lesson.startAt);
    const end = toDate(lesson.endAt);

    if (!start || !end) return false;

    const now = new Date();

    return now >= new Date(start.getTime() - 5 * 60000) &&
      now <= new Date(end.getTime() + 30 * 60000);
  }

  function createLessonCard(lesson) {
    const start = toDate(lesson.startAt);
    const end = toDate(lesson.endAt);

    const statusLabels = {
      scheduled: "予定",
      in_progress: "授業中",
      completed: "終了",
      cancelled: "キャンセル"
    };

    const status = statusLabels[lesson.status] || "不明";
    const joinEnabled = canJoin(lesson);

    const card = document.createElement("article");
    card.className = "lesson-card";

    card.innerHTML = `
      <div class="lesson-top">
        <div>
          <span class="badge">
            ${escapeHTML(lesson.subject || "教科未設定")}
          </span>
          <span class="badge ${lesson.status === "in_progress" ? "badge-green" : "badge-gray"}">
            ${escapeHTML(status)}
          </span>
        </div>
        <span class="muted">${escapeHTML(formatDate(start))}</span>
      </div>

      <h3 class="lesson-title">
        ${escapeHTML(lesson.title || "個別指導")}
      </h3>

      <p class="muted">
        ${escapeHTML(lesson.description || "授業内容は設定されていません。")}
      </p>

      <div class="lesson-meta">
        <div>
          <div class="muted">講師</div>
          <strong>${escapeHTML(lesson.teacherName || "講師")}</strong>
        </div>

        <div>
          <div class="muted">授業時間</div>
          <strong>
            ${start && end
              ? `${start.toLocaleTimeString("ja-JP", {hour:"2-digit",minute:"2-digit"})} ～ ${end.toLocaleTimeString("ja-JP", {hour:"2-digit",minute:"2-digit"})}`
              : "未設定"}
          </strong>
        </div>
      </div>

      <button type="button"
              class="btn ${joinEnabled ? "btn-primary" : ""}"
              ${joinEnabled ? "" : "disabled"}>
        ${joinEnabled ? "授業に参加する" : "入室時間外"}
      </button>
    `;

    const button = card.querySelector("button");

    if (joinEnabled) {
      button.addEventListener("click", () => {
        location.href =
          `/lesson/room.html?lessonId=${encodeURIComponent(lesson.id)}`;
      });
    }

    return card;
  }

  async function loadLessons(uid) {
    $("lesson-loading").classList.remove("hidden");
    $("lesson-empty").classList.add("hidden");
    $("lesson-list").replaceChildren();

    try {
      const user = auth.currentUser;

      if (!user || user.uid !== uid) {
        throw new Error("ログイン状態を確認できません。再ログインしてください。");
      }

      const token = await user.getIdToken();
      const sessionId =
        localStorage.getItem("web-course-plus-device-session");

      if (!sessionId) {
        throw new Error("端末セッションが見つかりません。再ログインしてください。");
      }

      const response = await fetch("/api/student/lessons", {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${token}`,
          "X-Session-Id": sessionId
        },
        cache: "no-store"
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(
          result.error || `授業情報の取得に失敗しました（${response.status}）。`
        );
      }

      const lessons = Array.isArray(result.lessons)
        ? result.lessons
        : [];

      const now = new Date();

      const upcoming = lessons.filter(lesson => {
        const end = toDate(lesson.endAt);

        return ["scheduled", "in_progress"].includes(lesson.status) &&
          end && end >= now;
      });

      const completed = lessons.filter(
        lesson => lesson.status === "completed"
      );

      const today = upcoming.filter(lesson =>
        isToday(toDate(lesson.startAt))
      );

      $("upcoming-count").textContent = upcoming.length;
      $("today-count").textContent = today.length;
      $("completed-count").textContent = completed.length;

      if (upcoming.length === 0) {
        $("lesson-empty").classList.remove("hidden");
        return;
      }

      upcoming.forEach(lesson => {
        $("lesson-list").appendChild(createLessonCard(lesson));
      });

    } catch (error) {
      console.error("[Dashboard lessons]", error);
      showError(error.message || "授業情報を取得できませんでした。");
    } finally {
      $("lesson-loading").classList.add("hidden");
    }
  }

  async function initializeDashboard() {
    try {
      const result = await requireRole("student");
      if (!result) return;

      const { user, profile } = result;

      const name =
        profile.displayName ||
        profile.name ||
        "生徒";

      $("header-name").textContent = name;
      $("header-avatar").textContent = name.charAt(0);
      $("welcome-message").textContent =
        `${name}さん、お疲れさまです。授業予定を確認しましょう。`;

      $("profile-name").textContent = name;
      $("profile-email").textContent = user.email || "-";

      await loadLessons(user.uid);

    } catch (error) {
      console.error("[Dashboard]", error);
      showError(error.message || "画面の読み込みに失敗しました。");
    }
  }

  initializeDashboard();
</script>
</body>
</html>
