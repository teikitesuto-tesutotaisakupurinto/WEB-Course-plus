<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講師プロフィール | WEB Course-plus</title>
  <link rel="stylesheet" href="/assets/css/common.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" data-sidebar-toggle aria-label="メニュー">☰</button>
      <a href="/teacher/dashboard.html" class="brand">
        <span class="brand-mark">W</span> WEB Course-plus
      </a>
    </div>
    <div class="header-right">
      <span id="header-name" class="user-name">講師</span>
      <button class="btn btn-secondary btn-sm" data-logout>ログアウト</button>
    </div>
  </header>

  <aside class="app-sidebar">
    <div class="sidebar-section">講師メニュー</div>
    <a href="/teacher/dashboard.html" class="sidebar-link">ダッシュボード</a>
    <a href="/teacher/lessons.html" class="sidebar-link">授業を設定する</a>
    <a href="/teacher/students.html" class="sidebar-link">生徒一覧</a>
    <a href="/teacher/schedule.html" class="sidebar-link">授業スケジュール</a>
    <a href="/teacher/records.html" class="sidebar-link">指導記録</a>
    <a href="/teacher/profile.html" class="sidebar-link active">アカウント情報</a>
    <div class="sidebar-section">アカウント</div>
    <button class="sidebar-link" data-logout
      style="width:100%;border:0;background:transparent;text-align:left">
      ログアウト
    </button>
  </aside>

  <main class="app-main">
    <div class="page-container">
      <div class="page-heading">
        <div>
          <h1 class="page-title">講師プロフィール</h1>
          <p class="page-description">講師として登録されているプロフィール情報を管理します。</p>
        </div>
      </div>

      <div id="message" class="hidden mb-2" role="alert"></div>

      <section class="card">
        <div class="card-header">
          <h2 class="card-title">プロフィール編集</h2>
        </div>

        <div id="loading" class="loading">
          <span class="spinner"></span>読み込み中...
        </div>

        <form id="profile-form" class="hidden">
          <div class="form-group">
            <label class="form-label" for="display-name">表示名 *</label>
            <input id="display-name" class="form-control"
              type="text" maxlength="50" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">メールアドレス</label>
            <input id="email" class="form-control" type="email" disabled>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">電話番号</label>
            <input id="phone" class="form-control"
              type="tel" maxlength="30">
          </div>

          <div class="form-group">
            <label class="form-label" for="introduction">講師紹介</label>
            <textarea id="introduction" class="form-control"
              rows="5" maxlength="2000"
              placeholder="指導方針、得意科目、経歴など"></textarea>
          </div>

          <div class="flex" style="justify-content:flex-end">
            <button id="save-button" type="submit" class="btn btn-primary">
              変更を保存
            </button>
          </div>
        </form>
      </section>

      <section class="card mt-3">
        <div class="card-header">
          <h2 class="card-title">アカウント情報</h2>
        </div>
        <div class="grid grid-2">
          <div>
            <div class="text-muted">アカウント種別</div>
            <strong>講師</strong>
          </div>
          <div>
            <div class="text-muted">アカウント状態</div>
            <strong id="account-status">確認中</strong>
          </div>
          <div>
            <div class="text-muted">ユーザーID</div>
            <code id="user-id">読み込み中</code>
          </div>
        </div>
      </section>

      <footer id="app-footer"></footer>
    </div>
  </main>
</div>

<script type="module">
  import { db } from "/assets/js/firebase.js";
  import { requireRole } from "/assets/js/auth.js";
  import {
    initializeSidebar, initializeLogout, renderFooter, showMessage
  } from "/assets/js/common.js";
  import {
    doc, getDoc, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  initializeSidebar();
  initializeLogout();
  renderFooter();

  const $ = id => document.getElementById(id);
  let currentUser;

  function notify(message, type = "danger") {
    showMessage(message, type);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function loadProfile() {
    const snap = await getDoc(doc(db, "users", currentUser.uid));

    if (!snap.exists()) {
      throw new Error("講師アカウント情報が見つかりません。");
    }

    const profile = snap.data();

    if (profile.role !== "teacher" || profile.status !== "active") {
      throw new Error("このアカウントでは利用できません。");
    }

    $("display-name").value = profile.displayName || profile.name || "";
    $("email").value = currentUser.email || profile.email || "";
    $("phone").value = profile.phone || "";
    $("introduction").value = profile.introduction || "";
    $("header-name").textContent = profile.displayName || profile.name || "講師";
    $("account-status").textContent = "有効";
    $("user-id").textContent = currentUser.uid;

    $("loading").classList.add("hidden");
    $("profile-form").classList.remove("hidden");
  }

  $("profile-form").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("save-button");
    if (button.disabled) return;

    const displayName = $("display-name").value.trim();
    const phone = $("phone").value.trim();
    const introduction = $("introduction").value.trim();

    if (!displayName) {
      notify("表示名を入力してください。");
      return;
    }

    if (displayName.length > 50 ||
        phone.length > 30 ||
        introduction.length > 2000) {
      notify("入力内容が文字数制限を超えています。");
      return;
    }

    button.disabled = true;
    button.textContent = "保存しています...";

    try {
      const profileRef = doc(db, "users", currentUser.uid);
      const latest = await getDoc(profileRef);

      if (!latest.exists() ||
          latest.data().role !== "teacher" ||
          latest.data().status !== "active") {
        throw new Error("アカウントの状態を確認できません。");
      }

      await updateDoc(profileRef, {
        displayName,
        phone,
        introduction,
        updatedAt: serverTimestamp()
      });

      $("header-name").textContent = displayName;
      notify("プロフィールを更新しました。", "success");

    } catch (error) {
      console.error("[Teacher Profile]", error);
      notify(error.message || "プロフィールを更新できませんでした。");
    } finally {
      button.disabled = false;
      button.textContent = "変更を保存";
    }
  });

  async function init() {
    try {
      const result = await requireRole("teacher");
      if (!result) return;

      currentUser = result.user;
      await loadProfile();

    } catch (error) {
      console.error(error);
      $("loading").classList.add("hidden");
      notify(error.message || "プロフィールを読み込めませんでした。");
    }
  }

  init();
</script>

<!-- メンテナンス状態・ログイン状態の確認 -->
<script type="module" src="/assets/js/maintenance-guard.js"></script>
</body>
</html>
