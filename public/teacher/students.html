<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生徒一覧 | WEB Course-plus</title>
  <link rel="stylesheet" href="/assets/css/common.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" data-sidebar-toggle aria-label="メニュー">☰</button>
      <a href="/teacher/dashboard.html" class="brand">
        <span class="brand-mark">W</span> WEB Course-plus
      </a>
    </div>
    <div class="header-right">
      <span id="header-name" class="user-name">講師</span>
      <button class="btn btn-secondary btn-sm" data-logout>ログアウト</button>
    </div>
  </header>

  <aside class="app-sidebar">
    <div class="sidebar-section">講師メニュー</div>
    <a href="/teacher/dashboard.html" class="sidebar-link">ダッシュボード</a>
    <a href="/teacher/lessons.html" class="sidebar-link">授業を設定する</a>
    <a href="/teacher/students.html" class="sidebar-link active">生徒一覧</a>
    <a href="/teacher/schedule.html" class="sidebar-link">授業スケジュール</a>
    <a href="/teacher/records.html" class="sidebar-link">指導記録</a>
    <a href="/teacher/profile.html" class="sidebar-link">アカウント情報</a>
    <div class="sidebar-section">アカウント</div>
    <button class="sidebar-link" data-logout style="width:100%;border:0;background:transparent;text-align:left">ログアウト</button>
  </aside>

  <main class="app-main">
    <div class="page-container">

      <div class="page-heading">
        <div>
          <h1 class="page-title">生徒一覧</h1>
          <p class="page-description">
            登録されている生徒を確認し、授業の対象者を選択できます。
          </p>
        </div>
        <a href="/teacher/lessons.html" class="btn btn-primary">
          授業を設定する
        </a>
      </div>

      <div id="message" class="hidden mb-2" role="alert"></div>

      <section class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">登録生徒</h2>
            <p class="card-description">
              担当講師の固定割り当てはありません。
            </p>
          </div>
          <span class="badge badge-primary" id="student-count">0名</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="search">生徒を検索</label>
          <input
            id="search"
            class="form-control"
            type="search"
            placeholder="氏名で検索"
          >
        </div>

        <div id="loading" class="loading">
          <span class="spinner"></span>生徒情報を読み込んでいます...
        </div>

        <div id="student-list" class="grid grid-2" style="gap:14px"></div>

        <div id="empty" class="empty-state hidden">
          <div class="empty-state-title">該当する生徒はいません</div>
          <p>検索条件を変更してください。</p>
        </div>
      </section>

      <footer id="app-footer"></footer>
    </div>
  </main>
</div>

<script type="module">
  import { db } from "/assets/js/firebase.js";
  import { requireRole } from "/assets/js/auth.js";
  import {
    initializeSidebar, initializeLogout, renderFooter,
    escapeHTML, showMessage
  } from "/assets/js/common.js";
  import {
    collection, query, where, getDocs
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  initializeSidebar();
  initializeLogout();
  renderFooter();

  const $ = id => document.getElementById(id);
  let students = [];

  function renderStudents() {
    const keyword = $("search").value.trim().toLocaleLowerCase("ja");
    const list = $("student-list");

    list.innerHTML = "";

    const filtered = students.filter(student => {
      const name = student.displayName || student.name || "氏名未設定";
      return name.toLocaleLowerCase("ja").includes(keyword);
    });

    $("student-count").textContent = `${filtered.length}名`;

    if (!filtered.length) {
      $("empty").classList.remove("hidden");
      return;
    }

    $("empty").classList.add("hidden");

    for (const student of filtered) {
      const name = student.displayName || student.name || "氏名未設定";

      const card = document.createElement("article");
      card.className = "card";
      card.style.padding = "17px";

      card.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <strong>${escapeHTML(name)}</strong>
          <span class="badge badge-success">利用中</span>
        </div>

        <p class="text-muted" style="margin:10px 0 14px">
          ${escapeHTML(student.email || "メールアドレス未登録")}
        </p>

        <a
          class="btn btn-primary btn-sm"
          href="/teacher/lessons.html?studentId=${encodeURIComponent(student.uid)}"
        >
          この生徒に授業を設定
        </a>
      `;

      list.appendChild(card);
    }
  }

  async function init() {
    try {
      const result = await requireRole("teacher");
      if (!result) return;

      const profile = result.profile;

      $("header-name").textContent =
        profile.displayName || profile.name || "講師";

      // 全生徒を取得。assignedTeacherIdsによる絞り込みはしない。
      const snapshot = await getDocs(query(
        collection(db, "users"),
        where("role", "==", "student")
      ));

      students = snapshot.docs
        .map(item => ({
          uid: item.id,
          ...item.data()
        }))
        .filter(student => student.status === "active")
        .sort((a, b) =>
          (a.displayName || a.name || "").localeCompare(
            b.displayName || b.name || "", "ja"
          )
        );

      $("loading").classList.add("hidden");
      renderStudents();

    } catch (error) {
      console.error("[Student List]", error);
      $("loading").classList.add("hidden");

      showMessage(
        error.message || "生徒一覧を取得できませんでした。",
        "danger"
      );
    }
  }

  $("search").addEventListener("input", renderStudents);

  init();
</script>

<!-- メンテナンス状態・ログイン状態の確認 -->
<script type="module" src="/assets/js/maintenance-guard.js"></script>

</body>
</html>
