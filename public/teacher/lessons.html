
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授業設定 | WEB Course-plus</title>
  <link rel="stylesheet" href="/assets/css/common.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" data-sidebar-toggle aria-label="メニュー">☰</button>
      <a href="/teacher/dashboard.html" class="brand">
        <span class="brand-mark">W</span> WEB Course-plus
      </a>
    </div>
    <div class="header-right">
      <span id="header-name" class="user-name">講師</span>
      <button class="btn btn-secondary btn-sm" data-logout>ログアウト</button>
    </div>
  </header>

  <aside class="app-sidebar">
    <div class="sidebar-section">講師メニュー</div>
    <a href="/teacher/dashboard.html" class="sidebar-link">ダッシュボード</a>
    <a href="/teacher/lessons.html" class="sidebar-link active">授業を設定する</a>
    <a href="/teacher/students.html" class="sidebar-link">生徒一覧</a>
    <a href="/teacher/schedule.html" class="sidebar-link">授業スケジュール</a>
    <a href="/teacher/records.html" class="sidebar-link">指導記録</a>
    <a href="/teacher/profile.html" class="sidebar-link">アカウント情報</a>
    <div class="sidebar-section">アカウント</div>
    <button class="sidebar-link" data-logout style="width:100%;border:0;background:transparent;text-align:left">ログアウト</button>
  </aside>

  <main class="app-main">
    <div class="page-container">
      <div class="page-heading">
        <div>
          <h1 class="page-title">授業を設定する</h1>
          <p class="page-description">生徒を選択して、個別授業を登録します。</p>
        </div>
      </div>

      <div id="message" class="hidden mb-2" role="alert"></div>

      <section class="card">
        <div class="card-header">
          <h2 class="card-title">授業情報</h2>
        </div>

        <form id="lesson-form">
          <div class="form-group">
            <label class="form-label" for="student">授業を受ける生徒 *</label>
            <select id="student" class="form-control" required>
              <option value="">生徒を選択してください</option>
            </select>
            <small class="text-muted">登録済みで利用可能な生徒が表示されます。</small>
          </div>

          <div class="form-group">
            <label class="form-label" for="title">授業名 *</label>
            <input id="title" class="form-control" maxlength="100"
              placeholder="例：数学 個別指導" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="subject">教科 *</label>
            <select id="subject" class="form-control" required>
              <option value="">教科を選択してください</option>
              <option>国語</option>
              <option>数学</option>
              <option>英語</option>
              <option>理科</option>
              <option>社会</option>
              <option>その他</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="description">授業内容</label>
            <textarea id="description" class="form-control" rows="4"
              maxlength="3000" placeholder="授業内容や目標を入力してください。"></textarea>
          </div>

          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label" for="start-date">授業日 *</label>
              <input id="start-date" class="form-control" type="date" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="start-time">開始時刻 *</label>
              <input id="start-time" class="form-control" type="time" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="duration">授業時間 *</label>
            <select id="duration" class="form-control" required>
              <option value="30">30分</option>
              <option value="45">45分</option>
              <option value="50" selected>50分</option>
              <option value="60">60分</option>
              <option value="75">75分</option>
              <option value="90">90分</option>
              <option value="120">120分</option>
            </select>
          </div>

          <div class="alert alert-info">
            登録した授業は、指定した生徒のダッシュボードに表示されます。
          </div>

          <div class="flex gap-2" style="justify-content:flex-end;flex-wrap:wrap">
            <button type="reset" class="btn btn-secondary">入力をリセット</button>
            <button type="submit" id="submit-button" class="btn btn-primary">
              授業を登録する
            </button>
          </div>
        </form>
      </section>

      <section class="card mt-3">
        <div class="card-header">
          <div>
            <h2 class="card-title">最近登録した授業</h2>
            <p class="card-description">自分が登録した授業を確認できます。</p>
          </div>
        </div>
        <div id="recent-loading" class="loading">
          <span class="spinner"></span>読み込み中...
        </div>
        <div id="recent-list" class="grid" style="gap:12px"></div>
        <div id="recent-empty" class="empty-state hidden">
          <div class="empty-state-title">登録済みの授業はありません</div>
        </div>
      </section>

      <footer id="app-footer"></footer>
    </div>
  </main>
</div>

<script type="module">
  import { db } from "/assets/js/firebase.js";
  import { requireRole } from "/assets/js/auth.js";
  import {
    initializeSidebar, initializeLogout, renderFooter,
    showMessage, escapeHTML, toDate, formatDateTime
  } from "/assets/js/common.js";
  import {
    collection, query, where, getDocs, addDoc,
    doc, getDoc, Timestamp, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  initializeSidebar();
  initializeLogout();
  renderFooter();

  const $ = id => document.getElementById(id);
  const form = $("lesson-form");
  let currentUser = null;
  let students = [];

  function notify(text, type = "danger") {
    showMessage(text, type);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function loadStudents() {
    const select = $("student");
    select.disabled = true;

    // 固定の担当講師条件は使用しない
    const snapshot = await getDocs(query(
      collection(db, "users"),
      where("role", "==", "student")
    ));

    students = snapshot.docs
      .map(item => ({ uid: item.id, ...item.data() }))
      .filter(item => item.status === "active")
      .sort((a, b) =>
        (a.displayName || a.name || "").localeCompare(
          b.displayName || b.name || "", "ja"
        )
      );

    for (const student of students) {
      const option = document.createElement("option");
      option.value = student.uid;
      option.textContent =
        student.displayName || student.name || student.email || "氏名未設定";
      select.appendChild(option);
    }

    select.disabled = false;

    if (!students.length) {
      notify("利用可能な生徒アカウントがありません。", "warning");
    }
  }

  async function loadRecentLessons() {
    $("recent-loading").classList.remove("hidden");
    $("recent-empty").classList.add("hidden");
    $("recent-list").innerHTML = "";

    try {
      const snapshot = await getDocs(query(
        collection(db, "lessons"),
        where("teacherId", "==", currentUser.uid)
      ));

      const lessons = snapshot.docs
        .map(item => ({ id: item.id, ...item.data() }))
        .sort((a, b) =>
          (toDate(b.createdAt)?.getTime() || 0) -
          (toDate(a.createdAt)?.getTime() || 0)
        )
        .slice(0, 5);

      $("recent-loading").classList.add("hidden");

      if (!lessons.length) {
        $("recent-empty").classList.remove("hidden");
        return;
      }

      for (const lesson of lessons) {
        const student = students.find(s => s.uid === lesson.studentId);
        const studentName = student
          ? (student.displayName || student.name || "生徒")
          : "生徒";

        const start = toDate(lesson.startAt);
        const card = document.createElement("article");
        card.className = "card";
        card.style.padding = "15px";

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <strong>${escapeHTML(lesson.title || "個別指導")}</strong>
            <span class="badge badge-primary">${escapeHTML(lesson.subject || "教科未設定")}</span>
          </div>
          <p class="text-muted" style="margin:8px 0 0">
            生徒：${escapeHTML(studentName)}
          </p>
          <p class="text-muted" style="margin:4px 0 0">
            ${start ? escapeHTML(formatDateTime(start)) : "日時未設定"}
          </p>
        `;

        $("recent-list").appendChild(card);
      }
    } catch (error) {
      console.error(error);
      $("recent-loading").classList.add("hidden");
      notify("最近の授業を読み込めませんでした。");
    }
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("submit-button");
    if (!currentUser || button.disabled) return;

    const studentId = $("student").value;
    const title = $("title").value.trim();
    const subject = $("subject").value;
    const description = $("description").value.trim();
    const date = $("start-date").value;
    const time = $("start-time").value;
    const duration = Number($("duration").value);

    if (!studentId || !title || !subject || !date || !time) {
      notify("必須項目を入力してください。");
      return;
    }

    // 画面の選択肢だけに依存せず、登録直前にも生徒を再確認
    try {
      const studentSnap = await getDoc(doc(db, "users", studentId));

      if (!studentSnap.exists()) {
        throw new Error("選択した生徒アカウントが見つかりません。");
      }

      const studentData = studentSnap.data();

      if (studentData.role !== "student" || studentData.status !== "active") {
        throw new Error("この生徒アカウントは現在利用できません。");
      }

      const startAt = new Date(`${date}T${time}:00+09:00`);

      if (Number.isNaN(startAt.getTime()) || startAt.getTime() <= Date.now()) {
        throw new Error("授業日時は現在より後に設定してください。");
      }

      const endAt = new Date(startAt.getTime() + duration * 60000);

      button.disabled = true;
      button.textContent = "登録しています...";

      await addDoc(collection(db, "lessons"), {
        studentId,
        teacherId: currentUser.uid,
        title,
        subject,
        description,
        durationMinutes: duration,
        startAt: Timestamp.fromDate(startAt),
        endAt: Timestamp.fromDate(endAt),
        status: "scheduled",
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });

      notify("授業を登録しました。生徒の画面に反映されます。", "success");
      form.reset();
      $("duration").value = "50";

      await loadRecentLessons();

    } catch (error) {
      console.error("[Create Lesson]", error);
      notify(error.message || "授業の登録に失敗しました。");
    } finally {
      button.disabled = false;
      button.textContent = "授業を登録する";
    }
  });

  async function init() {
    try {
      const result = await requireRole("teacher");
      if (!result) return;

      currentUser = result.user;
      const profile = result.profile;

      $("header-name").textContent =
        profile.displayName || profile.name || "講師";

      await loadStudents();
      await loadRecentLessons();

    } catch (error) {
      console.error(error);
      $("recent-loading").classList.add("hidden");
      notify(error.message || "画面を初期化できませんでした。");
    }
  }

  init();
</script>
</body>
</html>
