<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指導記録 | WEB Course-plus</title>
  <link rel="stylesheet" href="/assets/css/common.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" data-sidebar-toggle aria-label="メニュー">☰</button>
      <a href="/teacher/dashboard.html" class="brand">
        <span class="brand-mark">W</span> WEB Course-plus
      </a>
    </div>
    <div class="header-right">
      <span id="header-name" class="user-name">講師</span>
      <button class="btn btn-secondary btn-sm" data-logout>ログアウト</button>
    </div>
  </header>

  <aside class="app-sidebar">
    <div class="sidebar-section">講師メニュー</div>
    <a href="/teacher/dashboard.html" class="sidebar-link">ダッシュボード</a>
    <a href="/teacher/lessons.html" class="sidebar-link">授業を設定する</a>
    <a href="/teacher/students.html" class="sidebar-link">生徒一覧</a>
    <a href="/teacher/schedule.html" class="sidebar-link">授業スケジュール</a>
    <a href="/teacher/records.html" class="sidebar-link active">指導記録</a>
    <a href="/teacher/profile.html" class="sidebar-link">アカウント情報</a>
    <div class="sidebar-section">アカウント</div>
    <button class="sidebar-link" data-logout style="width:100%;border:0;background:transparent;text-align:left">ログアウト</button>
  </aside>

  <main class="app-main">
    <div class="page-container">

      <div class="page-heading">
        <div>
          <h1 class="page-title">指導記録</h1>
          <p class="page-description">
            授業ごとに学習内容や理解度、宿題を記録します。
          </p>
        </div>
      </div>

      <div id="message" class="hidden mb-2" role="alert"></div>

      <section class="card">
        <div class="card-header">
          <h2 class="card-title">指導記録を登録</h2>
        </div>

        <form id="record-form">
          <div class="form-group">
            <label class="form-label" for="lesson">対象の授業 *</label>
            <select id="lesson" class="form-control" required>
              <option value="">授業を選択してください</option>
            </select>
            <small class="text-muted">
              自分が登録した授業のみ選択できます。
            </small>
          </div>

          <div id="selected-lesson" class="alert alert-info hidden"></div>

          <div class="form-group">
            <label class="form-label" for="understanding">理解度 *</label>
            <select id="understanding" class="form-control" required>
              <option value="">選択してください</option>
              <option value="excellent">よく理解できた</option>
              <option value="good">おおむね理解できた</option>
              <option value="partial">一部理解できた</option>
              <option value="needs_support">復習・追加指導が必要</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="content">指導内容 *</label>
            <textarea id="content" class="form-control" rows="5"
              maxlength="5000" placeholder="授業で扱った内容、取り組んだ問題など"
              required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="homework">宿題・課題</label>
            <textarea id="homework" class="form-control" rows="3"
              maxlength="3000" placeholder="次回までに取り組む課題"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="next-plan">次回の指導予定</label>
            <textarea id="next-plan" class="form-control" rows="3"
              maxlength="3000" placeholder="次回の授業で扱う内容"></textarea>
          </div>

          <div class="flex" style="justify-content:flex-end">
            <button type="submit" id="save-button" class="btn btn-primary">
              指導記録を保存
            </button>
          </div>
        </form>
      </section>

      <section class="card mt-3">
        <div class="card-header">
          <div>
            <h2 class="card-title">登録済みの指導記録</h2>
            <p class="card-description">自分が作成した指導記録です。</p>
          </div>
        </div>

        <div id="loading" class="loading">
          <span class="spinner"></span>読み込み中...
        </div>

        <div id="record-list" class="grid" style="gap:12px"></div>

        <div id="empty" class="empty-state hidden">
          <div class="empty-state-title">指導記録はありません</div>
        </div>
      </section>

      <footer id="app-footer"></footer>
    </div>
  </main>
</div>

<script type="module">
  import { db } from "/assets/js/firebase.js";
  import { requireRole } from "/assets/js/auth.js";
  import {
    initializeSidebar, initializeLogout, renderFooter,
    showMessage, escapeHTML, toDate, formatDateTime
  } from "/assets/js/common.js";
  import {
    collection, query, where, getDocs, addDoc,
    doc, getDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  initializeSidebar();
  initializeLogout();
  renderFooter();

  const $ = id => document.getElementById(id);
  let currentUser = null;
  let lessons = [];

  function notify(message, type = "danger") {
    showMessage(message, type);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function lessonLabel(lesson) {
    const date = toDate(lesson.startAt);
    const dateText = date ? formatDateTime(date) : "日時未設定";
    return `${dateText} / ${lesson.studentName} / ${lesson.subject || "教科未設定"} / ${lesson.title || "個別指導"}`;
  }

  async function loadLessons() {
    const snapshot = await getDocs(query(
      collection(db, "lessons"),
      where("teacherId", "==", currentUser.uid)
    ));

    lessons = [];

    for (const item of snapshot.docs) {
      const data = item.data();
      let studentName = "生徒";

      if (data.studentId) {
        const studentSnap = await getDoc(doc(db, "users", data.studentId));
        if (studentSnap.exists()) {
          const student = studentSnap.data();
          studentName = student.displayName || student.name || "生徒";
        }
      }

      lessons.push({
        id: item.id,
        ...data,
        studentName
      });
    }

    lessons.sort((a, b) =>
      (toDate(b.startAt)?.getTime() || 0) -
      (toDate(a.startAt)?.getTime() || 0)
    );

    const select = $("lesson");

    for (const lesson of lessons) {
      const option = document.createElement("option");
      option.value = lesson.id;
      option.textContent = lessonLabel(lesson);
      select.appendChild(option);
    }
  }

  function updateSelectedLesson() {
    const lesson = lessons.find(item => item.id === $("lesson").value);
    const box = $("selected-lesson");

    if (!lesson) {
      box.classList.add("hidden");
      box.textContent = "";
      return;
    }

    box.classList.remove("hidden");
    box.textContent =
      `生徒：${lesson.studentName} ／ 教科：${lesson.subject || "未設定"} ／ 状態：${lesson.status || "不明"}`;
  }

  async function loadRecords() {
    $("loading").classList.remove("hidden");
    $("record-list").innerHTML = "";
    $("empty").classList.add("hidden");

    try {
      const snapshot = await getDocs(query(
        collection(db, "lessonRecords"),
        where("teacherId", "==", currentUser.uid)
      ));

      const records = snapshot.docs
        .map(item => ({ id: item.id, ...item.data() }))
        .sort((a, b) =>
          (toDate(b.createdAt)?.getTime() || 0) -
          (toDate(a.createdAt)?.getTime() || 0)
        );

      $("loading").classList.add("hidden");

      if (!records.length) {
        $("empty").classList.remove("hidden");
        return;
      }

      const understandingLabels = {
        excellent: "よく理解できた",
        good: "おおむね理解できた",
        partial: "一部理解できた",
        needs_support: "追加指導が必要"
      };

      for (const record of records) {
        const created = toDate(record.createdAt);
        const card = document.createElement("article");
        card.className = "card";
        card.style.padding = "16px";

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <strong>${escapeHTML(record.lessonTitle || "授業記録")}</strong>
            <span class="badge badge-primary">
              ${escapeHTML(record.subject || "教科未設定")}
            </span>
          </div>
          <p class="text-muted" style="margin:8px 0">
            生徒：${escapeHTML(record.studentName || "生徒")}
          </p>
          <p style="margin:8px 0">
            <strong>理解度：</strong>
            ${escapeHTML(understandingLabels[record.understanding] || "未設定")}
          </p>
          <p style="white-space:pre-wrap;margin:8px 0">
            <strong>指導内容：</strong><br>
            ${escapeHTML(record.content || "")}
          </p>
          <p style="white-space:pre-wrap;margin:8px 0">
            <strong>宿題・課題：</strong><br>
            ${escapeHTML(record.homework || "なし")}
          </p>
          <p style="white-space:pre-wrap;margin:8px 0">
            <strong>次回の指導予定：</strong><br>
            ${escapeHTML(record.nextPlan || "未設定")}
          </p>
          <p class="text-muted" style="font-size:12px;margin:12px 0 0">
            登録日時：${created ? escapeHTML(formatDateTime(created)) : "不明"}
          </p>
        `;

        $("record-list").appendChild(card);
      }

    } catch (error) {
      console.error("[Records]", error);
      $("loading").classList.add("hidden");
      notify("指導記録を読み込めませんでした。");
    }
  }

  $("lesson").addEventListener("change", updateSelectedLesson);

  $("record-form").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("save-button");
    if (button.disabled) return;

    const lessonId = $("lesson").value;
    const lesson = lessons.find(item => item.id === lessonId);

    if (!lesson) {
      notify("対象の授業を選択してください。");
      return;
    }

    const understanding = $("understanding").value;
    const content = $("content").value.trim();

    if (!understanding || !content) {
      notify("理解度と指導内容を入力してください。");
      return;
    }

    button.disabled = true;
    button.textContent = "保存しています...";

    try {
      // 保存直前に授業の所有者を再確認
      const latestLesson = await getDoc(doc(db, "lessons", lessonId));

      if (!latestLesson.exists() ||
          latestLesson.data().teacherId !== currentUser.uid) {
        throw new Error("この授業の指導記録を登録する権限がありません。");
      }

      await addDoc(collection(db, "lessonRecords"), {
        lessonId,
        teacherId: currentUser.uid,
        studentId: lesson.studentId,
        studentName: lesson.studentName,
        lessonTitle: lesson.title || "個別指導",
        subject: lesson.subject || "",
        understanding,
        content,
        homework: $("homework").value.trim(),
        nextPlan: $("next-plan").value.trim(),
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });

      notify("指導記録を保存しました。", "success");
      $("record-form").reset();
      updateSelectedLesson();
      await loadRecords();

    } catch (error) {
      console.error("[Save Record]", error);
      notify(error.message || "指導記録の保存に失敗しました。");
    } finally {
      button.disabled = false;
      button.textContent = "指導記録を保存";
    }
  });

  async function init() {
    try {
      const result = await requireRole("teacher");
      if (!result) return;

      currentUser = result.user;
      $("header-name").textContent =
        result.profile.displayName || result.profile.name || "講師";

      await loadLessons();
      await loadRecords();

    } catch (error) {
      console.error(error);
      $("loading").classList.add("hidden");
      notify(error.message || "画面を初期化できませんでした。");
    }
  }

  init();
</script>

<!-- メンテナンス状態・ログイン状態の確認 -->
<script type="module" src="/assets/js/maintenance-guard.js"></script>
</body>
</html>
