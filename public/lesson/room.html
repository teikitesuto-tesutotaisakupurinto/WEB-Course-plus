<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>オンライン授業 | WEB Course-plus</title>

<style>
:root {
  --blue:#356fc4;
  --blue-dark:#285da9;
  --ink:#263445;
  --muted:#718096;
  --line:#e1e7ef;
  --surface:#ffffff;
  --background:#f3f6fa;
  --green:#198754;
  --red:#d94848;
}
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; }
body {
  font-family:Inter,"Noto Sans JP",Arial,sans-serif;
  color:var(--ink);
  background:var(--background);
}
button,input { font:inherit; }
button { cursor:pointer; }
.app {
  height:100dvh;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.topbar {
  height:58px;
  flex:0 0 58px;
  background:white;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  gap:14px;
}
.brand { font-size:17px; font-weight:750; letter-spacing:-.3px; }
.brand span { color:var(--blue); }
.lesson-heading {
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.lesson-title {
  font-size:14px;
  font-weight:650;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.subject-tag {
  background:#edf3fc;
  color:#315f9e;
  padding:5px 10px;
  border-radius:6px;
  font-size:11px;
  white-space:nowrap;
}
.status {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}
.status-dot {
  width:8px;height:8px;border-radius:50%;
  background:#a0aab7;
}
.status.connected { color:var(--green); }
.status.connected .status-dot { background:var(--green); }
.status.connecting .status-dot { background:#d69a26; }
.status.error { color:var(--red); }
.status.error .status-dot { background:var(--red); }

.workspace {
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
  gap:12px;
  padding:12px;
}
.main-area {
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.share-panel {
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:12px;
  background:#e9edf2;
  border:1px solid #dce3eb;
  display:flex;
  align-items:center;
  justify-content:center;
}
#shareVideo {
  display:none;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#e9edf2;
}
#annotationCanvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  pointer-events:none;
}
.share-placeholder {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  color:#65758a;
  text-align:center;
  padding:20px;
}
.share-placeholder svg { width:42px;height:42px; }
.share-placeholder strong { font-size:15px; }
.share-placeholder small { font-size:12px; }
.share-label {
  position:absolute;
  top:12px;left:12px;
  padding:6px 10px;
  border-radius:6px;
  background:rgba(255,255,255,.94);
  color:#34465b;
  font-size:11px;
  z-index:3;
  display:none;
}
.annotation-tools {
  position:absolute;
  top:10px;
  right:10px;
  z-index:4;
  display:none;
  align-items:center;
  gap:5px;
  background:rgba(255,255,255,.97);
  border:1px solid var(--line);
  padding:6px;
  border-radius:9px;
  box-shadow:0 2px 10px #24364b18;
}
.tool-button {
  border:1px solid transparent;
  background:white;
  color:#43546a;
  border-radius:6px;
  padding:7px 9px;
  font-size:12px;
}
.tool-button.active {
  background:#eaf1fc;
  border-color:#b8cdec;
  color:var(--blue-dark);
}
.tool-button:hover { background:#f0f4f9; }
.tool-color {
  width:25px;height:25px;padding:0;
  border:2px solid white;
  outline:1px solid #cbd3dd;
  border-radius:50%;
}
.tool-color.active { outline:2px solid var(--blue); }
#penWidth { width:65px; }

.camera-strip {
  height:112px;
  flex:0 0 112px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.camera-tile {
  min-width:0;
  position:relative;
  background:#e4eaf1;
  border:1px solid #d9e1eb;
  border-radius:10px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.camera-tile video {
  width:100%;height:100%;
  object-fit:cover;
  display:none;
}
.camera-placeholder {
  color:#64748b;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.camera-name {
  position:absolute;
  bottom:7px;left:8px;
  background:#ffffffed;
  color:#34465b;
  border-radius:5px;
  padding:4px 7px;
  font-size:10px;
}
.side-panel {
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.panel-card {
  background:white;
  border:1px solid var(--line);
  border-radius:11px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.participants-card { flex:0 0 auto; }
.chat-card { flex:1; }
.panel-heading {
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.count {
  background:#edf2f8;
  color:#52657d;
  padding:3px 7px;
  border-radius:20px;
  font-size:10px;
}
.participant-list {
  padding:8px 12px;
  display:flex;
  flex-direction:column;
  gap:7px;
  max-height:125px;
  overflow:auto;
}
.participant {
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
}
.avatar {
  width:28px;height:28px;
  border-radius:50%;
  background:#eaf0f8;
  color:#42648f;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:700;
  flex:0 0 28px;
}
.participant small { color:var(--muted); margin-left:auto; }
.chat-messages {
  flex:1;
  min-height:0;
  overflow:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.chat-message { font-size:12px; line-height:1.55; }
.chat-message .sender {
  font-size:10px;
  color:var(--muted);
  margin-bottom:3px;
}
.chat-message .bubble {
  background:#f0f4f9;
  padding:8px 10px;
  border-radius:8px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.chat-message.mine .bubble {
  background:#eaf2ff;
}
.chat-compose {
  border-top:1px solid var(--line);
  padding:9px;
  display:flex;
  gap:6px;
}
.chat-compose input {
  min-width:0;flex:1;
  border:1px solid #dce3eb;
  border-radius:7px;
  padding:9px;
  outline:none;
  font-size:12px;
}
.chat-compose input:focus { border-color:var(--blue); }
.chat-compose button {
  border:0;
  border-radius:7px;
  padding:0 12px;
  color:white;
  background:var(--blue);
  font-size:12px;
}
.toolbar {
  min-height:68px;
  flex:0 0 68px;
  background:white;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:8px 14px;
}
.control {
  min-width:75px;
  height:48px;
  border:1px solid #dce3eb;
  background:white;
  color:#34465b;
  border-radius:9px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  font-size:10px;
}
.control svg { width:17px;height:17px; }
.control:hover { background:#f4f7fb; }
.control.off {
  background:#fff0f0;
  color:#c23e3e;
  border-color:#f0caca;
}
.control.primary {
  background:#edf3fc;
  color:var(--blue-dark);
  border-color:#cbdaf0;
}
.control.leave {
  background:#c83e45;
  color:white;
  border-color:#c83e45;
  min-width:85px;
}
.control:disabled { opacity:.45; cursor:not-allowed; }
.footer {
  height:21px;
  flex:0 0 21px;
  text-align:center;
  color:#8793a2;
  font-size:9px;
  background:white;
}
.toast {
  position:fixed;
  left:50%;bottom:90px;
  transform:translateX(-50%);
  background:#27384d;
  color:white;
  border-radius:8px;
  padding:10px 16px;
  font-size:12px;
  z-index:30;
  display:none;
  max-width:90vw;
}
.error-screen {
  height:100dvh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.error-card {
  width:min(430px,100%);
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:28px;
  text-align:center;
}
.error-card h2 { font-size:19px; }
.error-card p { font-size:13px;color:var(--muted);line-height:1.8; }
.error-card button {
  border:0;background:var(--blue);color:white;
  padding:11px 20px;border-radius:8px;
}
@media(max-width:850px) {
  .workspace { grid-template-columns:minmax(0,1fr) 245px; gap:8px;padding:8px; }
  .toolbar { gap:5px; }
  .control { min-width:60px; }
}
@media(max-width:650px) {
  .topbar { padding:0 10px;height:52px;flex-basis:52px; }
  .brand { font-size:14px; }
  .lesson-heading { gap:6px; }
  .subject-tag { display:none; }
  .status { font-size:10px; }
  .workspace {
    display:flex;
    flex-direction:column;
    gap:7px;
    padding:7px;
  }
  .main-area { flex:1; }
  .side-panel { display:none; }
  .camera-strip { height:82px;flex-basis:82px; }
  .toolbar {
    flex:0 0 62px;min-height:62px;
    gap:4px;padding:5px;
  }
  .control { min-width:0;flex:1;height:46px;font-size:9px; }
  .control.leave { min-width:57px; }
  .annotation-tools { max-width:95%;flex-wrap:wrap; }
  .tool-button { padding:5px 7px; }
}
@media(max-height:600px) {
  .topbar { height:46px;flex-basis:46px; }
  .toolbar { min-height:58px;flex-basis:58px; }
  .camera-strip { height:76px;flex-basis:76px; }
  .workspace { padding:7px;gap:7px; }
}
</style>
</head>

<body>
<div class="app" id="app" style="display:none">
  <header class="topbar">
    <div class="brand">WEB <span>Course-plus</span></div>
    <div class="lesson-heading">
      <div class="lesson-title" id="lessonTitle">オンライン授業</div>
      <div class="subject-tag" id="subjectTag">授業準備中</div>
    </div>
    <div class="status connecting" id="connectionStatus">
      <span class="status-dot"></span>
      <span id="connectionText">接続準備中</span>
    </div>
  </header>

  <main class="workspace">
    <section class="main-area">
      <div class="share-panel" id="sharePanel">
        <div class="share-label" id="shareLabel">画面共有</div>
        <video id="shareVideo" autoplay playsinline muted></video>
        <canvas id="annotationCanvas"></canvas>

        <div class="annotation-tools" id="annotationTools">
          <button class="tool-button active" id="penTool" type="button">ペン</button>
          <button class="tool-button" id="eraserTool" type="button">消しゴム</button>
          <button class="tool-color active" data-color="#e53935" style="background:#e53935" title="赤"></button>
          <button class="tool-color" data-color="#2463c5" style="background:#2463c5" title="青"></button>
          <button class="tool-color" data-color="#16834a" style="background:#16834a" title="緑"></button>
          <button class="tool-color" data-color="#222222" style="background:#222222" title="黒"></button>
          <input id="penWidth" type="range" min="2" max="12" value="4" title="ペンの太さ">
          <button class="tool-button" id="clearBoard" type="button">全消去</button>
        </div>

        <div class="share-placeholder" id="sharePlaceholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="13" rx="2"/>
            <path d="M8 21h8M12 17v4M8 9h8M8 12h5"/>
          </svg>
          <strong>先生の画面共有を待っています</strong>
          <small>先生が画面共有を開始すると、ここに表示されます。</small>
        </div>
      </div>

      <div class="camera-strip" id="cameraStrip">
        <div class="camera-tile" id="localCameraTile">
          <video id="localCamera" autoplay playsinline muted></video>
          <div class="camera-placeholder" id="localCameraPlaceholder">自分のカメラ</div>
          <div class="camera-name" id="localCameraName">自分</div>
        </div>
        <div class="camera-tile" id="remoteCameraTile">
          <video id="remoteCamera" autoplay playsinline></video>
          <div class="camera-placeholder" id="remoteCameraPlaceholder">相手のカメラを待っています</div>
          <div class="camera-name" id="remoteCameraName">相手</div>
        </div>
      </div>
    </section>

    <aside class="side-panel">
      <section class="panel-card participants-card">
        <div class="panel-heading">
          <span>参加者</span>
          <span class="count" id="participantCount">0人</span>
        </div>
        <div class="participant-list" id="participantList">
          <div style="font-size:12px;color:#718096">接続を確認しています。</div>
        </div>
      </section>

      <section class="panel-card chat-card">
        <div class="panel-heading">授業チャット</div>
        <div class="chat-messages" id="chatMessages">
          <div style="font-size:12px;color:#718096">メッセージはまだありません。</div>
        </div>
        <form class="chat-compose" id="chatForm">
          <input id="chatInput" maxlength="500" placeholder="メッセージを入力">
          <button type="submit">送信</button>
        </form>
      </section>
    </aside>
  </main>

  <footer class="footer">
    © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
  </footer>

  <div class="toolbar">
    <button class="control" id="micButton" type="button">
      <span>マイク</span><span id="micState">オン</span>
    </button>
    <button class="control" id="cameraButton" type="button">
      <span>カメラ</span><span id="cameraState">オン</span>
    </button>
    <button class="control primary" id="shareButton" type="button">
      <span>画面共有</span><span id="shareState">開始</span>
    </button>
    <button class="control primary" id="drawButton" type="button">
      <span>書き込み</span><span id="drawState">オン</span>
    </button>
    <button class="control" id="chatToggle" type="button">
      <span>チャット</span><span>表示</span>
    </button>
    <button class="control leave" id="leaveButton" type="button">
      <span>退出</span>
    </button>
  </div>
</div>

<div class="error-screen" id="errorScreen">
  <div class="error-card">
    <h2 id="errorTitle">授業に入室できません</h2>
    <p id="errorMessage">授業情報を確認できませんでした。</p>
    <button type="button" onclick="location.href='/login.html'">ログイン画面へ</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { auth, db, authPersistenceReady } from "/assets/js/firebase.js";
import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import {
  doc, getDoc, collection, addDoc, updateDoc, deleteDoc,
  getDocs, onSnapshot, query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
import { Room, RoomEvent, Track } from
  "https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/+esm";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const lessonId = params.get("lessonId");

let currentUser = null;
let profile = null;
let lesson = null;
let room = null;
let connected = false;
let micEnabled = true;
let cameraEnabled = true;
let sharing = false;
let drawingEnabled = true;
let toolMode = "pen";
let penColor = "#e53935";
let penWidth = 4;
let activeStroke = null;
let strokeRef = null;
let strokes = [];
let remoteParticipants = new Map();
let unsubscribers = [];
let localParticipantName = "自分";
let closing = false;

const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function toast(message) {
  $("toast").textContent = message;
  $("toast").style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => $("toast").style.display = "none", 2600);
}

function setConnection(state, message) {
  const el = $("connectionStatus");
  el.className = "status " + state;
  $("connectionText").textContent = message;
}

function showError(title, message) {
  $("app").style.display = "none";
  $("errorScreen").style.display = "flex";
  $("errorTitle").textContent = title;
  $("errorMessage").textContent = message;
}

function getParticipantName(participant) {
  if (participant === room?.localParticipant) {
    return profile?.displayName || currentUser?.displayName || "自分";
  }
  return participant.name || participant.identity || "参加者";
}

function updateParticipants() {
  const list = $("participantList");
  const people = [];

  if (connected && room?.localParticipant) {
    people.push({
      name: getParticipantName(room.localParticipant),
      role: profile?.role === "teacher" ? "先生（あなた）" : "生徒（あなた）",
      local: true
    });
  }

  for (const p of remoteParticipants.values()) {
    people.push({
      name: getParticipantName(p),
      role: "参加中",
      local: false
    });
  }

  $("participantCount").textContent = people.length + "人";
  list.innerHTML = people.length ? people.map(p => `
    <div class="participant">
      <div class="avatar">${escapeHTML(p.name.slice(0,1))}</div>
      <span>${escapeHTML(p.name)}</span>
      <small>${escapeHTML(p.role)}</small>
    </div>
  `).join("") : `<div style="font-size:12px;color:#718096">参加者情報を取得中です。</div>`;
}

function setCameraTile(video, placeholder, track) {
  video.srcObject = null;
  if (!track) {
    video.style.display = "none";
    placeholder.style.display = "flex";
    return;
  }
  track.attach(video);
  video.style.display = "block";
  placeholder.style.display = "none";
  video.play().catch(() => {});
}

function addRemoteAudio(track) {
  const audio = track.attach();
  audio.autoplay = true;
  audio.style.display = "none";
  document.body.appendChild(audio);
}

function showShare(track, isLocal, name) {
  const video = $("shareVideo");
  video.srcObject = null;
  track.attach(video);
  video.style.display = "block";
  $("sharePlaceholder").style.display = "none";
  $("shareLabel").style.display = "block";
  $("shareLabel").textContent = name + "の画面共有";
  $("annotationTools").style.display = "flex";
  video.play().catch(() => {});
  resizeCanvas();
}

function hideShare() {
  const video = $("shareVideo");
  video.srcObject = null;
  video.style.display = "none";
  $("sharePlaceholder").style.display = "flex";
  $("shareLabel").style.display = "none";
  $("annotationTools").style.display = "none";
  clearCanvas();
}

function findSharePublication(participant) {
  return participant?.getTrackPublication?.(Track.Source.ScreenShare);
}

function attachParticipantTracks(participant, isLocal = false) {
  const cameraPub = participant.getTrackPublication?.(Track.Source.Camera);
  if (cameraPub?.track) {
    if (isLocal) {
      setCameraTile($("localCamera"), $("localCameraPlaceholder"), cameraPub.track);
    } else {
      setCameraTile($("remoteCamera"), $("remoteCameraPlaceholder"), cameraPub.track);
    }
  }

  const sharePub = findSharePublication(participant);
  if (sharePub?.track) {
    showShare(sharePub.track, isLocal, isLocal ? "自分" : getParticipantName(participant));
  }
}

function handleTrackSubscribed(track, publication, participant) {
  if (publication.source === Track.Source.ScreenShare) {
    showShare(track, false, getParticipantName(participant));
  } else if (publication.source === Track.Source.Camera) {
    setCameraTile($("remoteCamera"), $("remoteCameraPlaceholder"), track);
  } else if (publication.kind === Track.Kind.Audio) {
    addRemoteAudio(track);
  }
}

function handleTrackUnsubscribed(track, publication) {
  track.detach().forEach(el => el.remove());
  if (publication.source === Track.Source.ScreenShare) hideShare();
  if (publication.source === Track.Source.Camera) {
    setCameraTile($("remoteCamera"), $("remoteCameraPlaceholder"), null);
  }
}

function updateCameraState() {
  $("cameraButton").classList.toggle("off", !cameraEnabled);
  $("cameraState").textContent = cameraEnabled ? "オン" : "オフ";
}
function updateMicState() {
  $("micButton").classList.toggle("off", !micEnabled);
  $("micState").textContent = micEnabled ? "オン" : "オフ";
}
function updateShareState() {
  $("shareButton").classList.toggle("off", !sharing);
  $("shareState").textContent = sharing ? "停止" : "開始";
}

async function toggleMic() {
  try {
    micEnabled = !micEnabled;
    await room.localParticipant.setMicrophoneEnabled(micEnabled);
    updateMicState();
  } catch (e) {
    micEnabled = !micEnabled;
    toast("マイクを変更できませんでした。ブラウザの権限を確認してください。");
  }
}

async function toggleCamera() {
  try {
    cameraEnabled = !cameraEnabled;
    await room.localParticipant.setCameraEnabled(cameraEnabled);
    updateCameraState();
    if (!cameraEnabled) {
      setCameraTile($("localCamera"), $("localCameraPlaceholder"), null);
    }
  } catch (e) {
    cameraEnabled = !cameraEnabled;
    toast("カメラを変更できませんでした。ブラウザの権限を確認してください。");
  }
}

async function toggleShare() {
  try {
    if (!sharing) {
      await room.localParticipant.setScreenShareEnabled(true);
      const publication = findSharePublication(room.localParticipant);
      if (publication?.track) {
        showShare(publication.track, true, "自分");
      }
      sharing = true;
    } else {
      await room.localParticipant.setScreenShareEnabled(false);
      sharing = false;
      hideShare();
    }
    updateShareState();
  } catch (e) {
    toast("画面共有を開始できませんでした。ブラウザの共有権限を確認してください。");
  }
}

function updateDrawButton() {
  $("drawButton").classList.toggle("primary", drawingEnabled);
  $("drawState").textContent = drawingEnabled ? "オン" : "オフ";
  $("annotationCanvas").style.pointerEvents = drawingEnabled ? "auto" : "none";
  $("annotationCanvas").style.cursor = drawingEnabled ? "crosshair" : "default";
}

function resizeCanvas() {
  const canvas = $("annotationCanvas");
  const rect = $("sharePanel").getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  canvas.getContext("2d").setTransform(dpr,0,0,dpr,0,0);
  redrawCanvas();
}

function clearCanvas() {
  const canvas = $("annotationCanvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function drawStroke(ctx, stroke, width, height) {
  if (!stroke?.points?.length) return;
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = Number(stroke.width || 4);
  ctx.strokeStyle = stroke.color || "#e53935";
  ctx.globalCompositeOperation = stroke.mode === "erase" ? "destination-out" : "source-over";
  ctx.beginPath();
  const first = stroke.points[0];
  ctx.moveTo(first.x * width, first.y * height);
  for (let i=1;i<stroke.points.length;i++) {
    const p = stroke.points[i];
    ctx.lineTo(p.x * width, p.y * height);
  }
  if (stroke.points.length === 1) {
    ctx.lineTo(first.x * width + .1, first.y * height + .1);
  }
  ctx.stroke();
  ctx.restore();
}

function redrawCanvas() {
  const canvas = $("annotationCanvas");
  const ctx = canvas.getContext("2d");
  const rect = $("sharePanel").getBoundingClientRect();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (const stroke of strokes) drawStroke(ctx, stroke, rect.width, rect.height);
  if (activeStroke) drawStroke(ctx, activeStroke, rect.width, rect.height);
}

function pointerPoint(event) {
  const rect = $("annotationCanvas").getBoundingClientRect();
  return {
    x: Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),
    y: Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height))
  };
}

const strokesCollection = () => collection(db,"lessonBoards",lessonId,"strokes");

$("annotationCanvas").addEventListener("pointerdown", async event => {
  if (!drawingEnabled || !$("shareVideo").srcObject || !connected) return;
  event.preventDefault();
  $("annotationCanvas").setPointerCapture(event.pointerId);
  activeStroke = {
    color: penColor,
    width: penWidth,
    mode: toolMode,
    points: [pointerPoint(event)],
    createdBy: currentUser.uid
  };
  try {
    strokeRef = await addDoc(strokesCollection(), {
      ...activeStroke,
      createdAt: serverTimestamp()
    });
  } catch (e) {
    toast("書き込みを共有できませんでした。");
    activeStroke = null;
    redrawCanvas();
  }
  redrawCanvas();
});

$("annotationCanvas").addEventListener("pointermove", async event => {
  if (!activeStroke || !strokeRef) return;
  event.preventDefault();
  activeStroke.points.push(pointerPoint(event));
  redrawCanvas();
  try {
    await updateDoc(strokeRef, { points: activeStroke.points });
  } catch (e) {
    console.error("Stroke sync error",e);
  }
});

async function finishStroke() {
  if (!activeStroke) return;
  activeStroke = null;
  strokeRef = null;
  redrawCanvas();
}
$("annotationCanvas").addEventListener("pointerup",finishStroke);
$("annotationCanvas").addEventListener("pointercancel",finishStroke);

function subscribeBoard() {
  const q = query(strokesCollection(),orderBy("createdAt","asc"),limit(500));
  const unsub = onSnapshot(q,snapshot => {
    strokes = snapshot.docs.map(d => ({id:d.id,...d.data()}));
    redrawCanvas();
  },err => {
    console.error("Board listener error",err);
    toast("書き込みの同期に問題が発生しています。");
  });
  unsubscribers.push(unsub);
}

async function clearBoard() {
  if (!confirm("この授業の画面への書き込みをすべて消去しますか？")) return;
  try {
    const snap = await getDocs(strokesCollection());
    await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
    toast("書き込みを消去しました。");
  } catch (e) {
    toast("書き込みを消去できませんでした。");
  }
}

function setTool(mode) {
  toolMode = mode;
  $("penTool").classList.toggle("active",mode==="pen");
  $("eraserTool").classList.toggle("active",mode==="erase");
}
$("penTool").addEventListener("click",()=>setTool("pen"));
$("eraserTool").addEventListener("click",()=>setTool("erase"));
document.querySelectorAll(".tool-color").forEach(button => {
  button.addEventListener("click",() => {
    penColor = button.dataset.color;
    setTool("pen");
    document.querySelectorAll(".tool-color").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
  });
});
$("penWidth").addEventListener("input",e=>penWidth=Number(e.target.value));
$("clearBoard").addEventListener("click",clearBoard);

const messagesCollection = () => collection(db,"lessonMessages",lessonId,"messages");

function subscribeChat() {
  const q = query(messagesCollection(),orderBy("createdAt","asc"),limit(100));
  const unsub = onSnapshot(q,snapshot => {
    const box = $("chatMessages");
    if (snapshot.empty) {
      box.innerHTML = `<div style="font-size:12px;color:#718096">メッセージはまだありません。</div>`;
      return;
    }
    box.innerHTML = snapshot.docs.map(d => {
      const m = d.data();
      const mine = m.senderId === currentUser.uid;
      return `<div class="chat-message ${mine?"mine":""}">
        <div class="sender">${escapeHTML(m.senderName || "参加者")}</div>
        <div class="bubble">${escapeHTML(m.text || "")}</div>
      </div>`;
    }).join("");
    box.scrollTop = box.scrollHeight;
  },err => {
    console.error("Chat listener error",err);
  });
  unsubscribers.push(unsub);
}

$("chatForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const input = $("chatInput");
  const text = input.value.trim();
  if (!text || !connected) return;
  input.disabled = true;
  try {
    await addDoc(messagesCollection(),{
      senderId:currentUser.uid,
      senderName:profile.displayName || currentUser.displayName || "参加者",
      text,
      createdAt:serverTimestamp()
    });
    input.value = "";
  } catch(e) {
    toast("メッセージを送信できませんでした。");
  } finally {
    input.disabled = false;
    input.focus();
  }
});

function setupRoomEvents() {
  room.on(RoomEvent.Connected,()=>{
    connected = true;
    setConnection("connected","入室済み");
    updateParticipants();
  });

  room.on(RoomEvent.Disconnected,()=>{
    connected = false;
    setConnection("error","接続が切断されました");
    updateParticipants();
  });

  room.on(RoomEvent.ParticipantConnected,participant=>{
    remoteParticipants.set(participant.sid,participant);
    updateParticipants();
    attachParticipantTracks(participant,false);
    toast(getParticipantName(participant)+"が入室しました。");
  });

  room.on(RoomEvent.ParticipantDisconnected,participant=>{
    remoteParticipants.delete(participant.sid);
    updateParticipants();
    toast(getParticipantName(participant)+"が退出しました。");
    setCameraTile($("remoteCamera"),$("remoteCameraPlaceholder"),null);
    if (remoteParticipants.size === 0) hideShare();
  });

  room.on(RoomEvent.TrackSubscribed,handleTrackSubscribed);
  room.on(RoomEvent.TrackUnsubscribed,handleTrackUnsubscribed);

  room.on(RoomEvent.LocalTrackPublished,(publication)=>{
    if (publication.source===Track.Source.ScreenShare && publication.track) {
      sharing = true;
      showShare(publication.track,true,"自分");
      updateShareState();
    }
    if (publication.source===Track.Source.Camera && publication.track) {
      setCameraTile($("localCamera"),$("localCameraPlaceholder"),publication.track);
    }
  });

  room.on(RoomEvent.LocalTrackUnpublished,(publication)=>{
    if (publication.source===Track.Source.ScreenShare) {
      sharing = false;
      hideShare();
      updateShareState();
    }
    if (publication.source===Track.Source.Camera) {
      setCameraTile($("localCamera"),$("localCameraPlaceholder"),null);
    }
  });

  room.on(RoomEvent.ConnectionStateChanged,state=>{
    if (state==="reconnecting") setConnection("connecting","再接続中");
    if (state==="connected") {
      connected = true;
      setConnection("connected","入室済み");
      updateParticipants();
    }
    if (state==="disconnected" && !closing) {
      connected = false;
      setConnection("error","接続が切断されました");
      updateParticipants();
    }
  });
}

async function getLessonAndProfile() {
  if (!lessonId) throw new Error("授業情報が指定されていません。");

  const [profileSnap,lessonSnap] = await Promise.all([
    getDoc(doc(db,"users",currentUser.uid)),
    getDoc(doc(db,"lessons",lessonId))
  ]);

  if (!profileSnap.exists()) throw new Error("アカウント情報を確認できません。");
  if (!lessonSnap.exists()) throw new Error("授業が見つかりません。");

  profile = profileSnap.data();
  lesson = lessonSnap.data();

  if (!["teacher","student","admin"].includes(profile.role)) {
    throw new Error("このアカウントでは授業に入室できません。");
  }

  const allowed =
    profile.role==="admin" ||
    (profile.role==="teacher" && lesson.teacherId===currentUser.uid) ||
    (profile.role==="student" && lesson.studentId===currentUser.uid);

  if (!allowed) throw new Error("この授業に入室する権限がありません。");

  if (lesson.status==="cancelled" || lesson.status==="completed") {
    throw new Error("この授業は終了またはキャンセルされています。");
  }

  const start = lesson.startAt?.toDate?.();
  const end = lesson.endAt?.toDate?.();
  const now = new Date();

  if (start && now < new Date(start.getTime()-5*60*1000)) {
    throw new Error("授業開始5分前から入室できます。");
  }
  if (end && now > new Date(end.getTime()+30*60*1000)) {
    throw new Error("入室可能時間を過ぎています。");
  }

  $("lessonTitle").textContent = lesson.title || "個別指導";
  $("subjectTag").textContent = lesson.subject || "授業";
  localParticipantName = profile.displayName || currentUser.displayName || "参加者";
  $("localCameraName").textContent = localParticipantName;
  $("remoteCameraName").textContent = "相手";
}

async function connectLiveKit() {
  setConnection("connecting","接続中");
  const idToken = await currentUser.getIdToken();

  const response = await fetch("/api/livekit/token",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+idToken
    },
    body:JSON.stringify({
      lessonId,
      participantName:localParticipantName
    })
  });

  const data = await response.json().catch(()=>({}));
  if (!response.ok || !data.token || !(data.url || data.serverUrl)) {
    throw new Error(data.message || "授業サーバーに接続できませんでした。");
  }

  room = new Room({
    adaptiveStream:true,
    dynacast:true
  });

  setupRoomEvents();
  await room.connect(data.url || data.serverUrl,data.token);

  connected = true;
  setConnection("connected","入室済み");
  updateParticipants();
  attachParticipantTracks(room.localParticipant,true);

  for (const participant of room.remoteParticipants.values()) {
    remoteParticipants.set(participant.sid,participant);
    attachParticipantTracks(participant,false);
  }
  updateParticipants();

  // 入室後にマイク・カメラを有効化。権限拒否時も授業には入室できる。
  try {
    await room.localParticipant.setMicrophoneEnabled(true);
    micEnabled = true;
  } catch(e) {
    micEnabled = false;
    toast("マイクが使用できません。ブラウザの権限を確認してください。");
  }
  try {
    await room.localParticipant.setCameraEnabled(true);
    cameraEnabled = true;
  } catch(e) {
    cameraEnabled = false;
    toast("カメラが使用できません。ブラウザの権限を確認してください。");
  }
  updateMicState();
  updateCameraState();

  // 画面表示と接続状態を確認した後に、授業データの同期を開始
  subscribeBoard();
  subscribeChat();
}

async function leaveRoom() {
  if (closing) return;
  closing = true;
  $("leaveButton").disabled = true;
  $("leaveButton").querySelector("span").textContent = "退出中";
  try {
    if (room) await room.disconnect();
  } catch(e) {
    console.error(e);
  }
  unsubscribers.forEach(unsub=>unsub());
  location.href = profile?.role==="student"
    ? "/student/dashboard.html"
    : profile?.role==="teacher"
      ? "/teacher/dashboard.html"
      : "/admin/dashboard.html";
}

$("micButton").addEventListener("click",toggleMic);
$("cameraButton").addEventListener("click",toggleCamera);
$("shareButton").addEventListener("click",toggleShare);
$("drawButton").addEventListener("click",()=>{
  drawingEnabled=!drawingEnabled;
  updateDrawButton();
});
$("chatToggle").addEventListener("click",()=>{
  if (window.innerWidth<=650) {
    toast("スマートフォンではチャットを別表示する設定が必要です。");
  } else {
    $("chatInput").focus();
  }
});
$("leaveButton").addEventListener("click",leaveRoom);

window.addEventListener("beforeunload",()=>{
  try { room?.disconnect(); } catch(e) {}
});
new ResizeObserver(resizeCanvas).observe($("sharePanel"));
window.addEventListener("resize",resizeCanvas);

async function start() {
  try {
    await authPersistenceReady;
    const user = await new Promise((resolve,reject)=>{
      const unsub=onAuthStateChanged(auth,u=>{
        unsub();
        resolve(u);
      },reject);
    });
    if (!user) {
      location.href="/login.html";
      return;
    }
    currentUser=user;
    await getLessonAndProfile();
    $("app").style.display="flex";
    resizeCanvas();
    await connectLiveKit();
    updateDrawButton();
  } catch(e) {
    console.error("Lesson room error:",e);
    showError("授業に入室できません",e.message || "接続に失敗しました。ログイン状態と通信環境を確認してください。");
  }
}

start();
</script>
