<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f8fc">
  <title>オンライン授業 | WEB Course-plus</title>
  <style>
    :root {
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      color: #17263c;
      background: #f4f7fb;
      --blue: #2563eb;
      --border: #e1e7ef;
      --muted: #68778c;
    }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { display:flex; flex-direction:column; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    .topbar {
      height:58px; flex:0 0 58px; display:flex; align-items:center;
      justify-content:space-between; padding:0 20px; background:#fff;
      border-bottom:1px solid var(--border); z-index:5;
    }
    .brand { display:flex; align-items:center; gap:12px; font-size:17px; font-weight:750; }
    .brand-mark {
      width:32px; height:32px; display:grid; place-items:center; color:#fff;
      background:var(--blue); border-radius:9px; font-size:14px; font-weight:800;
    }
    .lesson-title { color:var(--muted); font-size:13px; font-weight:500; }
    .connection { display:flex; align-items:center; gap:7px; color:#64748b; font-size:12px; }
    .connection-dot { width:8px; height:8px; border-radius:50%; background:#f59e0b; }
    .connection.connected .connection-dot { background:#16a34a; }
    .room-main { position:relative; flex:1; min-height:0; padding:12px; overflow:hidden; }
    .video-area { width:100%; height:100%; min-width:0; min-height:0; display:flex; gap:12px; }
    .camera-strip {
      flex:1; min-width:0; min-height:0; display:grid;
      grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));
      grid-template-rows:repeat(auto-fit,minmax(0,1fr));
      grid-auto-rows:minmax(0,1fr); align-content:stretch; align-items:stretch; gap:12px;
    }
    .camera-tile {
      position:relative; width:100%; min-width:0; min-height:0; height:100%;
      aspect-ratio:16/9; align-self:stretch; overflow:hidden;
      background:#18263b; border:1px solid #263449; border-radius:13px;
    }
    .camera-tile.is-hidden { display:none !important; }
    .camera-tile video {
      display:none; width:100%; height:100%; object-fit:cover;
      object-position:center; background:#18263b;
    }
    .camera-placeholder {
      position:absolute; inset:0; display:flex; flex-direction:column;
      justify-content:center; align-items:center; gap:10px; color:#d8e2f0;
      background:linear-gradient(145deg,#263b58,#17263b);
      font-size:13px; pointer-events:none;
    }
    .avatar {
      width:64px; height:64px; display:grid; place-items:center; border-radius:50%;
      color:#fff; background:#42638d; font-size:24px; font-weight:700;
    }
    .camera-name {
      position:absolute; bottom:12px; left:12px; z-index:2; padding:6px 10px;
      border-radius:6px; color:#fff; background:rgba(15,23,42,.75); font-size:12px;
    }
    .camera-status {
      position:absolute; top:12px; right:12px; z-index:2; padding:5px 8px;
      border-radius:5px; color:#fff; background:rgba(15,23,42,.72); font-size:11px;
    }
    .share-stage {
      display:none; position:relative; flex:1; min-width:0; min-height:0;
      overflow:hidden; background:#111827; border:1px solid #263449; border-radius:13px;
    }
    .share-stage video { width:100%; height:100%; object-fit:contain; background:#111827; }
    .share-label {
      position:absolute; top:12px; left:12px; z-index:3; padding:6px 10px;
      border-radius:6px; color:#fff; background:rgba(15,23,42,.75);
      font-size:12px; pointer-events:none;
    }
    .room-main.has-share .video-area { display:grid; grid-template-columns:minmax(0,1fr) 280px; }
    .room-main.has-share .share-stage { display:block; }
    .room-main.has-share .camera-strip {
      display:flex; flex-direction:column; min-height:0; gap:10px; align-items:stretch;
    }
    .room-main.has-share .camera-tile { flex:1 1 0; min-height:0; height:auto; width:100%; }
    #boardCanvas {
      position:absolute; inset:0; z-index:2; width:100%; height:100%;
      touch-action:none; pointer-events:none;
    }
    .room-main.drawing #boardCanvas { pointer-events:auto; cursor:crosshair; }
    .chat-panel {
      position:absolute; z-index:10; top:12px; right:12px; bottom:12px;
      width:340px; max-width:calc(100% - 24px); display:flex; flex-direction:column;
      overflow:hidden; background:rgba(255,255,255,.98); border:1px solid var(--border);
      border-radius:13px; box-shadow:0 8px 30px rgba(15,23,42,.2);
      transform:translateX(calc(100% + 24px)); opacity:0; visibility:hidden;
      transition:transform .22s ease,opacity .22s ease,visibility .22s;
    }
    .chat-panel.open { transform:translateX(0); opacity:1; visibility:visible; }
    .chat-heading {
      height:54px; flex:0 0 54px; display:flex; align-items:center;
      justify-content:space-between; padding:0 15px; border-bottom:1px solid var(--border);
      font-size:14px; font-weight:700;
    }
    .chat-close {
      height:32px; padding:0 10px; border:1px solid var(--border);
      border-radius:7px; color:#475569; background:#fff; font-size:11px;
    }
    .chat-messages {
      flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
      gap:12px; padding:15px;
    }
    .chat-empty { margin:auto; color:#94a3b8; text-align:center; font-size:13px; line-height:1.8; }
    .message { max-width:92%; display:flex; flex-direction:column; gap:4px; align-self:flex-start; }
    .message.mine { align-self:flex-end; }
    .message-meta { display:flex; gap:7px; align-items:center; color:#8491a3; font-size:10px; }
    .message.mine .message-meta { justify-content:flex-end; }
    .message-bubble {
      padding:10px 12px; border-radius:10px; background:#f0f4f9; color:#25364c;
      font-size:13px; line-height:1.6; overflow-wrap:anywhere; white-space:pre-wrap;
    }
    .message.mine .message-bubble { color:#fff; background:var(--blue); }
    .chat-input-area {
      flex:0 0 auto; display:flex; gap:8px; padding:12px; border-top:1px solid var(--border);
    }
    .chat-input-area input {
      flex:1; min-width:0; height:40px; padding:0 11px; border:1px solid var(--border);
      border-radius:8px; outline:none; font-size:13px;
    }
    .chat-input-area input:focus { border-color:var(--blue); }
    .send-button {
      width:52px; height:40px; border:0; border-radius:8px;
      color:#fff; background:var(--blue); font-size:13px; font-weight:700;
    }
    .send-button:disabled { opacity:.5; cursor:not-allowed; }
    .toolbar {
      height:76px; flex:0 0 76px; display:flex; align-items:center;
      justify-content:center; gap:9px; padding:8px 14px;
      background:#fff; border-top:1px solid var(--border);
    }
    .tool-button {
      min-width:86px; height:46px; padding:0 12px; border:1px solid var(--border);
      border-radius:9px; color:#34445b; background:#fff; font-size:12px; font-weight:600;
    }
    .tool-button:hover { background:#f3f6fb; }
    .tool-button.active { color:var(--blue); border-color:#a9c4ff; background:#eff5ff; }
    .tool-button.danger { color:#dc2626; border-color:#fecaca; }
    .tool-button.danger:hover { background:#fff1f2; }
    .tool-button:disabled { opacity:.45; cursor:not-allowed; }
    .footer {
      height:24px; flex:0 0 24px; display:flex; justify-content:center;
      align-items:center; color:#8793a4; background:#fff; font-size:10px;
    }
    .toast {
      position:fixed; left:50%; bottom:95px; z-index:30; transform:translateX(-50%);
      max-width:calc(100vw - 30px); padding:10px 16px; border-radius:8px;
      color:#fff; background:#26364b; box-shadow:0 5px 20px #0002;
      font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .toast.show { opacity:1; }
    .loading-screen {
      position:fixed; inset:0; z-index:50; display:flex; align-items:center;
      justify-content:center; background:#f4f7fb; color:#52637a; font-size:14px;
    }
    .loading-screen.hidden { display:none; }
    .error-screen {
      position:fixed; inset:0; z-index:60; display:none; align-items:center;
      justify-content:center; padding:20px; background:#f4f7fb;
    }
    .error-card {
      width:min(440px,100%); padding:30px; border:1px solid var(--border);
      border-radius:14px; background:#fff; text-align:center;
    }
    .error-card h2 { margin:0 0 10px; font-size:19px; }
    .error-card p { color:var(--muted); font-size:13px; line-height:1.8; overflow-wrap:anywhere; }
    .error-card button {
      margin-top:12px; padding:10px 18px; border:0; border-radius:8px;
      color:#fff; background:var(--blue);
    }
    @media(max-width:850px) {
      .room-main.has-share .video-area { grid-template-columns:minmax(0,1fr) 210px; }
      .toolbar { gap:5px; }
      .tool-button { min-width:68px; padding:0 7px; }
    }
    @media(max-width:600px) {
      .topbar { padding:0 10px; }
      .brand { font-size:14px; }
      .lesson-title { display:none; }
      .room-main { padding:7px; }
      .camera-strip {
        grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));
        grid-auto-rows:minmax(0,1fr); align-content:stretch; gap:7px;
      }
      .room-main.has-share .video-area {
        grid-template-columns:minmax(0,1fr) 115px; gap:7px;
      }
      .camera-placeholder { font-size:10px; }
      .avatar { width:38px; height:38px; font-size:16px; }
      .camera-name { bottom:6px; left:6px; padding:4px 6px; font-size:10px; }
      .camera-status { top:6px; right:6px; padding:3px 5px; font-size:9px; }
      .chat-panel {
        top:7px; right:7px; bottom:7px; width:min(330px,calc(100% - 14px));
      }
      .toolbar { height:66px; flex-basis:66px; gap:4px; padding:5px; }
      .tool-button {
        flex:1; min-width:0; height:46px; padding:0 2px; font-size:8px;
        white-space:nowrap; overflow:hidden; text-overflow:clip;
      }
      .footer { font-size:9px; }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">授業室に接続しています...</div>
  <div class="error-screen" id="errorScreen">
    <div class="error-card">
      <h2>授業室に入室できません</h2>
      <p id="errorMessage">エラーが発生しました。</p>
      <button id="errorBackButton" type="button">ダッシュボードへ戻る</button>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">W</div>
      <span>WEB Course-plus</span>
      <span class="lesson-title" id="lessonTitle">オンライン授業</span>
    </div>
    <div class="connection" id="connectionStatus">
      <span class="connection-dot"></span>
      <span id="connectionText">接続準備中</span>
    </div>
  </header>

  <main class="room-main" id="roomMain">
    <section class="video-area">
      <div class="share-stage" id="shareStage">
        <video id="shareVideo" autoplay playsinline></video>
        <div class="share-label">画面共有</div>
        <canvas id="boardCanvas"></canvas>
      </div>
      <div class="camera-strip">
        <div class="camera-tile is-hidden" id="studentCameraTile">
          <video id="studentVideo" autoplay playsinline></video>
          <div class="camera-placeholder" id="studentPlaceholder">
            <div class="avatar" id="studentAvatar">生</div>
            <span id="studentPlaceholderText">カメラ OFF</span>
          </div>
          <div class="camera-name" id="studentName">生徒</div>
          <div class="camera-status" id="studentCameraStatus">カメラ OFF</div>
        </div>
        <div class="camera-tile is-hidden" id="teacherCameraTile">
          <video id="teacherVideo" autoplay playsinline></video>
          <div class="camera-placeholder" id="teacherPlaceholder">
            <div class="avatar" id="teacherAvatar">先</div>
            <span id="teacherPlaceholderText">カメラ OFF</span>
          </div>
          <div class="camera-name" id="teacherName">先生</div>
          <div class="camera-status" id="teacherCameraStatus">カメラ OFF</div>
        </div>
      </div>
    </section>

    <aside class="chat-panel" id="chatPanel">
      <div class="chat-heading">
        <span>チャット</span>
        <button class="chat-close" id="chatCloseButton" type="button">閉じる</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">授業中のメッセージをここでやり取りできます。</div>
      </div>
      <form class="chat-input-area" id="chatForm">
        <input type="text" id="chatInput" maxlength="1000" placeholder="メッセージを入力..." autocomplete="off">
        <button class="send-button" id="sendButton" type="submit">送信</button>
      </form>
    </aside>
  </main>

  <nav class="toolbar">
    <button class="tool-button" id="micButton" type="button">マイク OFF</button>
    <button class="tool-button" id="cameraButton" type="button">カメラ OFF</button>
    <button class="tool-button" id="shareButton" type="button">画面共有</button>
    <button class="tool-button" id="drawButton" type="button" disabled>書き込み</button>
    <button class="tool-button" id="eraseButton" type="button" disabled>消しゴム</button>
    <button class="tool-button" id="clearButton" type="button" disabled>全消去</button>
    <button class="tool-button" id="chatToggleButton" type="button">チャットを開く</button>
    <button class="tool-button danger" id="leaveButton" type="button">退出</button>
  </nav>

  <footer class="footer">© 2026 定期テスト対策プリント運営事務局. All Rights Reserved.</footer>
  <div class="toast" id="toast"></div>
  <div id="remoteAudioContainer" aria-hidden="true"></div>

  <script type="module">
    import { auth, db, authPersistenceReady } from "../assets/js/firebase.js";
    import { getSessionId } from "../assets/js/common.js";

    import {
      doc, getDoc, collection, addDoc, getDocs, onSnapshot, query,
      orderBy, serverTimestamp, writeBatch
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import { Room, RoomEvent, Track } from "https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/+esm";

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const lessonId = params.get("lessonId") || params.get("id");

    let currentUser = null;
    let userProfile = null;
    let lessonData = null;
    let liveRoom = null;

    let micEnabled = false;
    let cameraEnabled = false;
    let cameraSwitching = false;
    let screenEnabled = false;
    let drawingEnabled = false;
    let drawingMode = "pen";
    let chatOpen = false;
    let leaving = false;

    let localCameraTrack = null;
    let remoteCameraTrack = null;
    let localScreenTrack = null;
    let remoteScreenTrack = null;

    const remoteAudioElements = new Map();
    const participantTileMap = new Map();
    const cameraTrackTileMap = new Map();

    let audioUnlocked = false;
    let audioNeedsGesture = false;
    let unsubscribeBoard = null;
    let unsubscribeChat = null;
    let resizeObserver = null;
    let boardStrokes = new Map();
    let activeStroke = null;
    let boardContext = null;
    let boardWidth = 0;
    let boardHeight = 0;
    let toastTimer = null;

    const roomMain = $("roomMain");
    const boardCanvas = $("boardCanvas");
    const chatMessages = $("chatMessages");

    function showToast(message) {
      const element = $("toast");
      element.textContent = message;
      element.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => element.classList.remove("show"), 2600);
    }

    function setConnection(connected, message) {
      $("connectionStatus").classList.toggle("connected", connected);
      $("connectionText").textContent = message;
    }

    function showError(message) {
      $("loadingScreen").classList.add("hidden");
      $("errorMessage").textContent = message;
      $("errorScreen").style.display = "flex";
    }

    function dashboardUrl() {
      if (userProfile?.role === "teacher") {
        return "https://web-course-plus.onrender.com/teacher/dashboard.html";
      }
      if (userProfile?.role === "admin") {
        return "https://web-course-plus.onrender.com/admin/dashboard.html";
      }
      return "https://web-course-plus.onrender.com/student/dashboard.html";
    }

    function goDashboard() {
      location.href = dashboardUrl();
    }

    $("errorBackButton").addEventListener("click", goDashboard);

    function isStudent() {
      return userProfile?.role === "student";
    }

    function localTile() {
      return isStudent() ? "student" : "teacher";
    }

    function remoteTile() {
      return isStudent() ? "teacher" : "student";
    }

    function tileElements(role) {
      return {
        tile: $(role + "CameraTile"),
        video: $(role + "Video"),
        placeholder: $(role + "Placeholder"),
        status: $(role + "CameraStatus"),
        placeholderText: $(role + "PlaceholderText")
      };
    }

    function setTileCameraVisible(elements, enabled, message) {
      if (!elements) return;
      elements.video.style.display = enabled ? "block" : "none";
      elements.placeholder.style.display = enabled ? "none" : "flex";
      elements.status.textContent = enabled ? "カメラ ON" : "カメラ OFF";
      if (message) elements.placeholderText.textContent = message;
    }

    function setCameraVisible(role, enabled, message) {
      setTileCameraVisible(tileElements(role), enabled, message);
    }

    function getParticipantRole(participant) {
      try {
        const metadata = JSON.parse(participant.metadata || "{}");
        return metadata.role || "";
      } catch (_) {
        return "";
      }
    }

    function createExtraCameraTile(participant) {
      const tile = document.createElement("div");
      tile.className = "camera-tile";
      tile.dataset.identity = participant.identity;

      const video = document.createElement("video");
      video.autoplay = true;
      video.playsInline = true;

      const placeholder = document.createElement("div");
      placeholder.className = "camera-placeholder";

      const avatar = document.createElement("div");
      avatar.className = "avatar";

      const displayName = participant.name || participant.identity || "参加者";
      avatar.textContent = displayName.slice(0, 1);

      const placeholderText = document.createElement("span");
      placeholderText.textContent = "カメラ OFF";
      placeholder.append(avatar, placeholderText);

      const name = document.createElement("div");
      name.className = "camera-name";
      name.textContent = displayName;

      const status = document.createElement("div");
      status.className = "camera-status";
      status.textContent = "カメラ OFF";

      tile.append(video, placeholder, name, status);
      $("studentCameraTile").parentElement.appendChild(tile);

      return { tile, video, placeholder, status, placeholderText };
    }

    function getParticipantTile(participant) {
      if (!participant) return null;
      const identity = participant.identity;

      if (participantTileMap.has(identity)) {
        return participantTileMap.get(identity);
      }

      const participantRole = getParticipantRole(participant);
      const localRole = userProfile?.role;
      let role = null;

      if (participantRole === "student" && localRole !== "student") role = "student";
      if (participantRole === "teacher" && localRole !== "teacher") role = "teacher";

      let elements = null;

      if (role) {
        const candidate = tileElements(role);
        const alreadyUsed = [...participantTileMap.values()]
          .some(item => item.tile === candidate.tile);

        if (!alreadyUsed) {
          elements = candidate;
          candidate.tile.classList.remove("is-hidden");
        }
      }

      if (!elements) elements = createExtraCameraTile(participant);

      const displayName = participant.name || participant.identity || "参加者";

      if (elements.tile.id) {
        const baseRole = elements.tile.id.replace("CameraTile", "");
        $(baseRole + "Name").textContent = displayName;
        $(baseRole + "Avatar").textContent = displayName.slice(0, 1);
        setTileCameraVisible(elements, false, "カメラ OFF");
      }

      participantTileMap.set(identity, elements);
      return elements;
    }

    function removeParticipantTile(participant) {
      if (!participant) return;
      const elements = participantTileMap.get(participant.identity);
      if (!elements) return;

      if (elements.tile.id) {
        elements.tile.classList.add("is-hidden");
        setTileCameraVisible(elements, false, "相手のカメラは OFF です");
      } else {
        elements.video.srcObject = null;
        elements.tile.remove();
      }

      participantTileMap.delete(participant.identity);
    }

    // ==================================================
    // カメラ映像処理（今回の修正箇所）
    // ==================================================

    function attachCamera(track, isLocal, participant = null) {
      if (!track) return;

      const elements = isLocal
        ? tileElements(localTile())
        : getParticipantTile(participant);

      if (!elements) return;

      try {
        // 同じ映像要素に古いトラックが残っている場合は先に解除する。
        const previousTrack = [...cameraTrackTileMap.entries()]
          .find(([oldTrack, oldElements]) =>
            oldElements.video === elements.video && oldTrack !== track
          )?.[0];

        if (previousTrack) {
          try { previousTrack.detach(elements.video); } catch (_) {}
          cameraTrackTileMap.delete(previousTrack);
        }

        // 同じトラックを二重にattachしない。
        if (cameraTrackTileMap.get(track)?.video !== elements.video) {
          track.attach(elements.video);
        }

        elements.video.autoplay = true;
        elements.video.playsInline = true;
        elements.video.muted = isLocal;
        elements.video.style.display = "block";

        setTileCameraVisible(elements, true);
        cameraTrackTileMap.set(track, elements);

        if (isLocal) {
          localCameraTrack = track;
        } else {
          remoteCameraTrack = track;
        }

        // ブラウザ側で再生が保留されるケースにも対応。
        const playPromise = elements.video.play();
        if (playPromise?.catch) {
          playPromise.catch(error => {
            console.warn("カメラ映像の再生が保留されました:", error);
          });
        }
      } catch (error) {
        console.error("カメラ映像の表示に失敗:", error);
      }
    }

    function detachCamera(track, isLocal, participant = null) {
      if (!track) return;

      const elements = cameraTrackTileMap.get(track) ||
        (isLocal ? tileElements(localTile()) : getParticipantTile(participant));

      if (!elements) return;

      // 古いトラックの解除イベントで、新しい映像を消さない。
      const mappedElements = cameraTrackTileMap.get(track);
      if (!mappedElements && isLocal && localCameraTrack && localCameraTrack !== track) {
        return;
      }

      try {
        track.detach(elements.video);
      } catch (error) {
        console.warn("カメラトラックの解除:", error);
      }

      // 同じ映像要素に別のトラックが接続されていないか確認する。
      const anotherTrackAttached = [...cameraTrackTileMap.entries()]
        .some(([otherTrack, otherElements]) =>
          otherTrack !== track && otherElements.video === elements.video
        );

      cameraTrackTileMap.delete(track);

      if (!anotherTrackAttached) {
        elements.video.pause();
        elements.video.srcObject = null;

        setTileCameraVisible(
          elements,
          false,
          isLocal ? "カメラ OFF" : "相手のカメラは OFF です"
        );
      }

      if (isLocal && localCameraTrack === track) {
        localCameraTrack = null;
      }

      if (!isLocal && remoteCameraTrack === track) {
        remoteCameraTrack = null;
      }
    }

    async function unlockRemoteAudio() {
      if (!liveRoom) return false;

      try {
        await liveRoom.startAudio();

        for (const item of remoteAudioElements.values()) {
          try { await item.audio.play(); } catch (error) { console.warn(error); }
        }

        audioUnlocked = true;
        return true;
      } catch (error) {
        audioNeedsGesture = true;
        console.warn("音声の自動再生はブラウザにより保留されています:", error);
        return false;
      }
    }

    function attachRemoteAudio(track, participant) {
      if (!track) return;

      const key = track.sid || track.mediaStreamTrack?.id ||
        `${participant?.identity || "remote"}-${Date.now()}`;

      if (remoteAudioElements.has(key)) return;

      try {
        const audio = track.attach();
        audio.autoplay = true;
        audio.controls = false;
        audio.muted = false;
        audio.volume = 1;
        audio.setAttribute("playsinline", "");
        audio.style.position = "fixed";
        audio.style.width = "1px";
        audio.style.height = "1px";
        audio.style.left = "-10px";
        audio.style.top = "-10px";
        audio.style.opacity = "0";

        $("remoteAudioContainer").appendChild(audio);

        remoteAudioElements.set(key, {
          audio,
          track,
          participantId: participant?.identity || null
        });

        audio.play().catch(error => {
          console.warn("音声の自動再生が制限されました:", error);
          audioNeedsGesture = true;
          audioUnlocked = false;
        });
      } catch (error) {
        console.error("相手の音声を接続できません:", error);
        showToast("相手の音声を再生できませんでした。");
      }
    }

    function detachRemoteAudio(track) {
      if (!track) return;

      try {
        const detached = track.detach();
        (Array.isArray(detached) ? detached : [detached])
          .forEach(element => element?.remove?.());
      } catch (error) {
        console.warn("音声トラック切断:", error);
      }

      for (const [key, item] of remoteAudioElements.entries()) {
        if (item.track === track) {
          item.audio.pause();
          item.audio.srcObject = null;
          item.audio.remove();
          remoteAudioElements.delete(key);
        }
      }
    }

    function updateShareLayout() {
      const hasShare = Boolean(localScreenTrack || remoteScreenTrack);
      roomMain.classList.toggle("has-share", hasShare);

      $("drawButton").disabled = !hasShare;
      $("eraseButton").disabled = !hasShare;
      $("clearButton").disabled = !hasShare;

      if (!hasShare) {
        drawingEnabled = false;
        drawingMode = "pen";
        roomMain.classList.remove("drawing");
        $("drawButton").classList.remove("active");
        $("eraseButton").classList.remove("active");

      }

    function attachScreenTrack(track, isLocal) {
      if (!track) return;

      try {
        track.attach($("shareVideo"));

        if (isLocal) localScreenTrack = track;
        else remoteScreenTrack = track;

        updateShareLayout();
      } catch (error) {
        console.error("画面共有の表示に失敗:", error);
      }

    function detachScreenTrack(track, isLocal) {
      if (track) {
        try { track.detach($("shareVideo")); } catch (error) { console.warn(error); }
      }

      $("shareVideo").srcObject = null;

      if (isLocal) localScreenTrack = null;
      else remoteScreenTrack = null;

      const remaining = localScreenTrack || remoteScreenTrack;
      if (remaining) remaining.attach($("shareVideo"));

      updateShareLayout();
    }

    function resizeCanvas() {
      const stage = $("shareStage");
      const video = $("shareVideo");
      if (!stage || !boardCanvas) return;

      const stageRect = stage.getBoundingClientRect();
      if (!stageRect.width || !stageRect.height) return;

      const sourceWidth = video.videoWidth || stageRect.width;
      const sourceHeight = video.videoHeight || stageRect.height;
      const sourceRatio = sourceWidth / sourceHeight;
      const stageRatio = stageRect.width / stageRect.height;

      let contentWidth = stageRect.width;
      let contentHeight = stageRect.height;

      if (sourceRatio > stageRatio) contentHeight = contentWidth / sourceRatio;
      else contentWidth = contentHeight * sourceRatio;

      const left = (stageRect.width - contentWidth) / 2;
      const top = (stageRect.height - contentHeight) / 2;

      boardCanvas.style.left = `${left}px`;
      boardCanvas.style.top = `${top}px`;
      boardCanvas.style.right = "auto";
      boardCanvas.style.bottom = "auto";
      boardCanvas.style.width = `${contentWidth}px`;
      boardCanvas.style.height = `${contentHeight}px`;

      const ratio = Math.max(1, window.devicePixelRatio || 1);
      boardWidth = contentWidth;
      boardHeight = contentHeight;
      boardCanvas.width = Math.round(contentWidth * ratio);
      boardCanvas.height = Math.round(contentHeight * ratio);
      boardContext = boardCanvas.getContext("2d");
      boardContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      renderBoard();
    }

    function clearCanvas() {
      if (!boardContext) return;
      boardContext.clearRect(0, 0, boardWidth, boardHeight);
    }

    function drawStroke(ctx, stroke) {
      if (!stroke || !Array.isArray(stroke.points) || !stroke.points.length) return;

      const points = stroke.points;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const storedWidth = Number(stroke.width) || 3;
      ctx.lineWidth = storedWidth <= 1
        ? storedWidth * boardWidth
        : (storedWidth / 1000) * boardWidth;

      if (stroke.mode === "eraser") {
        ctx.globalCompositeOperation = "destination-out";
        ctx.strokeStyle = "rgba(0,0,0,1)";
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = stroke.color || "#2563eb";
      }

      ctx.beginPath();
      ctx.moveTo(points[0].x * boardWidth, points[0].y * boardHeight);

      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x * boardWidth, points[i].y * boardHeight);
      }

      if (points.length === 1) {
        ctx.lineTo(points[0].x * boardWidth + 0.1, points[0].y * boardHeight + 0.1);
      }

      ctx.stroke();
      ctx.restore();
    }

    function renderBoard() {
      if (!boardContext) return;
      clearCanvas();

      const strokes = [...boardStrokes.values()].sort((a, b) => {
        const at = a.createdAt?.seconds || 0;
        const bt = b.createdAt?.seconds || 0;
        return at - bt;
      });

      for (const stroke of strokes) drawStroke(boardContext, stroke);
      if (activeStroke) drawStroke(boardContext, activeStroke);
    }

    function getCanvasPoint(event) {
      const rect = boardCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return { x:0, y:0 };

      return {
        x:Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),
        y:Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height))
      };
    }

    function startDrawing(event) {
      if (!drawingEnabled || !roomMain.classList.contains("has-share")) return;
      if (event.button !== undefined && event.button !== 0) return;

      event.preventDefault();
      boardCanvas.setPointerCapture(event.pointerId);

      activeStroke = {
        userId:currentUser.uid,
        mode:drawingMode,
        color:"#2563eb",
        width:drawingMode === "eraser" ? 0.022 : 0.003,
        points:[getCanvasPoint(event)]
      };

      renderBoard();
    }

    function moveDrawing(event) {
      if (!activeStroke) return;
      event.preventDefault();
      activeStroke.points.push(getCanvasPoint(event));
      renderBoard();
    }

    async function finishDrawing() {
      if (!activeStroke) return;

      const stroke = activeStroke;
      activeStroke = null;
      renderBoard();

      try {
        await addDoc(collection(db,"lessonBoards",lessonId,"strokes"), {
          userId:stroke.userId,
          mode:stroke.mode,
          color:stroke.color,
          width:stroke.width,
          points:stroke.points,
          createdAt:serverTimestamp()
        });
      } catch (error) {
        console.error(error);
        showToast("書き込みを保存できませんでした。");
      }
    }

    boardCanvas.addEventListener("pointerdown",startDrawing);
    boardCanvas.addEventListener("pointermove",moveDrawing);
    boardCanvas.addEventListener("pointerup",finishDrawing);
    boardCanvas.addEventListener("pointercancel",finishDrawing);

    function listenBoard() {
      const strokesRef = collection(db,"lessonBoards",lessonId,"strokes");

      unsubscribeBoard = onSnapshot(strokesRef,(snapshot) => {
        boardStrokes.clear();
        snapshot.forEach(item => boardStrokes.set(item.id,item.data()));
        renderBoard();
      },(error) => {
        console.error("ホワイトボード取得エラー:",error);
        showToast("ホワイトボードを読み込めませんでした。");
      });
    }

    async function clearBoard() {
      if (!confirm("ホワイトボードの書き込みをすべて消去しますか？")) return;

      try {
        const strokesRef = collection(db,"lessonBoards",lessonId,"strokes");
        const snapshot = await getDocs(strokesRef);
        const items = snapshot.docs;

        for (let i=0;i<items.length;i+=450) {
          const batch = writeBatch(db);
          items.slice(i,i+450).forEach(item => batch.delete(item.ref));
          await batch.commit();
        }

        boardStrokes.clear();
        clearCanvas();
        showToast("書き込みをすべて消去しました。");
      } catch (error) {
        console.error(error);
        showToast("消去に失敗しました。");
      }
    }

    async function getLessonAndProfile(user) {
      const profileSnapshot = await getDoc(doc(db,"users",user.uid));

      if (!profileSnapshot.exists()) {
        throw new Error("ユーザー情報が登録されていません。管理者にお問い合わせください。");
      }

      userProfile = profileSnapshot.data();

      if (!["student","teacher","admin"].includes(userProfile.role)) {
        throw new Error("このアカウントには授業室の利用権限がありません。");
      }

      if (!lessonId) throw new Error("授業IDが指定されていません。");

      const lessonSnapshot = await getDoc(doc(db,"lessons",lessonId));
      if (!lessonSnapshot.exists()) throw new Error("指定された授業が見つかりません。");

      lessonData = lessonSnapshot.data();

      const isAdmin = userProfile.role === "admin";
      const isTeacher = userProfile.role === "teacher";
      const isStudent = userProfile.role === "student" && lessonData.studentId === user.uid;

      if (!isAdmin && !isTeacher && !isStudent) {
        throw new Error("この授業室に入室する権限がありません。");
      }

      $("lessonTitle").textContent = lessonData.title || "オンライン授業";

      const studentDisplayName = userProfile.role === "student"
        ? (userProfile.displayName || user.displayName || "生徒")
        : (lessonData.studentName || "生徒");

      const teacherDisplayName = userProfile.role === "teacher"
        ? (userProfile.displayName || user.displayName || "先生")
        : (lessonData.teacherName || "先生");

      $("studentName").textContent = studentDisplayName;
      $("teacherName").textContent = teacherDisplayName;
      $("studentAvatar").textContent = studentDisplayName.slice(0,1);
      $("teacherAvatar").textContent = teacherDisplayName.slice(0,1);

      $(localTile()+"CameraTile").classList.remove("is-hidden");
      $(remoteTile()+"CameraTile").classList.add("is-hidden");

      setCameraVisible("student",false,"生徒のカメラを待っています");
      setCameraVisible("teacher",false,"先生のカメラを待っています");
    }

    async function connectLiveKit() {
      const idToken = await currentUser.getIdToken();
      const sessionId = getSessionId();

      if (!sessionId || !/^[A-Za-z0-9_-]{16,100}$/.test(sessionId)) {
        throw new Error(
          "端末セッションIDを取得できません。いったんログアウトして再ログインしてください。"
        );
      }

      const response = await fetch("/api/livekit/token",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+idToken,
          "X-Session-Id":sessionId
        },
        body:JSON.stringify({lessonId,sessionId}),
        cache:"no-store"
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.error || data.message || "接続トークンを取得できませんでした。");
      }

      const serverUrl = data.url || data.serverUrl;
      const token = data.token;
      if (!serverUrl || !token) throw new Error("LiveKit接続情報が正しくありません。");

      liveRoom = new Room({adaptiveStream:true,dynacast:true});

      liveRoom.on(RoomEvent.Connected,() => setConnection(true,"接続済み"));
      liveRoom.on(RoomEvent.Disconnected,() => setConnection(false,"切断されました"));

      liveRoom.on(RoomEvent.ParticipantConnected,(participant) => {
        getParticipantTile(participant);
        setConnection(true,"参加者と接続済み");
      });

      liveRoom.on(RoomEvent.ParticipantDisconnected,(participant) => {
        for (const [key,item] of remoteAudioElements.entries()) {
          if (item.participantId === participant.identity) {
            item.audio.pause();
            item.audio.srcObject = null;
            item.audio.remove();
            remoteAudioElements.delete(key);
          }
        }

        if (remoteScreenTrack) detachScreenTrack(remoteScreenTrack,false);

        const elements = participantTileMap.get(participant.identity);
        if (elements) {
          for (const [track,tile] of cameraTrackTileMap.entries()) {
            if (tile === elements) detachCamera(track,false,participant);
          }
        }

        removeParticipantTile(participant);
        setConnection(true,"接続済み");
      });

      liveRoom.on(RoomEvent.TrackSubscribed,(track,publication,participant) => {
        if (track.kind === Track.Kind.Audio) {
          attachRemoteAudio(track,participant);
          return;
        }

        if (track.kind === Track.Kind.Video) {
          if (publication.source === Track.Source.ScreenShare) {
            attachScreenTrack(track,false);
          } else if (publication.source === Track.Source.Camera) {
            attachCamera(track,false,participant);
          }
        }
      });

      liveRoom.on(RoomEvent.TrackUnsubscribed,(track,publication,participant) => {
        if (track.kind === Track.Kind.Audio) {
          detachRemoteAudio(track);
          return;
        }

        if (publication.source === Track.Source.ScreenShare && remoteScreenTrack === track) {
          detachScreenTrack(track,false);
        }

        if (publication.source === Track.Source.Camera) {
          detachCamera(track,false,participant);
        }
      });

      liveRoom.on(RoomEvent.LocalTrackPublished,(publication) => {
        const track = publication.track;
        if (!track) return;

        if (publication.source === Track.Source.Camera) {
          attachCamera(track,true);
        }

        if (publication.source === Track.Source.ScreenShare) {
          attachScreenTrack(track,true);
          screenEnabled = true;
          $("shareButton").textContent = "共有を停止";
          $("shareButton").classList.add("active");
        }
      });

      liveRoom.on(RoomEvent.LocalTrackUnpublished,(publication) => {
        if (publication.source === Track.Source.Camera) {
          const track = publication.track || localCameraTrack;
          if (track) detachCamera(track,true);
        }

        if (publication.source === Track.Source.ScreenShare && localScreenTrack) {
          detachScreenTrack(localScreenTrack,true);
          screenEnabled = false;
          $("shareButton").textContent = "画面共有";
          $("shareButton").classList.remove("active");
        }
      });

      liveRoom.on(RoomEvent.TrackMuted,(publication,participant) => {
        if (participant.identity === liveRoom.localParticipant.identity) {
          if (publication.source === Track.Source.Camera) {
            setTileCameraVisible(tileElements(localTile()),false,"カメラ OFF");
          }
          return;
        }

        if (publication.source === Track.Source.Camera) {
          setTileCameraVisible(
            getParticipantTile(participant),false,"相手のカメラは OFF です"
          );
        }
      });

      liveRoom.on(RoomEvent.TrackUnmuted,(publication,participant) => {
        if (participant.identity === liveRoom.localParticipant.identity) {
          if (publication.source === Track.Source.Camera) {
            const track = publication.track;
            if (track) attachCamera(track,true);
          }
          return;
        }

        if (publication.source === Track.Source.Camera) {
          const track = publication.track;
          if (track) attachCamera(track,false,participant);
        }
      });

      await liveRoom.connect(serverUrl,token,{autoSubscribe:true});
      setConnection(true,"接続済み");

      try {
        await liveRoom.startAudio();
        audioUnlocked = true;
      } catch (audioError) {
        console.warn("音声の自動再生はブラウザにより保留されました:",audioError);
        audioNeedsGesture = true;
      }

      for (const participant of liveRoom.remoteParticipants.values()) {
        getParticipantTile(participant);

        for (const publication of participant.audioTrackPublications.values()) {
          if (publication.track) attachRemoteAudio(publication.track,participant);
        }

        for (const publication of participant.videoTrackPublications.values()) {
          if (!publication.track) continue;

          if (publication.source === Track.Source.Camera) {
            attachCamera(publication.track,false,participant);
          }

          if (publication.source === Track.Source.ScreenShare) {
            attachScreenTrack(publication.track,false);
          }
        }
      }

      await liveRoom.localParticipant.setMicrophoneEnabled(false);
      await liveRoom.localParticipant.setCameraEnabled(false);
    }

    async function toggleMic() {
      if (!liveRoom) return;

      try {
        const next = !micEnabled;

        $("micButton").classList.toggle("active",micEnabled);

      }
    }

    // カメラON/OFFを直列化し、古いトラックのイベントとの競合を防止する。
    async function toggleCamera() {
      if (!liveRoom || cameraSwitching || leaving) return;

      cameraSwitching = true;
      const button = $("cameraButton");
      button.disabled = true;

      const next = !cameraEnabled;

      try {
        if (next) {
          // ON：LiveKitにカメラを有効化させる。
          await liveRoom.localParticipant.setCameraEnabled(true);
          cameraEnabled = true;

          // 公開済みの最新カメラトラックを取得して明示的に接続する。
          const publication = liveRoom.localParticipant.getTrackPublication(
            Track.Source.Camera
          );

          if (publication?.track) {
            attachCamera(publication.track,true);
          } else {
            // Publishedイベントの反映待ち。短時間だけ再取得する。
            for (let attempt = 0; attempt < 10; attempt++) {
              await new Promise(resolve => setTimeout(resolve,100));

              const latest = liveRoom.localParticipant.getTrackPublication(
                Track.Source.Camera
              );

              if (latest?.track) {
                attachCamera(latest.track,true);
                break;
              }
            }
          }

          $(localTile()+"CameraTile").classList.remove("is-hidden");
        } else {
          // OFF：解除前のトラックを保持しておく。
          const oldTrack = localCameraTrack ||
            liveRoom.localParticipant.getTrackPublication(Track.Source.Camera)?.track;

          await liveRoom.localParticipant.setCameraEnabled(false);
          cameraEnabled = false;

          if (oldTrack) detachCamera(oldTrack,true);
        }

        button.classList.toggle("active",cameraEnabled);
        button.textContent = cameraEnabled ? "カメラ ON" : "カメラ OFF";

        showToast(
          cameraEnabled ? "カメラを ON にしました。" : "カメラを OFF にしました。"
        );
      } catch (error) {
        console.error("カメラ切り替えエラー:",error);

        // 実際のLiveKitの公開状態に合わせて表示を復旧する。
        const publication = liveRoom.localParticipant.getTrackPublication(
          Track.Source.Camera
        );

        cameraEnabled = Boolean(publication && publication.track && !publication.isMuted);

        if (cameraEnabled && publication?.track) {
          attachCamera(publication.track,true);
        } else if (localCameraTrack) {
          detachCamera(localCameraTrack,true);
        }

        button.classList.toggle("active",cameraEnabled);
        button.textContent = cameraEnabled ? "カメラ ON" : "カメラ OFF";
        showToast("カメラを切り替えられませんでした。");
      } finally {
        cameraSwitching = false;
        button.disabled = false;
      }
    }

    async function toggleScreenShare() {
      if (!liveRoom) return;

      try {
        await liveRoom.localParticipant.setScreenShareEnabled(!screenEnabled);
      } catch (error) {
        console.error(error);
        showToast("画面共有を切り替えられませんでした。");
      }
    }

    async function leaveRoom() {
      if (leaving) return;

      leaving = true;
      $("leaveButton").disabled = true;
      $("cameraButton").disabled = true;
      $("leaveButton").textContent = "退出中";

      try {
        if (liveRoom) await liveRoom.disconnect();
      } catch (error) {
        console.warn("切断処理:",error);
      }

      if (unsubscribeBoard) unsubscribeBoard();
      if (unsubscribeChat) unsubscribeChat();
      if (resizeObserver) resizeObserver.disconnect();

      for (const item of remoteAudioElements.values()) {
        item.audio.pause();
        item.audio.srcObject = null;
        item.audio.remove();
      }

      remoteAudioElements.clear();
      goDashboard();
    }

    $("micButton").addEventListener("click",async() => {
      if (!audioUnlocked) await unlockRemoteAudio();
      await toggleMic();
    });

    const retryAudioOnGesture = async() => {
      if (!audioNeedsGesture || !liveRoom) return;
      const ok = await unlockRemoteAudio();
      if (ok) audioNeedsGesture = false;
    };

    document.addEventListener("pointerdown",retryAudioOnGesture,{capture:true});
    document.addEventListener("keydown",retryAudioOnGesture,{capture:true});

    $("cameraButton").addEventListener("click",toggleCamera);
    $("shareButton").addEventListener("click",toggleScreenShare);
    $("leaveButton").addEventListener("click",leaveRoom);

    async function start() {
      try {
        if (!authPersistenceReady) {
          throw new Error("Firebase認証の初期化が完了していません。");
        }

        await authPersistenceReady;

        const user = await new Promise((resolve,reject) => {
          let unsubscribe = null;

          unsubscribe = onAuthStateChanged(auth,(current) => {
            if (unsubscribe) unsubscribe();
            resolve(current);
          },reject);
        });

        if (!user) {
          location.href = "../login.html";
          return;
        }

        currentUser = user;
        await getLessonAndProfile(user);

        listenBoard();
        listenChat();

        resizeObserver = new ResizeObserver(resizeCanvas);
        resizeObserver.observe($("shareStage"));
        $("shareVideo").addEventListener("loadedmetadata",resizeCanvas);
        $("shareVideo").addEventListener("resize",resizeCanvas);
        window.addEventListener("resize",resizeCanvas);

        await connectLiveKit();

        $("loadingScreen").classList.add("hidden");
        setConnection(true,"接続済み");
      } catch (error) {
        console.error("授業室初期化エラー:",error);

        showError(
          error?.message ||
          "授業室の初期化に失敗しました。時間をおいて再度お試しください。"
        );
      }
    }

    window.addEventListener("beforeunload",() => {
      if (unsubscribeBoard) unsubscribeBoard();
      if (unsubscribeChat) unsubscribeChat();
      if (resizeObserver) resizeObserver.disconnect();

      if (liveRoom) liveRoom.disconnect();

      for (const item of remoteAudioElements.values()) {
        item.audio.pause();
        item.audio.srcObject = null;
        item.audio.remove();
      }

      remoteAudioElements.clear();
    });

    start();
  </script>
</body>
</html>
