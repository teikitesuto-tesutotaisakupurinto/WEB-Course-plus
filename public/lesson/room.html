
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>授業ルーム | WEB Course-plus</title>

<style>
:root {
  --blue:#2563eb;
  --blue-light:#eff6ff;
  --border:#e2e8f0;
  --text:#172033;
  --muted:#64748b;
  --bg:#f3f5f9;
  --red:#dc2626;
}
* { box-sizing:border-box; }
html,body {
  width:100%; height:100%; margin:0; overflow:hidden;
  font-family:Inter,"Noto Sans JP",system-ui,sans-serif;
  color:var(--text); background:var(--bg);
}
button,input { font:inherit; }
button { cursor:pointer; }

.app {
  width:100%; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
.header {
  height:52px; min-height:52px; padding:0 16px;
  display:flex; align-items:center; justify-content:space-between;
  background:#fff; border-bottom:1px solid var(--border);
}
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark {
  width:30px; height:30px; display:grid; place-items:center;
  border-radius:7px; background:var(--blue); color:#fff; font-weight:800;
}
.brand-name { font-size:15px; font-weight:750; white-space:nowrap; }
.lesson-info { margin-left:12px; min-width:0; }
.lesson-title {
  font-size:13px; font-weight:700; overflow:hidden;
  white-space:nowrap; text-overflow:ellipsis;
}
.lesson-subtitle { margin-top:2px; font-size:10px; color:var(--muted); }
.connection {
  display:flex; align-items:center; gap:7px;
  color:var(--muted); font-size:12px; white-space:nowrap;
}
.connection-dot { width:8px; height:8px; border-radius:50%; background:#94a3b8; }
.connection.connected { color:#15803d; }
.connection.connected .connection-dot { background:#16a34a; }

/* メインレイアウト */
.room-main {
  flex:1; min-height:0; min-width:0;
  display:grid; grid-template-columns:minmax(0,1fr) 300px;
  gap:10px; padding:10px; overflow:hidden;
}
.classroom {
  min-width:0; min-height:0; display:flex;
  flex-direction:column; gap:8px; overflow:hidden;
}
.share-stage {
  position:relative; flex:1; min-height:0; width:100%;
  overflow:hidden; display:none; align-items:center;
  justify-content:center; background:#111827;
  border-radius:11px; border:1px solid #263244;
}
.share-stage.visible { display:flex; }
#shareVideo {
  display:none; width:100%; height:100%;
  object-fit:contain; background:#111827;
}
.share-label {
  position:absolute; z-index:4; top:12px; left:12px;
  padding:5px 9px; color:#fff;
  background:rgba(15,23,42,.75); border-radius:5px;
  font-size:11px; pointer-events:none;
}
#annotationCanvas {
  position:absolute; inset:0; width:100%; height:100%;
  z-index:3; pointer-events:none; touch-action:none;
}
#annotationCanvas.drawing { pointer-events:auto; cursor:crosshair; }

/* 画面共有時のカメラ */
.camera-strip {
  height:105px; min-height:105px;
  display:flex; gap:9px; overflow:hidden;
}
.camera-tile {
  width:150px; min-width:150px; height:100%;
  position:relative; overflow:hidden;
  background:#1e293b; border:1px solid #334155;
  border-radius:9px;
}
.camera-tile video { width:100%; height:100%; object-fit:cover; }
.camera-off {
  position:absolute; inset:0; display:grid;
  place-items:center; color:#cbd5e1; font-size:11px;
  text-align:center; padding:8px;
}
.camera-name {
  position:absolute; left:7px; bottom:6px; z-index:2;
  padding:4px 7px; color:#fff;
  background:rgba(15,23,42,.75); border-radius:4px;
  font-size:10px;
}

/* 画面共有がないときはカメラを大きく */
.classroom.no-share .share-stage { display:none; }
.classroom.no-share .camera-strip {
  flex:1; height:auto; min-height:0; gap:10px;
}
.classroom.no-share .camera-tile {
  flex:1; width:50%; min-width:0; height:100%;
  border-radius:12px;
}
.classroom.no-share .camera-name {
  left:12px; bottom:12px; padding:6px 10px; font-size:12px;
}
.classroom.no-share .camera-off { font-size:13px; }

/* 描画ツール */
.drawing-tools {
  position:absolute; z-index:6; top:10px; right:10px;
  display:none; align-items:center; flex-wrap:wrap; gap:5px;
  max-width:calc(100% - 20px); padding:7px;
  background:#fff; border:1px solid var(--border);
  border-radius:9px; box-shadow:0 3px 15px rgba(0,0,0,.16);
}
.drawing-tools.visible { display:flex; }
.tool-button {
  height:32px; padding:0 10px;
  border:1px solid var(--border); border-radius:6px;
  background:#fff; color:#334155; font-size:11px; font-weight:650;
}
.tool-button.active {
  color:var(--blue); background:var(--blue-light); border-color:#93c5fd;
}
.tool-color {
  width:23px; height:23px; padding:0;
  border:2px solid #fff; outline:1px solid #cbd5e1; border-radius:50%;
}
.tool-color.selected { outline:2px solid var(--blue); }
.tool-divider { width:1px; height:22px; background:var(--border); margin:0 2px; }

/* チャット */
.side-panel {
  min-width:0; min-height:0; display:flex;
  flex-direction:column; overflow:hidden;
  background:#fff; border:1px solid var(--border); border-radius:10px;
}
.panel-heading {
  height:45px; min-height:45px; padding:0 13px;
  display:flex; align-items:center;
  border-bottom:1px solid var(--border);
  font-size:13px; font-weight:700;
}
.chat-list {
  flex:1; min-height:0; display:flex; flex-direction:column;
  gap:11px; padding:12px; overflow-y:auto;
}
.chat-message {
  display:flex; flex-direction:column; gap:4px;
  max-width:95%; align-self:flex-start;
}
.chat-message.mine { align-self:flex-end; align-items:flex-end; }
.chat-sender,.chat-time { color:var(--muted); font-size:10px; }
.chat-bubble {
  padding:9px 11px; border-radius:9px;
  background:#f1f5f9; font-size:12px; line-height:1.6;
  white-space:pre-wrap; overflow-wrap:anywhere;
}
.chat-message.mine .chat-bubble { color:#fff; background:var(--blue); }
.chat-form {
  display:flex; gap:7px; padding:10px;
  border-top:1px solid var(--border);
}
.chat-input {
  flex:1; min-width:0; height:38px; padding:0 10px;
  border:1px solid var(--border); border-radius:7px;
  outline:none; font-size:12px;
}
.chat-input:focus { border-color:var(--blue); }
.send-button {
  width:54px; border:0; border-radius:7px;
  color:#fff; background:var(--blue); font-size:11px;
}

/* 操作バー */
.control-bar {
  height:62px; min-height:62px; display:flex;
  align-items:center; justify-content:center; gap:8px;
  padding:0 10px; background:#fff; border-top:1px solid var(--border);
}
.control-button {
  min-width:82px; height:40px; padding:0 12px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border); border-radius:7px;
  background:#fff; color:#334155; font-size:11px; font-weight:650;
}
.control-button:hover { background:#f8fafc; }
.control-button.active {
  color:var(--blue); background:var(--blue-light); border-color:#bfdbfe;
}
.control-button.danger { color:#fff; background:var(--red); border-color:var(--red); }
.control-button:disabled { opacity:.45; cursor:not-allowed; }
.footer {
  height:18px; min-height:18px; display:flex;
  justify-content:center; align-items:center;
  color:#94a3b8; background:#fff;
  border-top:1px solid #f1f5f9; font-size:9px;
}

/* エラー */
.error-screen {
  position:fixed; inset:0; z-index:100;
  display:none; align-items:center; justify-content:center;
  padding:20px; background:var(--bg);
}
.error-card {
  width:min(450px,100%); padding:25px;
  background:#fff; border:1px solid var(--border); border-radius:12px;
}
.error-card h2 { margin:0 0 12px; font-size:18px; }
.error-card p { color:var(--muted); font-size:13px; line-height:1.8; overflow-wrap:anywhere; }
.back-button {
  height:39px; padding:0 16px; margin-top:10px;
  border:0; border-radius:6px; color:#fff; background:var(--blue);
}
.toast {
  position:fixed; z-index:200; left:50%; bottom:75px;
  transform:translateX(-50%); padding:9px 15px;
  border-radius:7px; background:#1e293b; color:#fff;
  font-size:12px; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show { opacity:1; }

@media(max-width:850px) {
  .room-main { grid-template-columns:minmax(0,1fr) 250px; }
  .control-button { min-width:68px; padding:0 7px; }
}
@media(max-width:620px) {
  .header { height:47px; min-height:47px; padding:0 8px; }
  .brand-name { font-size:12px; }
  .brand-mark { width:27px; height:27px; }
  .lesson-info { margin-left:5px; }
  .lesson-subtitle { display:none; }
  .room-main { display:flex; flex-direction:column; gap:6px; padding:6px; }
  .classroom { flex:1; min-height:0; }
  .classroom.no-share .camera-strip { flex:1; min-height:0; }
  .camera-strip { height:75px; min-height:75px; }
  .camera-tile { width:110px; min-width:110px; }
  .classroom.no-share .camera-tile { width:50%; min-width:0; }
  .side-panel { height:165px; min-height:165px; }
  .control-bar { height:55px; min-height:55px; gap:4px; padding:0 4px; }
  .control-button { flex:1; min-width:0; height:37px; padding:0 3px; font-size:9px; }
  .footer { display:none; }
  .drawing-tools { top:5px; right:5px; }
}
</style>
</head>

<body>
<div class="app">
<header class="header">
  <div class="brand">
    <div class="brand-mark">W</div>
    <div class="brand-name">WEB Course-plus</div>
    <div class="lesson-info">
      <div class="lesson-title" id="lessonTitle">授業ルーム</div>
      <div class="lesson-subtitle" id="lessonSubject">授業情報を読み込み中</div>
    </div>
  </div>
  <div class="connection" id="connectionStatus">
    <span class="connection-dot"></span>
    <span id="connectionText">接続準備中</span>
  </div>
</header>

<main class="room-main">
<section class="classroom no-share" id="classroom">

  <div class="share-stage" id="shareStage">
    <video id="shareVideo" autoplay playsinline></video>
    <canvas id="annotationCanvas"></canvas>
    <div class="share-label">画面共有</div>

    <div class="drawing-tools" id="drawingTools">
      <button class="tool-button active" id="penTool" type="button">ペン</button>
      <button class="tool-button" id="eraserTool" type="button">消しゴム</button>
      <button class="tool-button" id="clearTool" type="button">全消去</button>
      <span class="tool-divider"></span>
      <button class="tool-color selected" data-color="#ef4444" style="background:#ef4444" aria-label="赤色" type="button"></button>
      <button class="tool-color" data-color="#2563eb" style="background:#2563eb" aria-label="青色" type="button"></button>
      <button class="tool-color" data-color="#16a34a" style="background:#16a34a" aria-label="緑色" type="button"></button>
      <button class="tool-color" data-color="#facc15" style="background:#facc15" aria-label="黄色" type="button"></button>
    </div>
  </div>

  <div class="camera-strip">
    <div class="camera-tile">
      <div class="camera-off" id="localCameraOff">あなたのカメラは OFF です</div>
      <video id="localCamera" autoplay playsinline muted></video>
      <div class="camera-name" id="localName">あなた</div>
    </div>
    <div class="camera-tile">
      <div class="camera-off" id="remoteCameraOff">相手のカメラを待っています</div>
      <video id="remoteCamera" autoplay playsinline></video>
      <div class="camera-name" id="remoteName">相手</div>
    </div>
  </div>
</section>

<aside class="side-panel">
  <div class="panel-heading">授業チャット</div>
  <div class="chat-list" id="chatList"></div>
  <form class="chat-form" id="chatForm">
    <input class="chat-input" id="chatInput" maxlength="500"
      placeholder="メッセージを入力..." autocomplete="off">
    <button class="send-button" type="submit">送信</button>
  </form>
</aside>
</main>

<footer class="control-bar">
  <button class="control-button" id="micButton" disabled type="button">マイク ON</button>
  <button class="control-button" id="cameraButton" disabled type="button">カメラ ON</button>
  <button class="control-button" id="shareButton" disabled type="button">画面共有</button>
  <button class="control-button" id="drawButton" disabled type="button">ペン書き</button>
  <button class="control-button danger" id="leaveButton" type="button">退出</button>
</footer>

<div class="footer">
  © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
</div>
</div>

<div class="error-screen" id="errorScreen">
  <div class="error-card">
    <h2>授業に入室できません</h2>
    <p id="errorMessage">エラーが発生しました。</p>
    <button class="back-button" id="backButton" type="button">ダッシュボードへ戻る</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { auth, db, authPersistenceReady }
  from "../assets/js/firebase.js";

import {
  doc,getDoc,collection,addDoc,setDoc,updateDoc,
  deleteDoc,getDocs,onSnapshot,query,orderBy,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

import { onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import { Room,RoomEvent,Track }
  from "https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/+esm";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const lessonId = params.get("lessonId") || params.get("id");

let currentUser=null,userProfile=null,lessonData=null,liveRoom=null;
let isConnected=false,micEnabled=false,cameraEnabled=false;
let screenEnabled=false,drawingEnabled=false,drawingMode="pen";
let drawingColor="#ef4444";
let unsubscribeBoard=null,unsubscribeChat=null;
let activeStroke=null,activeStrokeId=null;
let strokeWriteQueue=Promise.resolve();
let pendingStrokeTimer=null,boardClearing=false,leavingRoom=false;

const canvas=$("annotationCanvas");
const ctx=canvas.getContext("2d");
const strokes=new Map();

function toast(message) {
  const el=$("toast");
  el.textContent=message;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2200);
}

function showError(error) {
  console.error(error);
  $("errorMessage").textContent=error?.message || "予期しないエラーが発生しました。";
  $("errorScreen").style.display="flex";
  $("connectionText").textContent="接続エラー";
}

function setConnection(connected) {
  isConnected=connected;
  $("connectionStatus").classList.toggle("connected",connected);
  $("connectionText").textContent=connected?"入室済み":"未接続";
  ["micButton","cameraButton","shareButton","drawButton"].forEach(id=>{
    $(id).disabled=!connected;
  });
}

/* 描画キャンバス */
function resizeCanvas() {
  const rect=canvas.getBoundingClientRect();
  const ratio=window.devicePixelRatio||1;
  canvas.width=Math.max(1,Math.round(rect.width*ratio));
  canvas.height=Math.max(1,Math.round(rect.height*ratio));
  ctx.setTransform(ratio,0,0,ratio,0,0);
  renderBoard();
}

function drawStroke(stroke) {
  if(!stroke || !Array.isArray(stroke.points) || !stroke.points.length) return;
  const rect=canvas.getBoundingClientRect();
  ctx.save();
  ctx.globalCompositeOperation=stroke.mode==="erase"?"destination-out":"source-over";
  ctx.strokeStyle=stroke.color||"#ef4444";
  ctx.fillStyle=stroke.color||"#ef4444";
  ctx.lineWidth=Number(stroke.width)||3;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  const points=stroke.points.map(p=>({x:p.x*rect.width,y:p.y*rect.height}));
  if(points.length===1) {
    ctx.beginPath();
    ctx.arc(points[0].x,points[0].y,Math.max(1,(Number(stroke.width)||3)/2),0,Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(points[0].x,points[0].y);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
    ctx.stroke();
  }
  ctx.restore();
}

function renderBoard() {
  const rect=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,rect.height);
  for(const stroke of strokes.values()) drawStroke(stroke);
}

function getCanvasPoint(event) {
  const rect=canvas.getBoundingClientRect();
  return {
    x:Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),
    y:Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height))
  };
}

function subscribeBoard() {
  if(unsubscribeBoard) unsubscribeBoard();
  const q=query(collection(db,"lessonBoards",lessonId,"strokes"),orderBy("createdAt","asc"));
  unsubscribeBoard=onSnapshot(q,snapshot=>{
    if(boardClearing) return;
    strokes.clear();
    snapshot.forEach(item=>strokes.set(item.id,item.data()));
    renderBoard();
  },error=>{
    console.error("ホワイトボード同期エラー:",error);
    toast("ホワイトボードを同期できませんでした。");
  });
}

/* 描画の保存キュー */
function queueStrokeWrite(id,points,isNew=false,strokeInfo=null) {
  const ref=doc(db,"lessonBoards",lessonId,"strokes",id);
  strokeWriteQueue=strokeWriteQueue.then(async()=>{
    if(isNew) {
      await setDoc(ref,{
        createdBy:currentUser.uid,
        color:strokeInfo.color,
        width:strokeInfo.width,
        mode:strokeInfo.mode,
        points,
        createdAt:serverTimestamp()
      });
    } else {
      await updateDoc(ref,{points,updatedAt:serverTimestamp()});
    }
  }).catch(error=>{
    console.error("描画保存エラー:",error);
    toast("描画を同期できませんでした。");
  });
  return strokeWriteQueue;
}

function scheduleStrokeSave() {
  if(!activeStrokeId || !activeStroke) return;
  if(pendingStrokeTimer) clearTimeout(pendingStrokeTimer);
  const id=activeStrokeId;
  const points=activeStroke.points.map(p=>({...p}));
  pendingStrokeTimer=setTimeout(()=>{
    pendingStrokeTimer=null;
    queueStrokeWrite(id,points);
  },100);
}

async function flushStrokeSave() {
  if(pendingStrokeTimer) {
    clearTimeout(pendingStrokeTimer);
    pendingStrokeTimer=null;
  }
  if(activeStrokeId && activeStroke) {
    await queueStrokeWrite(
      activeStrokeId,
      activeStroke.points.map(p=>({...p}))
    );
  }
  await strokeWriteQueue;
}

canvas.addEventListener("pointerdown",async event=>{
  if(!drawingEnabled || !isConnected || boardClearing) return;
  event.preventDefault();
  const point=getCanvasPoint(event);
  const id=crypto.randomUUID();
  const info={
    color:drawingColor,
    width:drawingMode==="erase"?24:3,
    mode:drawingMode
  };
  activeStrokeId=id;
  activeStroke={...info,createdBy:currentUser.uid,points:[point]};
  strokes.set(id,{...activeStroke});
  renderBoard();

  await queueStrokeWrite(id,[point],true,info);
  if(activeStrokeId===id) {
    try { canvas.setPointerCapture(event.pointerId); } catch(e) {}
  }
});

canvas.addEventListener("pointermove",event=>{
  if(!drawingEnabled || !activeStroke || !activeStrokeId) return;
  if(!(event.buttons&1)) return;
  event.preventDefault();
  activeStroke.points.push(getCanvasPoint(event));
  strokes.set(activeStrokeId,{...activeStroke,points:[...activeStroke.points]});
  renderBoard();
  scheduleStrokeSave();
});

async function finishStroke() {
  if(!activeStrokeId || !activeStroke) return;
  const id=activeStrokeId;
  const points=activeStroke.points.map(p=>({...p}));
  activeStroke=null;
  activeStrokeId=null;
  if(pendingStrokeTimer) {
    clearTimeout(pendingStrokeTimer);
    pendingStrokeTimer=null;
  }
  await queueStrokeWrite(id,points);
}
canvas.addEventListener("pointerup",finishStroke);
canvas.addEventListener("pointercancel",finishStroke);
canvas.addEventListener("lostpointercapture",finishStroke);

function setDrawingMode(mode) {
  drawingMode=mode;
  $("penTool").classList.toggle("active",mode==="pen");
  $("eraserTool").classList.toggle("active",mode==="erase");
}
$("penTool").addEventListener("click",()=>setDrawingMode("pen"));
$("eraserTool").addEventListener("click",()=>setDrawingMode("erase"));

document.querySelectorAll(".tool-color").forEach(button=>{
  button.addEventListener("click",()=>{
    drawingColor=button.dataset.color;
    document.querySelectorAll(".tool-color").forEach(b=>b.classList.remove("selected"));
    button.classList.add("selected");
    setDrawingMode("pen");
  });
});

$("drawButton").addEventListener("click",()=>{
  if(!screenEnabled && !$("shareStage").classList.contains("visible")) {
    toast("画面共有中にペン書きを利用できます。");
    return;
  }
  drawingEnabled=!drawingEnabled;
  canvas.classList.toggle("drawing",drawingEnabled);
  $("drawingTools").classList.toggle("visible",drawingEnabled);
  $("drawButton").classList.toggle("active",drawingEnabled);
  $("drawButton").textContent=drawingEnabled?"ペン書き ON":"ペン書き";
  if(!drawingEnabled) finishStroke();
});

/* 全消去 */
async function clearBoard() {
  if(boardClearing || !isConnected) return;
  if(!confirm("ホワイトボードをすべて消去しますか？")) return;
  boardClearing=true;
  try {
    await finishStroke();
    await flushStrokeSave();
    const snapshot=await getDocs(collection(db,"lessonBoards",lessonId,"strokes"));
    for(const item of snapshot.docs) await deleteDoc(item.ref);
    strokes.clear();
    renderBoard();
    toast("ホワイトボードを消去しました。");
  } catch(error) {
    console.error(error);
    toast("全消去できませんでした。権限を確認してください。");
  } finally {
    boardClearing=false;
  }
}
$("clearTool").addEventListener("click",clearBoard);

/* チャット */
function subscribeChat() {
  if(unsubscribeChat) unsubscribeChat();
  const q=query(collection(db,"lessonMessages",lessonId,"messages"),orderBy("createdAt","asc"));
  unsubscribeChat=onSnapshot(q,snapshot=>{
    const list=$("chatList");
    list.innerHTML="";
    snapshot.forEach(item=>{
      const message=item.data();
      const mine=message.senderId===currentUser.uid;
      const wrapper=document.createElement("div");
      wrapper.className="chat-message"+(mine?" mine":"");
      const sender=document.createElement("div");
      sender.className="chat-sender";
      sender.textContent=message.senderName||"参加者";
      const bubble=document.createElement("div");
      bubble.className="chat-bubble";
      bubble.textContent=message.text||"";
      const time=document.createElement("div");
      time.className="chat-time";
      if(message.createdAt?.toDate) {
        time.textContent=message.createdAt.toDate().toLocaleTimeString(
          "ja-JP",{hour:"2-digit",minute:"2-digit"}
        );
      }
      wrapper.append(sender,bubble,time);
      list.appendChild(wrapper);
    });
    list.scrollTop=list.scrollHeight;
  },error=>{
    console.error(error);
    toast("チャットを同期できませんでした。");
  });
}

$("chatForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const input=$("chatInput");
  const text=input.value.trim();
  if(!text) return;
  if(!isConnected) {
    toast("授業に接続してから送信してください。");
    return;
  }
  input.disabled=true;
  try {
    await addDoc(collection(db,"lessonMessages",lessonId,"messages"),{
      senderId:currentUser.uid,
      senderName:userProfile.displayName||currentUser.email||"参加者",
      text,
      createdAt:serverTimestamp()
    });
    input.value="";
  } catch(error) {
    console.error(error);
    toast("メッセージを送信できませんでした。");
  } finally {
    input.disabled=false;
    input.focus();
  }
});

/* カメラ・画面共有の表示 */
function setShareLayout(active) {
  $("classroom").classList.toggle("no-share",!active);
  $("shareStage").classList.toggle("visible",active);
  if(!active) {
    drawingEnabled=false;
    canvas.classList.remove("drawing");
    $("drawingTools").classList.remove("visible");
    $("drawButton").classList.remove("active");
    $("drawButton").textContent="ペン書き";
  }
  requestAnimationFrame(resizeCanvas);
}

function showScreenTrack(track) {
  if(!track) return;
  const video=$("shareVideo");
  video.srcObject=null;
  track.attach(video);
  video.style.display="block";
  setShareLayout(true);
}
function hideScreenTrack(track) {
  const video=$("shareVideo");
  if(track) track.detach(video);
  video.srcObject=null;
  video.style.display="none";
  setShareLayout(false);
  renderBoard();
}
function showCameraTrack(track,local=false) {
  if(!track) return;
  const video=local?$("localCamera"):$("remoteCamera");
  const off=local?$("localCameraOff"):$("remoteCameraOff");
  track.attach(video);
  off.style.display="none";
}
function hideCameraTrack(track,local=false) {
  const video=local?$("localCamera"):$("remoteCamera");
  const off=local?$("localCameraOff"):$("remoteCameraOff");
  if(track) track.detach(video);
  off.style.display="grid";
}
function attachExistingTracks() {
  if(!liveRoom) return;
  liveRoom.localParticipant.trackPublications.forEach(pub=>{
    if(!pub.track) return;
    if(pub.source===Track.Source.Camera) showCameraTrack(pub.track,true);
    if(pub.source===Track.Source.ScreenShare) showScreenTrack(pub.track);
  });
  liveRoom.remoteParticipants.forEach(participant=>{
    participant.trackPublications.forEach(pub=>{
      if(!pub.track) return;
      if(pub.source===Track.Source.Camera) {
        showCameraTrack(pub.track,false);
        $("remoteName").textContent=participant.name||"相手";
      }
      if(pub.source===Track.Source.ScreenShare) showScreenTrack(pub.track);
    });
  });
}

/* LiveKit */
async function connectLiveKit() {
  const idToken=await currentUser.getIdToken();
  const response=await fetch("/api/livekit/token",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${idToken}`
    },
    body:JSON.stringify({lessonId})
  });
  if(!response.ok) {
    throw new Error("LiveKitトークンを取得できませんでした: "+await response.text());
  }
  const data=await response.json();
  const serverUrl=data.url||data.serverUrl;
  if(!serverUrl || !data.token) throw new Error("LiveKitの接続情報が不足しています。");

  liveRoom=new Room({adaptiveStream:true,dynacast:true});

  liveRoom.on(RoomEvent.TrackSubscribed,(track,pub,participant)=>{
    if(pub.source===Track.Source.ScreenShare) showScreenTrack(track);
    if(pub.source===Track.Source.Camera) {
      showCameraTrack(track,false);
      $("remoteName").textContent=participant.name||"相手";
    }
  });
  liveRoom.on(RoomEvent.TrackUnsubscribed,(track,pub)=>{
    if(pub.source===Track.Source.ScreenShare) hideScreenTrack(track);
    if(pub.source===Track.Source.Camera) hideCameraTrack(track,false);
  });
  liveRoom.on(RoomEvent.LocalTrackPublished,pub=>{
    if(pub.source===Track.Source.ScreenShare && pub.track) showScreenTrack(pub.track);
    if(pub.source===Track.Source.Camera && pub.track) showCameraTrack(pub.track,true);
  });
  liveRoom.on(RoomEvent.LocalTrackUnpublished,pub=>{
    if(pub.source===Track.Source.ScreenShare) hideScreenTrack(pub.track);
    if(pub.source===Track.Source.Camera) hideCameraTrack(pub.track,true);
  });
  liveRoom.on(RoomEvent.Disconnected,()=>{
    setConnection(false);
    toast("授業から切断されました。");
  });

  await liveRoom.connect(serverUrl,data.token);
  setConnection(true);
  $("localName").textContent=userProfile.displayName||"あなた";
  attachExistingTracks();
  subscribeBoard();
  subscribeChat();
  resizeCanvas();
}

/* 退出：ログアウトせず、権限別ダッシュボードへ */
async function leaveRoom() {
  if(leavingRoom) return;
  if(!confirm("授業ルームから退出しますか？")) return;
  leavingRoom=true;
  $("leaveButton").disabled=true;
  $("leaveButton").textContent="退出中...";
  setConnection(false);

  if(unsubscribeBoard) {
    unsubscribeBoard();
    unsubscribeBoard=null;
  }
  if(unsubscribeChat) {
    unsubscribeChat();
    unsubscribeChat=null;
  }

  try {
    await finishStroke();
    await flushStrokeSave();
  } catch(error) {
    console.error("描画保存エラー:",error);
  }

  try {
    if(liveRoom) {
      await liveRoom.disconnect();
      liveRoom=null;
    }
  } catch(error) {
    console.error("LiveKit退出エラー:",error);
  }

  const destinations={
    student:"/student/dashboard.html",
    teacher:"/teacher/dashboard.html",
    admin:"/admin/dashboard.html"
  };
  location.replace(destinations[userProfile?.role]||"/login.html");
}
$("leaveButton").addEventListener("click",leaveRoom);

/* 授業・ユーザー情報 */
async function getLessonAndProfile() {
  if(!lessonId) throw new Error("URLに授業IDが指定されていません。");

  const profileSnapshot=await getDoc(doc(db,"users",currentUser.uid));
  if(!profileSnapshot.exists()) throw new Error("ユーザープロフィールが登録されていません。");
  userProfile=profileSnapshot.data();

  if(userProfile.status && userProfile.status!=="active") {
    throw new Error("このアカウントは現在利用できません。");
  }
  if(!["student","teacher","admin"].includes(userProfile.role)) {
    throw new Error("アカウントの権限が正しく設定されていません。");
  }

  const lessonSnapshot=await getDoc(doc(db,"lessons",lessonId));
  if(!lessonSnapshot.exists()) throw new Error("指定された授業が見つかりません。");
  lessonData=lessonSnapshot.data();

  if(userProfile.role==="teacher" && lessonData.teacherId!==currentUser.uid) {
    throw new Error("この授業の担当者ではありません。");
  }
  if(userProfile.role==="student" && lessonData.studentId!==currentUser.uid) {
    throw new Error("この授業に参加する権限がありません。");
  }
  if(["cancelled","completed"].includes(lessonData.status)) {
    throw new Error("この授業は終了またはキャンセルされています。");
  }

  $("lessonTitle").textContent=lessonData.title||"個別指導";
  $("lessonSubject").textContent=lessonData.subject||"授業";
  $("localName").textContent=userProfile.displayName||"あなた";
}

/* 起動 */
async function start() {
  try {
    await authPersistenceReady;
    currentUser=await new Promise((resolve,reject)=>{
      const unsubscribe=onAuthStateChanged(auth,user=>{
        unsubscribe();
        if(user) resolve(user);
        else reject(new Error("ログインしてください。"));
      },reject);
    });
    await getLessonAndProfile();
    await connectLiveKit();
    resizeCanvas();
  } catch(error) {
    showError(error);
  }
}

$("backButton").addEventListener("click",()=>{
  const destinations={
    student:"/student/dashboard.html",
    teacher:"/teacher/dashboard.html",
    admin:"/admin/dashboard.html"
  };
  location.href=destinations[userProfile?.role]||"/login.html";
});

window.addEventListener("resize",resizeCanvas);
start();
