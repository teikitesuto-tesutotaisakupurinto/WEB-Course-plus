
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンライン授業 | WEB Course-plus</title>
  <link rel="stylesheet" href="/assets/css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    .room-page { max-width: 1500px; margin: 0 auto; padding: 20px; }
    .room-top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .video-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .video-tile { position:relative; min-height:260px; background:#101827; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .video-tile video { width:100%; height:100%; min-height:260px; object-fit:contain; background:#101827; }
    .video-label { position:absolute; left:12px; bottom:12px; z-index:2; background:#0009; color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; }
    .video-placeholder { color:#fff; text-align:center; padding:20px; }
    .room-controls { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:18px; margin-top:14px; }
    .room-status { padding:12px 16px; border-radius:8px; background:#eef3f9; margin-bottom:14px; }
    .room-error { color:#b42318; }
    .room-info { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
    .room-info .card { padding:14px; }
    @media(max-width:700px) {
      .video-grid { grid-template-columns:1fr; }
      .video-tile,.video-tile video { min-height:220px; }
      .room-info { grid-template-columns:1fr; }
      .room-page { padding:12px; }
    }
  </style>
</head>
<body>
  <main class="room-page">
    <div class="room-top">
      <div>
        <a href="javascript:history.back()" class="btn btn-secondary btn-sm">戻る</a>
        <h1 class="page-title" style="margin-top:12px">オンライン授業</h1>
        <p id="lesson-title" class="text-muted">授業情報を確認しています...</p>
      </div>
      <button id="leave-button" class="btn btn-danger" disabled>授業を退出</button>
    </div>

    <div class="room-info">
      <div class="card">
        <div class="text-muted">教科</div>
        <strong id="lesson-subject">-</strong>
      </div>
      <div class="card">
        <div class="text-muted">授業日時</div>
        <strong id="lesson-time">-</strong>
      </div>
      <div class="card">
        <div class="text-muted">接続状態</div>
        <strong id="connection-status">接続準備中</strong>
      </div>
    </div>

    <div id="room-message" class="room-status" role="status">
      授業情報を確認しています。
    </div>

    <section class="video-grid" aria-label="授業映像">
      <div class="video-tile" id="local-tile">
        <div class="video-placeholder" id="local-placeholder">自分の映像<br>接続後に表示されます</div>
        <div class="video-label">自分</div>
      </div>
      <div class="video-tile" id="remote-tile">
        <div class="video-placeholder" id="remote-placeholder">相手の映像<br>相手が参加すると表示されます</div>
        <div class="video-label">相手</div>
      </div>
    </section>

    <section class="card room-controls">
      <button id="camera-button" class="btn btn-secondary" disabled>カメラをオン</button>
      <button id="mic-button" class="btn btn-secondary" disabled>マイクをオン</button>
      <button id="screen-button" class="btn btn-secondary" disabled>画面を共有</button>
      <button id="stop-screen-button" class="btn btn-secondary" disabled>共有を停止</button>
    </section>

    <footer id="app-footer"></footer>
  </main>

<script type="module">
  import { auth, db } from "/assets/js/firebase.js";
  import { renderFooter, toDate, formatDateTime } from "/assets/js/common.js";
  import {
    doc, getDoc
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  renderFooter();

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const lessonId = params.get("lessonId");

  let liveRoom = null;
  let localCameraEnabled = false;
  let localMicEnabled = false;
  let screenTrack = null;
  let isLeaving = false;

  function setStatus(message, error = false) {
    $("room-message").textContent = message;
    $("room-message").classList.toggle("room-error", error);
    $("connection-status").textContent = error ? "エラー" : message;
  }

  function setButtons(enabled) {
    ["camera-button", "mic-button", "screen-button", "leave-button"]
      .forEach(id => $(id).disabled = !enabled);
  }

  function attachTrack(track, elementId, participantName) {
    const tile = $(elementId);
    const placeholder = tile.querySelector(".video-placeholder");
    if (placeholder) placeholder.remove();

    const element = track.attach();
    element.autoplay = true;
    element.playsInline = true;
    element.style.width = "100%";
    element.style.height = "100%";
    element.style.objectFit = "contain";
    tile.appendChild(element);

    const label = tile.querySelector(".video-label");
    if (label) label.textContent = participantName || "参加者";
  }

  function detachTrack(track) {
    track.detach().forEach(element => element.remove());
  }

  async function getLesson() {
    if (!lessonId) throw new Error("授業IDが指定されていません。");

    const snap = await getDoc(doc(db, "lessons", lessonId));
    if (!snap.exists()) throw new Error("授業が見つかりません。");

    const lesson = snap.data();
    const user = auth.currentUser;

    if (!user) throw new Error("ログインしてください。");

    // 画面側でも参加者を確認。最終的な権限確認はサーバー側でも実施。
    const profileSnap = await getDoc(doc(db, "users", user.uid));
    if (!profileSnap.exists()) throw new Error("アカウント情報がありません。");

    const profile = profileSnap.data();
    if (profile.status !== "active") throw new Error("このアカウントは利用できません。");

    const allowed =
      profile.role === "admin" ||
      (profile.role === "teacher" && lesson.teacherId === user.uid) ||
      (profile.role === "student" && lesson.studentId === user.uid);

    if (!allowed) throw new Error("この授業に参加する権限がありません。");

    if (!["scheduled", "in_progress"].includes(lesson.status)) {
      throw new Error("この授業は現在参加できる状態ではありません。");
    }

    const start = toDate(lesson.startAt);
    const end = toDate(lesson.endAt);
    const now = new Date();

    if (start && now < new Date(start.getTime() - 5 * 60 * 1000)) {
      throw new Error("授業開始5分前から参加できます。");
    }

    if (end && now > new Date(end.getTime() + 30 * 60 * 1000)) {
      throw new Error("この授業の参加可能時間は終了しました。");
    }

    $("lesson-title").textContent = lesson.title || "個別指導";
    $("lesson-subject").textContent = lesson.subject || "未設定";
    $("lesson-time").textContent = start ? formatDateTime(start) : "日時未設定";

    return { lesson, user, profile };
  }

  async function requestToken() {
    const user = auth.currentUser;
    if (!user) throw new Error("ログイン状態を確認できません。");

    const idToken = await user.getIdToken();

    const response = await fetch("/api/livekit/token", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${idToken}`
      },
      body: JSON.stringify({ lessonId })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || data.message || "授業への接続準備に失敗しました。");
    }

    if (!data.token || !data.url) {
      throw new Error("サーバーから接続情報を取得できませんでした。");
    }

    return data;
  }

  async function connect() {
    if (!window.LivekitClient) {
      throw new Error("ビデオ通話ライブラリを読み込めませんでした。");
    }

    const { Room, RoomEvent, Track } = window.LivekitClient;
    const credentials = await requestToken();

    liveRoom = new Room({
      adaptiveStream: true,
      dynacast: true
    });

    liveRoom.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
      if (track.kind === Track.Kind.Video) {
        attachTrack(track, "remote-tile", participant.name || "相手");
      }
      if (track.kind === Track.Kind.Audio) {
        const audio = track.attach();
        audio.autoplay = true;
        document.body.appendChild(audio);
      }
    });

    liveRoom.on(RoomEvent.TrackUnsubscribed, track => {
      detachTrack(track);
    });

    liveRoom.on(RoomEvent.ParticipantDisconnected, participant => {
      setStatus(`${participant.name || "参加者"}が退出しました。`);
    });

    liveRoom.on(RoomEvent.Disconnected, () => {
      if (!isLeaving) setStatus("接続が切断されました。再接続が必要です。", true);
    });

    await liveRoom.connect(credentials.url, credentials.token);

    await liveRoom.localParticipant.enableCameraAndMicrophone();

    const cameraPublication =
      liveRoom.localParticipant.getTrackPublication(Track.Source.Camera);

    const micPublication =
      liveRoom.localParticipant.getTrackPublication(Track.Source.Microphone);

    if (cameraPublication?.track) {
      attachTrack(cameraPublication.track, "local-tile", "自分");
      localCameraEnabled = true;
      $("camera-button").textContent = "カメラをオフ";
    }

    localMicEnabled = Boolean(micPublication);
    $("mic-button").textContent = localMicEnabled ? "マイクをオフ" : "マイクをオン";

    $("screen-button").disabled = false;
    $("stop-screen-button").disabled = true;
    $("leave-button").disabled = false;
    $("camera-button").disabled = false;
    $("mic-button").disabled = false;

    setStatus("授業に接続しました。");
  }

  async function toggleCamera() {
    if (!liveRoom) return;
    localCameraEnabled = !localCameraEnabled;
    await liveRoom.localParticipant.setCameraEnabled(localCameraEnabled);

    $("camera-button").textContent =
      localCameraEnabled ? "カメラをオフ" : "カメラをオン";

    if (!localCameraEnabled) {
      const tile = $("local-tile");
      tile.querySelectorAll("video").forEach(video => video.remove());
      if (!$("local-placeholder")) {
        const placeholder = document.createElement("div");
        placeholder.id = "local-placeholder";
        placeholder.className = "video-placeholder";
        placeholder.textContent = "カメラはオフです";
        tile.prepend(placeholder);
      }
    }
  }

  async function toggleMic() {
    if (!liveRoom) return;
    localMicEnabled = !localMicEnabled;
    await liveRoom.localParticipant.setMicrophoneEnabled(localMicEnabled);
    $("mic-button").textContent =
      localMicEnabled ? "マイクをオフ" : "マイクをオン";
  }

  async function startScreenShare() {
    if (!liveRoom) return;
    try {
      await liveRoom.localParticipant.setScreenShareEnabled(true);
      $("screen-button").disabled = true;
      $("stop-screen-button").disabled = false;
      setStatus("画面を共有しています。");
    } catch (error) {
      console.error(error);
      setStatus("画面共有を開始できませんでした。ブラウザの許可を確認してください。", true);
    }
  }

  async function stopScreenShare() {
    if (!liveRoom) return;
    await liveRoom.localParticipant.setScreenShareEnabled(false);
    $("screen-button").disabled = false;
    $("stop-screen-button").disabled = true;
    setStatus("画面共有を停止しました。");
  }

  async function leaveRoom() {
    if (isLeaving) return;
    isLeaving = true;
    $("leave-button").disabled = true;

    try {
      if (liveRoom) {
        await liveRoom.disconnect();
        liveRoom = null;
      }
    } catch (error) {
      console.error(error);
    }

    location.href = auth.currentUser?.uid
      ? (history.state?.role === "teacher" ? "/teacher/dashboard.html" : "/student/dashboard.html")
      : "/login.html";
  }

  $("camera-button").addEventListener("click", () => {
    toggleCamera().catch(error => setStatus(error.message, true));
  });
  $("mic-button").addEventListener("click", () => {
    toggleMic().catch(error => setStatus(error.message, true));
  });
  $("screen-button").addEventListener("click", startScreenShare);
  $("stop-screen-button").addEventListener("click", stopScreenShare);
  $("leave-button").addEventListener("click", leaveRoom);

  window.addEventListener("beforeunload", () => {
    if (liveRoom) liveRoom.disconnect();
  });

  async function start() {
    try {
      if (!lessonId) throw new Error("授業IDが指定されていません。");

      await new Promise((resolve, reject) => {
        const unsubscribe = onAuthStateChanged(auth, user => {
          unsubscribe();
          if (user) resolve(user);
          else reject(new Error("ログインしてください。"));
        });
      });

      const { profile } = await getLesson();
      history.replaceState({ role: profile.role }, "");

      setStatus("LiveKitに接続しています...");
      await connect();

    } catch (error) {
      console.error("[Lesson Room]", error);
      setStatus(error.message || "授業に接続できませんでした。", true);
      setButtons(false);
    }
  }

  start();
</script>
</body>
</html>
