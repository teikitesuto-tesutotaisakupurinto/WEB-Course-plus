
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f8fc">
  <title>オンライン授業 | WEB Course-plus</title>

  <style>
    :root {
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      color: #17263c;
      background: #f4f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --blue: #2563eb;
      --border: #e1e7ef;
      --muted: #68778c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 750;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--blue);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 800;
    }

    .lesson-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #64748b;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .connection.connected .connection-dot {
      background: #16a34a;
    }

    .room-main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 12px;
      padding: 12px;
    }

    .video-area {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 画面共有エリア */
    .share-stage {
      display: none;
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #111827;
      border: 1px solid #263449;
      border-radius: 13px;
    }

    .room-main.has-share .share-stage {
      display: flex;
    }

    .share-stage video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111827;
    }

    .share-label {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 3;
      padding: 6px 10px;
      border-radius: 6px;
      color: #fff;
      background: rgba(15, 23, 42, .75);
      font-size: 12px;
      pointer-events: none;
    }

    #boardCanvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      touch-action: none;
      pointer-events: none;
    }

    .room-main.drawing #boardCanvas {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* カメラ：横長21:9 */
    .camera-strip {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: center;
    }

    .camera-tile {
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 9;
      min-width: 0;
      overflow: hidden;
      background: #18263b;
      border: 1px solid #263449;
      border-radius: 13px;
    }

    .camera-tile video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #18263b;
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 9px;
      color: #d8e2f0;
      background: linear-gradient(145deg, #263b58, #17263b);
      font-size: 13px;
      pointer-events: none;
    }

    .camera-placeholder .avatar {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #42638d;
      font-size: 23px;
      font-weight: 700;
    }

    .camera-name {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 2;
      padding: 5px 9px;
      border-radius: 6px;
      color: #fff;
      background: rgba(15, 23, 42, .72);
      font-size: 12px;
    }

    .camera-status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      padding: 4px 7px;
      border-radius: 5px;
      color: #fff;
      background: rgba(15, 23, 42, .65);
      font-size: 10px;
    }

    /* 画面共有中はカメラを下部に配置 */
    .room-main.has-share .camera-strip {
      flex: 0 0 145px;
      min-height: 145px;
      max-height: 145px;
      align-items: stretch;
    }

    .room-main.has-share .camera-tile {
      height: 100%;
      aspect-ratio: auto;
    }

    /* チャット */
    .side-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .side-heading {
      height: 54px;
      flex: 0 0 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 700;
    }

    .chat-count {
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 15px;
    }

    .chat-empty {
      margin: auto;
      color: #94a3b8;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    .message {
      max-width: 92%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-self: flex-start;
    }

    .message.mine {
      align-self: flex-end;
    }

    .message-meta {
      display: flex;
      gap: 7px;
      align-items: center;
      color: #8491a3;
      font-size: 10px;
    }

    .message.mine .message-meta {
      justify-content: flex-end;
    }

    .message-bubble {
      padding: 10px 12px;
      border-radius: 10px;
      background: #f0f4f9;
      color: #25364c;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.mine .message-bubble {
      color: #fff;
      background: var(--blue);
    }

    .chat-input-area {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .chat-input-area input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-size: 13px;
    }

    .chat-input-area input:focus {
      border-color: var(--blue);
    }

    .send-button {
      width: 52px;
      height: 40px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }

    .send-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* 操作バー：文字のみ */
    .toolbar {
      height: 76px;
      flex: 0 0 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 14px;
      background: #fff;
      border-top: 1px solid var(--border);
    }

    .tool-button {
      min-width: 88px;
      height: 48px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #34445b;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
    }

    .tool-button:hover {
      background: #f3f6fb;
    }

    .tool-button.active {
      color: var(--blue);
      border-color: #a9c4ff;
      background: #eff5ff;
    }

    .tool-button.danger {
      color: #dc2626;
      border-color: #fecaca;
    }

    .tool-button.danger:hover {
      background: #fff1f2;
    }

    .tool-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .footer {
      height: 24px;
      flex: 0 0 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #8793a4;
      background: #fff;
      font-size: 10px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 95px;
      z-index: 20;
      transform: translateX(-50%);
      max-width: calc(100vw - 30px);
      padding: 10px 16px;
      border-radius: 8px;
      color: #fff;
      background: #26364b;
      box-shadow: 0 5px 20px #0002;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .toast.show {
      opacity: 1;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      color: #52637a;
      font-size: 14px;
    }

    .loading-screen.hidden {
      display: none;
    }

    .error-screen {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f4f7fb;
    }

    .error-card {
      width: min(440px, 100%);
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      text-align: center;
    }

    .error-card h2 {
      margin: 0 0 10px;
      font-size: 19px;
    }

    .error-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .error-card button {
      margin-top: 12px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--blue);
    }

    @media (max-width: 1000px) {
      .room-main {
        grid-template-columns: minmax(0, 1fr) 290px;
        gap: 8px;
        padding: 8px;
      }

      .camera-strip {
        gap: 8px;
      }

      .tool-button {
        min-width: 72px;
        padding: 0 7px;
      }

      .toolbar {
        gap: 6px;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 0 10px;
      }

      .brand {
        font-size: 14px;
      }

      .lesson-title {
        display: none;
      }

      .room-main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) 190px;
        gap: 7px;
      }

      .side-panel {
        grid-row: 2;
      }

      .video-area {
        grid-row: 1;
      }

      .camera-strip {
        gap: 6px;
      }

      .camera-tile {
        aspect-ratio: 16 / 9;
      }

      .camera-placeholder .avatar {
        width: 38px;
        height: 38px;
        font-size: 17px;
      }

      .camera-placeholder {
        font-size: 10px;
      }

      .room-main.has-share .camera-strip {
        flex-basis: 90px;
        min-height: 90px;
        max-height: 90px;
      }

      .toolbar {
        height: 66px;
        flex-basis: 66px;
        gap: 4px;
        padding: 5px;
      }

      .tool-button {
        min-width: 0;
        flex: 1;
        height: 46px;
        padding: 0 3px;
        font-size: 9px;
      }

      .footer {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <div class="loading-screen" id="loadingScreen">
    授業室に接続しています...
  </div>

  <div class="error-screen" id="errorScreen">
    <div class="error-card">
      <h2>授業室に入室できません</h2>
      <p id="errorMessage">エラーが発生しました。</p>
      <button id="errorBackButton" type="button">ダッシュボードへ戻る</button>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">W</div>
      <span>WEB Course-plus</span>
      <span class="lesson-title" id="lessonTitle">オンライン授業</span>
    </div>

    <div class="connection" id="connectionStatus">
      <span class="connection-dot"></span>
      <span id="connectionText">接続準備中</span>
    </div>
  </header>

  <main class="room-main" id="roomMain">
    <section class="video-area">

      <div class="share-stage" id="shareStage">
        <video id="shareVideo" autoplay playsinline></video>
        <div class="share-label">画面共有</div>
        <canvas id="boardCanvas"></canvas>
      </div>

      <div class="camera-strip">

        <div class="camera-tile" id="localCameraTile">
          <video id="localVideo" autoplay playsinline muted></video>

          <div class="camera-placeholder" id="localPlaceholder">
            <div class="avatar" id="localAvatar">自</div>
            <span id="localPlaceholderText">カメラ OFF</span>
          </div>

          <div class="camera-name" id="localName">自分</div>
          <div class="camera-status" id="localCameraStatus">カメラ OFF</div>
        </div>

        <div class="camera-tile" id="remoteCameraTile">
          <video id="remoteVideo" autoplay playsinline></video>

          <div class="camera-placeholder" id="remotePlaceholder">
            <div class="avatar" id="remoteAvatar">相</div>
            <span id="remotePlaceholderText">相手の入室を待っています</span>
          </div>

          <div class="camera-name" id="remoteName">相手</div>
          <div class="camera-status" id="remoteCameraStatus">未接続</div>
        </div>

      </div>
    </section>

    <aside class="side-panel">
      <div class="side-heading">
        <span>チャット</span>
        <span class="chat-count" id="chatCount">0件</span>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty" id="chatEmpty">
          授業中のメッセージを<br>ここでやり取りできます。
        </div>
      </div>

      <form class="chat-input-area" id="chatForm">
        <input
          type="text"
          id="chatInput"
          maxlength="1000"
          placeholder="メッセージを入力..."
          autocomplete="off"
        >
        <button class="send-button" id="sendButton" type="submit">送信</button>
      </form>
    </aside>
  </main>

  <nav class="toolbar">
    <button class="tool-button" id="micButton" type="button">マイク OFF</button>
    <button class="tool-button" id="cameraButton" type="button">カメラ OFF</button>
    <button class="tool-button" id="shareButton" type="button">画面共有</button>
    <button class="tool-button" id="drawButton" type="button" disabled>書き込み</button>
    <button class="tool-button" id="eraseButton" type="button" disabled>消しゴム</button>
    <button class="tool-button" id="clearButton" type="button" disabled>全消去</button>
    <button class="tool-button danger" id="leaveButton" type="button">退出</button>
  </nav>

  <footer class="footer">
    © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
  </footer>

  <div class="toast" id="toast"></div>

  <script type="module">
    import {
      auth,
      db,
      authPersistenceReady
    } from "../assets/js/firebase.js";

    import {
      doc,
      getDoc,
      collection,
      addDoc,
      getDocs,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import {
      Room,
      RoomEvent,
      Track
    } from "https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/+esm";

    const $ = (id) => document.getElementById(id);

    const params = new URLSearchParams(location.search);
    const lessonId = params.get("lessonId") || params.get("id");

    let currentUser = null;
    let userProfile = null;
    let lessonData = null;
    let liveRoom = null;

    let micEnabled = false;
    let cameraEnabled = false;
    let screenEnabled = false;
    let drawingEnabled = false;
    let drawingMode = "pen";

    let remoteCameraTrack = null;
    let localCameraTrack = null;
    let localScreenTrack = null;
    let remoteScreenTrack = null;

    let unsubscribeBoard = null;
    let unsubscribeChat = null;

    let boardStrokes = new Map();
    let activeStroke = null;
    let boardContext = null;
    let boardWidth = 0;
    let boardHeight = 0;
    let resizeObserver = null;

    let toastTimer = null;
    let leaving = false;

    const roomMain = $("roomMain");
    const boardCanvas = $("boardCanvas");
    const chatMessages = $("chatMessages");

    function showToast(message) {
      const element = $("toast");
      element.textContent = message;
      element.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        element.classList.remove("show");
      }, 2600);
    }

    function setConnection(connected, message) {
      $("connectionStatus").classList.toggle("connected", connected);
      $("connectionText").textContent = message;
    }

    function showError(message) {
      $("loadingScreen").classList.add("hidden");
      $("errorMessage").textContent = message;
      $("errorScreen").style.display = "flex";
    }

    function dashboardUrl() {
      const role = userProfile?.role;

      if (role === "teacher") {
        return "https://web-course-plus.onrender.com/teacher/dashboard.html";
      }

      if (role === "admin") {
        return "https://web-course-plus.onrender.com/admin/dashboard.html";
      }

      return "https://web-course-plus.onrender.com/student/dashboard.html";
    }

    function goDashboard() {
      location.href = dashboardUrl();
    }

    $("errorBackButton").addEventListener("click", goDashboard);

    function setVideoPlaceholder(type, visible, message) {
      const placeholder = $(type + "Placeholder");
      if (!placeholder) return;

      placeholder.style.display = visible ? "flex" : "none";

      const text = $(type + "PlaceholderText");
      if (text && message) {
        text.textContent = message;
      }
    }

    function setLocalCameraVisible(enabled) {
      $("localVideo").style.display = enabled ? "block" : "none";
      setVideoPlaceholder("local", !enabled, "カメラ OFF");

      $("localCameraStatus").textContent =
        enabled ? "カメラ ON" : "カメラ OFF";
    }

    function setRemoteCameraVisible(enabled) {
      $("remoteVideo").style.display = enabled ? "block" : "none";

      setVideoPlaceholder(
        "remote",
        !enabled,
        liveRoom?.remoteParticipants?.size
          ? "カメラ OFF"
          : "相手の入室を待っています"
      );

      $("remoteCameraStatus").textContent =
        enabled ? "カメラ ON" : "カメラ OFF";
    }

    function attachCamera(track, videoElement, isLocal) {
      if (!track) return;

      try {
        track.attach(videoElement);
        videoElement.style.display = "block";

        if (isLocal) {
          localCameraTrack = track;
          setLocalCameraVisible(true);
        } else {
          remoteCameraTrack = track;
          setRemoteCameraVisible(true);
        }
      } catch (error) {
        console.error("カメラ映像の表示に失敗:", error);
      }
    }

    function detachCamera(track, videoElement, isLocal) {
      if (track) {
        try {
          track.detach(videoElement);
        } catch (error) {
          console.warn(error);
        }
      }

      videoElement.srcObject = null;

      if (isLocal) {
        localCameraTrack = null;
        setLocalCameraVisible(false);
      } else {
        remoteCameraTrack = null;
        setRemoteCameraVisible(false);
      }
    }

    function updateShareLayout() {
      const hasShare = Boolean(localScreenTrack || remoteScreenTrack);

      roomMain.classList.toggle("has-share", hasShare);

      $("drawButton").disabled = !hasShare;
      $("eraseButton").disabled = !hasShare;
      $("clearButton").disabled = !hasShare;

      if (!hasShare) {
        drawingEnabled = false;
        drawingMode = "pen";

        roomMain.classList.remove("drawing");
        $("drawButton").classList.remove("active");
        $("eraseButton").classList.remove("active");
        $("drawButton").textContent = "書き込み";
        clearCanvas();
      }

      resizeCanvas();
    }

    function attachScreenTrack(track) {
      if (!track) return;

      try {
        track.attach($("shareVideo"));
        $("shareVideo").style.display = "block";
        updateShareLayout();
      } catch (error) {
        console.error("画面共有の表示に失敗:", error);
      }
    }

    function detachScreenTrack(track) {
      if (track) {
        try {
          track.detach($("shareVideo"));
        } catch (error) {
          console.warn(error);
        }
      }

      $("shareVideo").srcObject = null;
      updateShareLayout();
    }

    function resizeCanvas() {
      const stage = $("shareStage");
      if (!stage || !boardCanvas) return;

      const rect = stage.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const ratio = window.devicePixelRatio || 1;

      boardWidth = rect.width;
      boardHeight = rect.height;

      boardCanvas.width = Math.round(rect.width * ratio);
      boardCanvas.height = Math.round(rect.height * ratio);

      boardContext = boardCanvas.getContext("2d");
      boardContext.setTransform(ratio, 0, 0, ratio, 0, 0);

      renderBoard();
    }

    function clearCanvas() {
      if (!boardContext) return;

      boardContext.clearRect(0, 0, boardWidth, boardHeight);
    }

    function drawStroke(ctx, stroke) {
      if (!stroke || !Array.isArray(stroke.points) || !stroke.points.length) {
        return;
      }

      const points = stroke.points;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = stroke.width || 3;

      if (stroke.mode === "eraser") {
        ctx.globalCompositeOperation = "destination-out";
        ctx.strokeStyle = "rgba(0,0,0,1)";
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = stroke.color || "#2563eb";
      }

      ctx.beginPath();
      ctx.moveTo(
        points[0].x * boardWidth,
        points[0].y * boardHeight
      );

      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(
          points[i].x * boardWidth,
          points[i].y * boardHeight
        );
      }

      if (points.length === 1) {
        ctx.lineTo(
          points[0].x * boardWidth + 0.1,
          points[0].y * boardHeight + 0.1
        );
      }

      ctx.stroke();
      ctx.restore();
    }

    function renderBoard() {
      if (!boardContext) return;

      clearCanvas();

      const strokes = [...boardStrokes.values()].sort((a, b) => {
        const at = a.createdAt?.seconds || 0;
        const bt = b.createdAt?.seconds || 0;
        return at - bt;
      });

      for (const stroke of strokes) {
        drawStroke(boardContext, stroke);
      }

      if (activeStroke) {
        drawStroke(boardContext, activeStroke);
      }
    }

    function getCanvasPoint(event) {
      const rect = boardCanvas.getBoundingClientRect();

      return {
        x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
        y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
      };
    }

    function startDrawing(event) {
      if (!drawingEnabled || !roomMain.classList.contains("has-share")) return;
      if (event.button !== undefined && event.button !== 0) return;

      event.preventDefault();

      boardCanvas.setPointerCapture(event.pointerId);

      activeStroke = {
        userId: currentUser.uid,
        mode: drawingMode,
        color: "#2563eb",
        width: drawingMode === "eraser" ? 22 : 3,
        points: [getCanvasPoint(event)]
      };

      renderBoard();
    }

    function moveDrawing(event) {
      if (!activeStroke) return;

      event.preventDefault();
      activeStroke.points.push(getCanvasPoint(event));
      renderBoard();
    }

    async function finishDrawing() {
      if (!activeStroke) return;

      const stroke = activeStroke;
      activeStroke = null;
      renderBoard();

      try {
        await addDoc(
          collection(db, "lessonBoards", lessonId, "strokes"),
          {
            userId: stroke.userId,
            mode: stroke.mode,
            color: stroke.color,
            width: stroke.width,
            points: stroke.points,
            createdAt: serverTimestamp()
          }
        );
      } catch (error) {
        console.error(error);
        showToast("書き込みを保存できませんでした。");
      }
    }

    boardCanvas.addEventListener("pointerdown", startDrawing);
    boardCanvas.addEventListener("pointermove", moveDrawing);
    boardCanvas.addEventListener("pointerup", finishDrawing);
    boardCanvas.addEventListener("pointercancel", finishDrawing);

    function listenBoard() {
      const strokesRef = collection(
        db,
        "lessonBoards",
        lessonId,
        "strokes"
      );

      unsubscribeBoard = onSnapshot(
        strokesRef,
        (snapshot) => {
          boardStrokes.clear();

          snapshot.forEach((item) => {
            boardStrokes.set(item.id, item.data());
          });

          renderBoard();
        },
        (error) => {
          console.error("ホワイトボード取得エラー:", error);
          showToast("ホワイトボードを読み込めませんでした。");
        }
      );
    }

    async function clearBoard() {
      if (!confirm("ホワイトボードの書き込みをすべて消去しますか？")) {
        return;
      }

      try {
        const strokesRef = collection(
          db,
          "lessonBoards",
          lessonId,
          "strokes"
        );

        const snapshot = await getDocs(strokesRef);
        const items = snapshot.docs;

        for (let i = 0; i < items.length; i += 450) {
          const batch = writeBatch(db);

          items.slice(i, i + 450).forEach((item) => {
            batch.delete(item.ref);
          });

          await batch.commit();
        }

        boardStrokes.clear();
        clearCanvas();

        showToast("書き込みをすべて消去しました。");
      } catch (error) {
        console.error(error);
        showToast("消去に失敗しました。");
      }
    }

    $("drawButton").addEventListener("click", () => {
      if (!roomMain.classList.contains("has-share")) return;

      drawingEnabled = !drawingEnabled;
      drawingMode = "pen";

      roomMain.classList.toggle("drawing", drawingEnabled);
      $("drawButton").classList.toggle("active", drawingEnabled);
      $("eraseButton").classList.remove("active");

      $("drawButton").textContent =
        drawingEnabled ? "書き込み中" : "書き込み";
    });

    $("eraseButton").addEventListener("click", () => {
      if (!roomMain.classList.contains("has-share")) return;

      drawingEnabled = true;
      drawingMode = "eraser";

      roomMain.classList.add("drawing");
      $("drawButton").classList.remove("active");
      $("eraseButton").classList.add("active");
      $("drawButton").textContent = "書き込み";
    });

    $("clearButton").addEventListener("click", clearBoard);

    function listenChat() {
      const messagesRef = collection(
        db,
        "lessonMessages",
        lessonId,
        "messages"
      );

      const messagesQuery = query(
        messagesRef,
        orderBy("createdAt", "asc")
      );

      unsubscribeChat = onSnapshot(
        messagesQuery,
        (snapshot) => {
          chatMessages.innerHTML = "";

          if (snapshot.empty) {
            const empty = document.createElement("div");
            empty.className = "chat-empty";
            empty.textContent =
              "授業中のメッセージをここでやり取りできます。";

            chatMessages.appendChild(empty);
          }

          snapshot.forEach((item) => {
            const data = item.data();
            const mine = data.senderId === currentUser.uid;

            const message = document.createElement("div");
            message.className = "message" + (mine ? " mine" : "");

            const meta = document.createElement("div");
            meta.className = "message-meta";

            const name = document.createElement("span");
            name.textContent = data.senderName || "参加者";

            const time = document.createElement("span");

            if (data.createdAt?.toDate) {
              time.textContent = data.createdAt.toDate().toLocaleTimeString(
                "ja-JP",
                {
                  hour: "2-digit",
                  minute: "2-digit"
                }
              );
            }

            meta.append(name, time);

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.textContent = data.text || "";

            message.append(meta, bubble);
            chatMessages.appendChild(message);
          });

          $("chatCount").textContent = snapshot.size + "件";
          chatMessages.scrollTop = chatMessages.scrollHeight;
        },
        (error) => {
          console.error("チャット取得エラー:", error);
          showToast("チャットを読み込めませんでした。");
        }
      );
    }

    $("chatForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const input = $("chatInput");
      const text = input.value.trim();

      if (!text || !currentUser || !lessonId) return;

      $("sendButton").disabled = true;

      try {
        await addDoc(
          collection(db, "lessonMessages", lessonId, "messages"),
          {
            senderId: currentUser.uid,
            senderName:
              userProfile?.displayName ||
              currentUser.displayName ||
              "参加者",
            text,
            createdAt: serverTimestamp()
          }
        );

        input.value = "";
      } catch (error) {
        console.error(error);
        showToast("メッセージを送信できませんでした。");
      } finally {
        $("sendButton").disabled = false;
        input.focus();
      }
    });

    async function getLessonAndProfile(user) {
      const profileSnapshot = await getDoc(
        doc(db, "users", user.uid)
      );

      if (!profileSnapshot.exists()) {
        throw new Error(
          "ユーザー情報が登録されていません。管理者にお問い合わせください。"
        );
      }

      userProfile = profileSnapshot.data();

      if (!["student", "teacher", "admin"].includes(userProfile.role)) {
        throw new Error("このアカウントには授業室の利用権限がありません。");
      }

      if (!lessonId) {
        throw new Error("授業IDが指定されていません。");
      }

      const lessonSnapshot = await getDoc(
        doc(db, "lessons", lessonId)
      );

      if (!lessonSnapshot.exists()) {
        throw new Error("指定された授業が見つかりません。");
      }

      lessonData = lessonSnapshot.data();

      const isAdmin = userProfile.role === "admin";

      const isTeacher =
        userProfile.role === "teacher" &&
        lessonData.teacherId === user.uid;

      const isStudent =
        userProfile.role === "student" &&
        lessonData.studentId === user.uid;

      if (!isAdmin && !isTeacher && !isStudent) {
        throw new Error("この授業室に入室する権限がありません。");
      }

      $("lessonTitle").textContent =
        lessonData.title || "オンライン授業";

      $("localName").textContent =
        userProfile.displayName ||
        user.displayName ||
        "自分";

      $("localAvatar").textContent =
        (userProfile.displayName || user.displayName || "自").slice(0, 1);

      const otherName = userProfile.role === "teacher"
        ? (lessonData.studentName || "生徒")
        : (lessonData.teacherName || "先生");

      $("remoteName").textContent = otherName;
      $("remoteAvatar").textContent = otherName.slice(0, 1);
    }

    async function connectLiveKit() {
      const idToken = await currentUser.getIdToken();

      const response = await fetch("/api/livekit/token", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + idToken
        },
        body: JSON.stringify({
          lessonId
        })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          "接続トークンを取得できませんでした。"
        );
      }

      const serverUrl = data.url || data.serverUrl;
      const token = data.token;

      if (!serverUrl || !token) {
        throw new Error("LiveKit接続情報が正しくありません。");
      }

      liveRoom = new Room({
        adaptiveStream: true,
        dynacast: true
      });

      liveRoom.on(RoomEvent.Connected, () => {
        setConnection(true, "接続済み");
      });

      liveRoom.on(RoomEvent.Disconnected, () => {
        setConnection(false, "切断されました");
      });

      liveRoom.on(RoomEvent.ParticipantConnected, (participant) => {
        $("remoteName").textContent =
          participant.name || participant.identity || "相手";

        if (!remoteCameraTrack) {
          setRemoteCameraVisible(false);
          $("remotePlaceholderText").textContent = "カメラを待っています";
        }
      });

      liveRoom.on(RoomEvent.ParticipantDisconnected, () => {
        if (remoteCameraTrack) {
          detachCamera(remoteCameraTrack, $("remoteVideo"), false);
        }

        if (remoteScreenTrack) {
          detachScreenTrack(remoteScreenTrack);
          remoteScreenTrack = null;
        }

        $("remoteName").textContent = "相手";
        $("remotePlaceholderText").textContent =
          "相手の入室を待っています";

        setConnection(true, "接続済み");
      });

      liveRoom.on(
        RoomEvent.TrackSubscribed,
        (track, publication, participant) => {
          if (track.kind === Track.Kind.Video) {
            if (publication.source === Track.Source.ScreenShare) {
              remoteScreenTrack = track;
              attachScreenTrack(track);
            } else if (publication.source === Track.Source.Camera) {
              $("remoteName").textContent =
                participant.name || participant.identity || "相手";

              attachCamera(track, $("remoteVideo"), false);
            }
          }
        }
      );

      liveRoom.on(
        RoomEvent.TrackUnsubscribed,
        (track, publication) => {
          if (publication.source === Track.Source.ScreenShare) {
            if (remoteScreenTrack === track) {
              detachScreenTrack(track);
              remoteScreenTrack = null;
            }
          }

          if (publication.source === Track.Source.Camera) {
            if (remoteCameraTrack === track) {
              detachCamera(track, $("remoteVideo"), false);
            }
          }
        }
      );

      liveRoom.on(RoomEvent.LocalTrackPublished, (publication) => {
        const track = publication.track;
        if (!track) return;

        if (publication.source === Track.Source.Camera) {
          attachCamera(track, $("localVideo"), true);
        }

        if (publication.source === Track.Source.ScreenShare) {
          localScreenTrack = track;
          attachScreenTrack(track);
        }
      });

      liveRoom.on(RoomEvent.LocalTrackUnpublished, (publication) => {
        if (publication.source === Track.Source.Camera) {
          if (localCameraTrack) {
            detachCamera(localCameraTrack, $("localVideo"), true);
          }
        }

        if (publication.source === Track.Source.ScreenShare) {
          if (localScreenTrack) {
            detachScreenTrack(localScreenTrack);
            localScreenTrack = null;
          }
        }
      });

      liveRoom.on(RoomEvent.TrackMuted, (publication, participant) => {
        if (participant.identity === liveRoom.localParticipant.identity) {
          return;
        }

        if (publication.source === Track.Source.Camera) {
          setRemoteCameraVisible(false);
        }
      });

      liveRoom.on(RoomEvent.TrackUnmuted, (publication, participant) => {
        if (participant.identity === liveRoom.localParticipant.identity) {
          return;
        }

        if (
          publication.source === Track.Source.Camera &&
          remoteCameraTrack
        ) {
          setRemoteCameraVisible(true);
        }
      });

      await liveRoom.connect(serverUrl, token);

      setConnection(true, "接続済み");

      for (const participant of liveRoom.remoteParticipants.values()) {
        $("remoteName").textContent =
          participant.name || participant.identity || "相手";

        for (const publication of participant.videoTrackPublications.values()) {
          if (!publication.track) continue;

          if (publication.source === Track.Source.Camera) {
            attachCamera(publication.track, $("remoteVideo"), false);
          }

          if (publication.source === Track.Source.ScreenShare) {
            remoteScreenTrack = publication.track;
            attachScreenTrack(publication.track);
          }
        }
      }

      await liveRoom.localParticipant.setMicrophoneEnabled(false);
      await liveRoom.localParticipant.setCameraEnabled(false);
    }

    async function toggleMic() {
      if (!liveRoom) return;

      try {
        const next = !micEnabled;

        await liveRoom.localParticipant.setMicrophoneEnabled(next);
        micEnabled = next;

        $("micButton").classList.toggle("active", micEnabled);
        $("micButton").textContent =
          micEnabled ? "マイク ON" : "マイク OFF";

        showToast(
          micEnabled ? "マイクを ON にしました。" : "マイクを OFF にしました。"
        );
      } catch (error) {
        console.error(error);
        showToast("マイクを切り替えられませんでした。");
      }
    }

    async function toggleCamera() {
      if (!liveRoom) return;

      try {
        const next = !cameraEnabled;

        await liveRoom.localParticipant.setCameraEnabled(next);
        cameraEnabled = next;

        $("cameraButton").classList.toggle("active", cameraEnabled);
        $("cameraButton").textContent =
          cameraEnabled ? "カメラ ON" : "カメラ OFF";

        if (!cameraEnabled && localCameraTrack) {
          detachCamera(localCameraTrack, $("localVideo"), true);
        }

        showToast(
          cameraEnabled ? "カメラを ON にしました。" : "カメラを OFF にしました。"
        );
      } catch (error) {
        console.error(error);
        showToast("カメラを切り替えられませんでした。");
      }
    }

    async function toggleScreenShare() {
      if (!liveRoom) return;

      try {
        if (!screenEnabled) {
          await liveRoom.localParticipant.setScreenShareEnabled(true);

          screenEnabled = true;
          $("shareButton").classList.add("active");
          $("shareButton").textContent = "共有を停止";

          showToast("画面共有を開始しました。");
        } else {
          await liveRoom.localParticipant.setScreenShareEnabled(false);

          screenEnabled = false;
          $("shareButton").classList.remove("active");
          $("shareButton").textContent = "画面共有";

          if (localScreenTrack) {
            detachScreenTrack(localScreenTrack);
            localScreenTrack = null;
          }

          showToast("画面共有を停止しました。");
        }

        updateShareLayout();
      } catch (error) {
        console.error(error);

        screenEnabled = Boolean(localScreenTrack);

        $("shareButton").classList.toggle("active", screenEnabled);
        $("shareButton").textContent =
          screenEnabled ? "共有を停止" : "画面共有";

        showToast("画面共有を開始できませんでした。");
      }
    }

    async function leaveRoom() {
      if (leaving) return;

      leaving = true;
      $("leaveButton").disabled = true;
      $("leaveButton").textContent = "退出中";

      try {
        if (liveRoom) {
          await liveRoom.disconnect();
        }
      } catch (error) {
        console.warn("切断処理:", error);
      }

      if (unsubscribeBoard) unsubscribeBoard();
      if (unsubscribeChat) unsubscribeChat();
      if (resizeObserver) resizeObserver.disconnect();

      goDashboard();
    }

    $("micButton").addEventListener("click", toggleMic);
    $("cameraButton").addEventListener("click", toggleCamera);
    $("shareButton").addEventListener("click", toggleScreenShare);
    $("leaveButton").addEventListener("click", leaveRoom);

    async function start() {
      try {
        if (!authPersistenceReady) {
          throw new Error("Firebase認証の初期化が完了していません。");
        }

        await authPersistenceReady;

        const user = await new Promise((resolve, reject) => {
          let unsubscribe = null;

          unsubscribe = onAuthStateChanged(
            auth,
            (current) => {
              if (unsubscribe) unsubscribe();
              resolve(current);
            },
            reject
          );
        });

        if (!user) {
          location.href = "../login.html";
          return;
        }

        currentUser = user;

        await getLessonAndProfile(user);

        listenBoard();
        listenChat();

        resizeObserver = new ResizeObserver(resizeCanvas);
        resizeObserver.observe($("shareStage"));

        await connectLiveKit();

        $("loadingScreen").classList.add("hidden");
        setConnection(true, "接続済み");

      } catch (error) {
        console.error("授業室初期化エラー:", error);

        showError(
          error?.message ||
          "授業室の初期化に失敗しました。時間をおいて再度お試しください。"
        );
      }
    }

    window.addEventListener("beforeunload", () => {
      if (unsubscribeBoard) unsubscribeBoard();
      if (unsubscribeChat) unsubscribeChat();
      if (resizeObserver) resizeObserver.disconnect();

      if (liveRoom) {
        liveRoom.disconnect();
      }
    });

    start();
  </script>
</body>
