
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>授業ルーム | WEB Course-plus</title>

  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --bg: #f3f5f9;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #172033;
      --muted: #64748b;
      --green: #16a34a;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */

    .header {
      height: 58px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--blue);
      font-size: 17px;
      font-weight: 800;
    }

    .brand-name {
      font-weight: 750;
      font-size: 16px;
      white-space: nowrap;
    }

    .lesson-info {
      min-width: 0;
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .lesson-title {
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lesson-subtitle {
      color: var(--muted);
      font-size: 11px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .connection.connected {
      color: var(--green);
    }

    .connection.connected .connection-dot {
      background: var(--green);
    }

    /* メインレイアウト */

    .room-main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }

    .classroom {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    /* 大型ビデオ画面 */

    .share-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      border-radius: 12px;
      border: 1px solid #263244;
    }

    #shareVideo {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111827;
    }

    .share-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #e2e8f0;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }

    .placeholder-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: #263449;
      font-size: 28px;
    }

    .placeholder-title {
      font-size: 17px;
      font-weight: 700;
    }

    .placeholder-description {
      font-size: 12px;
      color: #aab6c7;
    }

    /* 書き込みキャンバス */

    #annotationCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      touch-action: none;
      z-index: 3;
    }

    #annotationCanvas.drawing {
      pointer-events: auto;
      cursor: crosshair;
    }

    .share-label {
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 4;
      color: #fff;
      background: rgba(15, 23, 42, .75);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      pointer-events: none;
    }

    /* カメラ映像 */

    .camera-strip {
      height: 112px;
      min-height: 112px;
      display: flex;
      gap: 10px;
      overflow: hidden;
    }

    .camera-tile {
      position: relative;
      width: 160px;
      min-width: 160px;
      height: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #334155;
    }

    .camera-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-name {
      position: absolute;
      left: 8px;
      bottom: 7px;
      color: #fff;
      font-size: 11px;
      background: rgba(15, 23, 42, .75);
      padding: 4px 7px;
      border-radius: 5px;
      z-index: 2;
    }

    .camera-off {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #cbd5e1;
      font-size: 12px;
    }

    /* 右サイドパネル */

    .side-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .side-tabs {
      height: 48px;
      min-height: 48px;
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .side-tab {
      flex: 1;
      border: 0;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      border-bottom: 2px solid transparent;
    }

    .side-tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .side-content {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .side-content.active {
      display: flex;
    }

    .panel-heading {
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
    }

    /* 参加者 */

    .participant-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .participant {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 8px;
      border-bottom: 1px solid #f1f5f9;
    }

    .participant-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 750;
      flex-shrink: 0;
    }

    .participant-info {
      flex: 1;
      min-width: 0;
    }

    .participant-name {
      font-size: 12px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .participant-status {
      color: var(--green);
      font-size: 10px;
      margin-top: 3px;
    }

    /* チャット */

    .chat-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 95%;
      align-self: flex-start;
    }

    .chat-message.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .chat-sender {
      font-size: 10px;
      color: var(--muted);
    }

    .chat-bubble {
      padding: 9px 11px;
      border-radius: 10px;
      background: #f1f5f9;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .chat-message.mine .chat-bubble {
      color: #fff;
      background: var(--blue);
    }

    .chat-time {
      font-size: 9px;
      color: #94a3b8;
    }

    .chat-form {
      display: flex;
      gap: 7px;
      padding: 10px;
      border-top: 1px solid var(--border);
    }

    .chat-input {
      min-width: 0;
      flex: 1;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      font-size: 12px;
    }

    .chat-input:focus {
      border-color: var(--blue);
    }

    .send-button {
      width: 42px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--blue);
      font-weight: 700;
    }

    /* 下部操作バー */

    .control-bar {
      height: 68px;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
      background: #fff;
      border-top: 1px solid var(--border);
    }

    .control-button {
      height: 42px;
      min-width: 82px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 650;
    }

    .control-button:hover {
      background: #f8fafc;
    }

    .control-button.active {
      color: var(--blue);
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .control-button.danger {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
    }

    .control-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* ペンツール */

    .drawing-tools {
      position: absolute;
      z-index: 5;
      top: 12px;
      right: 12px;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 3px 15px rgba(0,0,0,.18);
    }

    .drawing-tools.visible {
      display: flex;
    }

    .tool-button {
      height: 32px;
      min-width: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font-size: 11px;
    }

    .tool-button.active {
      color: var(--blue);
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .tool-color {
      width: 25px;
      height: 25px;
      border: 2px solid #fff;
      outline: 1px solid #cbd5e1;
      border-radius: 50%;
      padding: 0;
    }

    .tool-color.selected {
      outline: 2px solid var(--blue);
    }

    /* エラー画面 */

    .error-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f3f5f9;
    }

    .error-card {
      width: min(460px, 100%);
      padding: 28px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(15,23,42,.07);
    }

    .error-card h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    .error-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .back-button {
      margin-top: 12px;
      height: 40px;
      padding: 0 18px;
      border: 0;
      border-radius: 7px;
      background: var(--blue);
      color: #fff;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      z-index: 200;
      padding: 10px 16px;
      color: #fff;
      background: #1e293b;
      border-radius: 8px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .toast.show {
      opacity: 1;
    }

    .footer {
      height: 20px;
      min-height: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      color: #94a3b8;
      font-size: 9px;
      border-top: 1px solid #f1f5f9;
    }

    /* タブレット・スマートフォン */

    @media (max-width: 900px) {
      .room-main {
        grid-template-columns: minmax(0, 1fr) 260px;
      }

      .control-button {
        min-width: 65px;
        padding: 0 8px;
      }
    }

    @media (max-width: 650px) {
      .header {
        height: 50px;
        min-height: 50px;
        padding: 0 10px;
      }

      .brand-name {
        font-size: 13px;
      }

      .lesson-info {
        margin-left: 8px;
      }

      .lesson-subtitle {
        display: none;
      }

      .room-main {
        display: flex;
        flex-direction: column;
        padding: 6px;
        gap: 6px;
      }

      .classroom {
        flex: 1;
      }

      .share-stage {
        min-height: 0;
      }

      .camera-strip {
        height: 75px;
        min-height: 75px;
      }

      .camera-tile {
        width: 110px;
        min-width: 110px;
      }

      .side-panel {
        height: 180px;
        min-height: 180px;
      }

      .side-panel.mobile-hidden {
        display: none;
      }

      .control-bar {
        height: 58px;
        min-height: 58px;
        gap: 5px;
        padding: 0 4px;
      }

      .control-button {
        min-width: 0;
        flex: 1;
        height: 40px;
        padding: 0 4px;
        font-size: 9px;
      }

      .footer {
        display: none;
      }

      .drawing-tools {
        top: 6px;
        right: 6px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-mark">W</div>
      <div class="brand-name">WEB Course-plus</div>
      <div class="lesson-info">
        <div class="lesson-title" id="lessonTitle">授業ルーム</div>
        <div class="lesson-subtitle" id="lessonSubject">授業情報を読み込み中</div>
      </div>
    </div>

    <div class="header-right">
      <div class="connection" id="connectionStatus">
        <span class="connection-dot"></span>
        <span id="connectionText">接続準備中</span>
      </div>
    </div>
  </header>

  <main class="room-main">

    <section class="classroom">

      <div class="share-stage" id="shareStage">

        <video id="shareVideo" autoplay playsinline></video>

        <div class="share-placeholder" id="sharePlaceholder">
          <div class="placeholder-icon">▣</div>
          <div class="placeholder-title">画面共有を待っています</div>
          <div class="placeholder-description">
            先生が画面共有を開始すると、ここに大きく表示されます。
          </div>
        </div>

        <canvas id="annotationCanvas"></canvas>

        <div class="share-label" id="shareLabel">
          授業画面
        </div>

        <div class="drawing-tools" id="drawingTools">
          <button class="tool-button active" id="penTool">ペン</button>
          <button class="tool-button" id="eraserTool">消しゴム</button>
          <button class="tool-button" id="clearTool">全消去</button>

          <button class="tool-color selected"
            data-color="#ef4444"
            style="background:#ef4444"
            aria-label="赤"></button>

          <button class="tool-color"
            data-color="#2563eb"
            style="background:#2563eb"
            aria-label="青"></button>

          <button class="tool-color"
            data-color="#16a34a"
            style="background:#16a34a"
            aria-label="緑"></button>

          <button class="tool-color"
            data-color="#facc15"
            style="background:#facc15"
            aria-label="黄"></button>
        </div>

      </div>

      <div class="camera-strip">

        <div class="camera-tile">
          <div class="camera-off" id="localCameraOff">カメラ未接続</div>
          <video id="localCamera" autoplay playsinline muted></video>
          <div class="camera-name" id="localName">あなた</div>
        </div>

        <div class="camera-tile">
          <div class="camera-off" id="remoteCameraOff">相手のカメラを待っています</div>
          <video id="remoteCamera" autoplay playsinline></video>
          <div class="camera-name" id="remoteName">相手</div>
        </div>

      </div>
    </section>

    <aside class="side-panel" id="sidePanel">

      <div class="side-tabs">
        <button class="side-tab active" data-tab="participants">参加者</button>
        <button class="side-tab" data-tab="chat">チャット</button>
      </div>

      <section class="side-content active" id="participantsPanel">
        <div class="panel-heading">授業参加者</div>
        <div class="participant-list" id="participantList">
          <div class="participant">
            <div class="participant-avatar">?</div>
            <div class="participant-info">
              <div class="participant-name">接続を待っています</div>
              <div class="participant-status">未接続</div>
            </div>
          </div>
        </div>
      </section>

      <section class="side-content" id="chatPanel">
        <div class="panel-heading">授業チャット</div>
        <div class="chat-list" id="chatList"></div>

        <form class="chat-form" id="chatForm">
          <input
            class="chat-input"
            id="chatInput"
            type="text"
            maxlength="500"
            placeholder="メッセージを入力..."
            autocomplete="off"
          >
          <button class="send-button" type="submit">送信</button>
        </form>
      </section>

    </aside>
  </main>

  <footer class="control-bar">

    <button class="control-button" id="micButton" disabled>
      マイク ON
    </button>

    <button class="control-button" id="cameraButton" disabled>
      カメラ ON
    </button>

    <button class="control-button" id="shareButton" disabled>
      画面共有
    </button>

    <button class="control-button" id="drawButton" disabled>
      ペン書き
    </button>

    <button class="control-button" id="chatButton">
      チャット
    </button>

    <button class="control-button danger" id="leaveButton">
      退出
    </button>

  </footer>

  <div class="footer">
    © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
  </div>

</div>

<div class="error-screen" id="errorScreen">
  <div class="error-card">
    <h2>授業に入室できません</h2>
    <p id="errorMessage">エラーが発生しました。</p>
    <button class="back-button" onclick="location.href='../login.html'">
      ログイン画面へ戻る
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { auth, db, authPersistenceReady }
    from "../assets/js/firebase.js";

  import {
    doc,
    getDoc,
    collection,
    addDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    getDocs,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  import {
    Room,
    RoomEvent,
    Track
  } from "https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/+esm";

  const $ = id => document.getElementById(id);

  const params = new URLSearchParams(location.search);
  const lessonId = params.get("lessonId") || params.get("id");

  let currentUser = null;
  let userProfile = null;
  let lessonData = null;
  let liveRoom = null;

  let isConnected = false;
  let micEnabled = false;
  let cameraEnabled = false;
  let screenEnabled = false;
  let drawingEnabled = false;
  let drawingMode = "pen";
  let drawingColor = "#ef4444";

  let unsubscribeBoard = null;
  let unsubscribeChat = null;
  let unsubscribeMessages = null;

  let activeStroke = null;
  let activeStrokeId = null;
  let strokeWriteQueue = Promise.resolve();

  const canvas = $("annotationCanvas");
  const ctx = canvas.getContext("2d");

  const strokes = new Map();

  function toast(message) {
    const element = $("toast");
    element.textContent = message;
    element.classList.add("show");

    setTimeout(() => {
      element.classList.remove("show");
    }, 2200);
  }

  function showError(error) {
    console.error(error);

    $("errorMessage").textContent =
      error?.message || "予期しないエラーが発生しました。";

    $("errorScreen").style.display = "flex";
    $("connectionText").textContent = "接続エラー";
  }

  function setConnection(connected) {
    isConnected = connected;

    $("connectionStatus").classList.toggle(
      "connected",
      connected
    );

    $("connectionText").textContent =
      connected ? "入室済み" : "接続中";

    [
      "micButton",
      "cameraButton",
      "shareButton",
      "drawButton"
    ].forEach(id => {
      $(id).disabled = !connected;
    });
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;

    canvas.width = Math.max(1, Math.round(rect.width * ratio));
    canvas.height = Math.max(1, Math.round(rect.height * ratio));

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    renderBoard();
  }

  function drawStroke(stroke) {
    if (!stroke || !Array.isArray(stroke.points)) return;
    if (stroke.points.length < 1) return;

    const rect = canvas.getBoundingClientRect();

    ctx.save();
    ctx.globalCompositeOperation =
      stroke.mode === "erase" ? "destination-out" : "source-over";

    ctx.strokeStyle = stroke.color || "#ef4444";
    ctx.fillStyle = stroke.color || "#ef4444";
    ctx.lineWidth = Number(stroke.width) || 3;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const points = stroke.points.map(point => ({
      x: point.x * rect.width,
      y: point.y * rect.height
    }));

    if (points.length === 1) {
      ctx.beginPath();
      ctx.arc(
        points[0].x,
        points[0].y,
        Math.max(1, (Number(stroke.width) || 3) / 2),
        0,
        Math.PI * 2
      );
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);

      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }

      ctx.stroke();
    }

    ctx.restore();
  }

  function renderBoard() {
    const rect = canvas.getBoundingClientRect();

    ctx.clearRect(0, 0, rect.width, rect.height);

    for (const stroke of strokes.values()) {
      drawStroke(stroke);
    }
  }

  function getCanvasPoint(event) {
    const rect = canvas.getBoundingClientRect();

    return {
      x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
      y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
    };
  }

  function subscribeBoard() {
    if (unsubscribeBoard) unsubscribeBoard();

    const boardQuery = query(
      collection(db, "lessonBoards", lessonId, "strokes"),
      orderBy("createdAt", "asc")
    );

    unsubscribeBoard = onSnapshot(
      boardQuery,
      snapshot => {
        strokes.clear();

        snapshot.forEach(item => {
          strokes.set(item.id, item.data());
        });

        renderBoard();
      },
      error => {
        console.error("ホワイトボード取得エラー:", error);
        toast("ホワイトボードの同期に失敗しました。");
      }
    );
  }

  function saveStroke() {
    if (!activeStrokeId || !activeStroke) return;

    const strokeRef = doc(
      db,
      "lessonBoards",
      lessonId,
      "strokes",
      activeStrokeId
    );

    const strokeData = {
      ...activeStroke,
      updatedAt: serverTimestamp()
    };

    strokeWriteQueue = strokeWriteQueue
      .then(() => setDoc(strokeRef, strokeData, { merge: true }))
      .catch(error => {
        console.error("書き込みエラー:", error);
      });
  }

  canvas.addEventListener("pointerdown", async event => {
    if (!drawingEnabled || !isConnected) return;

    event.preventDefault();

    const point = getCanvasPoint(event);

    activeStrokeId = crypto.randomUUID();

    activeStroke = {
      createdBy: currentUser.uid,
      color: drawingColor,
      width: drawingMode === "erase" ? 20 : 3,
      mode: drawingMode,
      points: [point],
      createdAt: serverTimestamp()
    };

    strokes.set(activeStrokeId, activeStroke);
    renderBoard();

    try {
      await setDoc(
        doc(db, "lessonBoards", lessonId, "strokes", activeStrokeId),
        activeStroke
      );

      canvas.setPointerCapture(event.pointerId);
    } catch (error) {
      console.error(error);
      activeStroke = null;
      activeStrokeId = null;
      toast("書き込み権限を確認してください。");
    }
  });

  canvas.addEventListener("pointermove", event => {
    if (!drawingEnabled || !activeStroke || !activeStrokeId) return;

    if (!(event.buttons & 1)) return;

    const point = getCanvasPoint(event);
    activeStroke.points.push(point);

    strokes.set(activeStrokeId, {
      ...activeStroke,
      points: [...activeStroke.points]
    });

    renderBoard();
    saveStroke();
  });

  function finishStroke() {
    if (!activeStrokeId || !activeStroke) return;

    saveStroke();

    activeStroke = null;
    activeStrokeId = null;
  }

  canvas.addEventListener("pointerup", finishStroke);
  canvas.addEventListener("pointercancel", finishStroke);
  canvas.addEventListener("lostpointercapture", finishStroke);

  async function clearBoard() {
    if (!confirm("ホワイトボードをすべて消去しますか？")) return;

    try {
      const snapshot = await getDocs(
        collection(db, "lessonBoards", lessonId, "strokes")
      );

      await Promise.all(
        snapshot.docs.map(item => deleteDoc(item.ref))
      );

      toast("ホワイトボードを消去しました。");
    } catch (error) {
      console.error(error);
      toast("消去できませんでした。");
    }
  }

  function setDrawing(enabled) {
    drawingEnabled = enabled;

    canvas.classList.toggle("drawing", enabled);
    $("drawingTools").classList.toggle("visible", enabled);
    $("drawButton").classList.toggle("active", enabled);

    $("drawButton").textContent =
      enabled ? "ペン書き ON" : "ペン書き";

    if (!enabled) {
      activeStroke = null;
      activeStrokeId = null;
    }
  }

  $("drawButton").addEventListener("click", () => {
    setDrawing(!drawingEnabled);

    if (drawingEnabled) {
      toast("画面への書き込みが有効になりました。");
    }
  });

  $("penTool").addEventListener("click", () => {
    drawingMode = "pen";
    $("penTool").classList.add("active");
    $("eraserTool").classList.remove("active");
  });

  $("eraserTool").addEventListener("click", () => {
    drawingMode = "erase";
    $("eraserTool").classList.add("active");
    $("penTool").classList.remove("active");
  });

  $("clearTool").addEventListener("click", clearBoard);

  document.querySelectorAll(".tool-color").forEach(button => {
    button.addEventListener("click", () => {
      drawingColor = button.dataset.color;

      document.querySelectorAll(".tool-color").forEach(item => {
        item.classList.remove("selected");
      });

      button.classList.add("selected");
      drawingMode = "pen";
      $("penTool").classList.add("active");
      $("eraserTool").classList.remove("active");
    });
  });

  /* チャット */

  function subscribeChat() {
    if (unsubscribeChat) unsubscribeChat();

    const chatQuery = query(
      collection(db, "lessonMessages", lessonId, "messages"),
      orderBy("createdAt", "asc")
    );

    unsubscribeChat = onSnapshot(
      chatQuery,
      snapshot => {
        const list = $("chatList");
        list.innerHTML = "";

        snapshot.forEach(item => {
          const message = item.data();
          const mine = message.senderId === currentUser.uid;

          const wrapper = document.createElement("div");
          wrapper.className = "chat-message" + (mine ? " mine" : "");

          const sender = document.createElement("div");
          sender.className = "chat-sender";
          sender.textContent = message.senderName || "参加者";

          const bubble = document.createElement("div");
          bubble.className = "chat-bubble";
          bubble.textContent = message.text || "";

          const time = document.createElement("div");
          time.className = "chat-time";

          if (message.createdAt?.toDate) {
            time.textContent = message.createdAt.toDate()
              .toLocaleTimeString("ja-JP", {
                hour: "2-digit",
                minute: "2-digit"
              });
          }

          wrapper.append(sender, bubble, time);
          list.appendChild(wrapper);
        });

        list.scrollTop = list.scrollHeight;
      },
      error => {
        console.error("チャット取得エラー:", error);
        toast("チャットの同期に失敗しました。");
      }
    );
  }

  $("chatForm").addEventListener("submit", async event => {
    event.preventDefault();

    const input = $("chatInput");
    const text = input.value.trim();

    if (!text) return;

    if (!isConnected) {
      toast("授業に接続してから送信してください。");
      return;
    }

    input.disabled = true;

    try {
      await addDoc(
        collection(db, "lessonMessages", lessonId, "messages"),
        {
          senderId: currentUser.uid,
          senderName: userProfile.displayName || currentUser.email || "参加者",
          text,
          createdAt: serverTimestamp()
        }
      );

      input.value = "";
    } catch (error) {
      console.error(error);
      toast("メッセージを送信できませんでした。");
    } finally {
      input.disabled = false;
      input.focus();
    }
  });

  /* 参加者表示 */

  function renderParticipants() {
    const list = $("participantList");
    list.innerHTML = "";

    if (!liveRoom) return;

    const participants = [
      {
        identity: currentUser.uid,
        name: userProfile.displayName || "あなた",
        local: true
      },
      ...Array.from(liveRoom.remoteParticipants.values()).map(participant => ({
        identity: participant.identity,
        name: participant.name || participant.identity,
        local: false
      }))
    ];

    participants.forEach(participant => {
      const item = document.createElement("div");
      item.className = "participant";

      const avatar = document.createElement("div");
      avatar.className = "participant-avatar";
      avatar.textContent = (participant.name || "?").slice(0, 1);

      const info = document.createElement("div");
      info.className = "participant-info";

      const name = document.createElement("div");
      name.className = "participant-name";
      name.textContent = participant.name +
        (participant.local ? "（あなた）" : "");

      const status = document.createElement("div");
      status.className = "participant-status";
      status.textContent = "入室済み";

      info.append(name, status);
      item.append(avatar, info);
      list.appendChild(item);
    });
  }

  /* ビデオ表示 */

  function showScreenTrack(track) {
    const video = $("shareVideo");

    if (!track) return;

    video.srcObject = null;
    track.attach(video);

    video.style.display = "block";
    $("sharePlaceholder").style.display = "none";
    $("shareLabel").textContent = "画面共有";
  }

  function hideScreenTrack(track) {
    const video = $("shareVideo");

    if (track) {
      track.detach(video);
    }

    video.srcObject = null;
    video.style.display = "none";

    $("sharePlaceholder").style.display = "flex";
    $("shareLabel").textContent = "授業画面";
  }

  function showCameraTrack(track, local = false) {
    const video = local ? $("localCamera") : $("remoteCamera");
    const off = local ? $("localCameraOff") : $("remoteCameraOff");

    if (!track) return;

    track.attach(video);
    off.style.display = "none";
  }

  function hideCameraTrack(track, local = false) {
    const video = local ? $("localCamera") : $("remoteCamera");
    const off = local ? $("localCameraOff") : $("remoteCameraOff");

    if (track) track.detach(video);

    off.style.display = "grid";
  }

  function attachExistingTracks() {
    if (!liveRoom) return;

    const localPublications =
      liveRoom.localParticipant.trackPublications;

    localPublications.forEach(publication => {
      if (!publication.track) return;

      if (publication.source === Track.Source.Camera) {
        showCameraTrack(publication.track, true);
      }

      if (publication.source === Track.Source.ScreenShare) {
        showScreenTrack(publication.track);
      }
    });

    liveRoom.remoteParticipants.forEach(participant => {
      participant.trackPublications.forEach(publication => {
        if (!publication.track) return;

        if (publication.source === Track.Source.Camera) {
          showCameraTrack(publication.track, false);
          $("remoteName").textContent =
            participant.name || "先生・生徒";
        }

        if (publication.source === Track.Source.ScreenShare) {
          showScreenTrack(publication.track);
        }
      });
    });
  }

  /* LiveKit接続 */

  async function connectLiveKit() {
    const idToken = await currentUser.getIdToken();

    const response = await fetch("/api/livekit/token", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${idToken}`
      },
      body: JSON.stringify({
        lessonId
      })
    });

    if (!response.ok) {
      const detail = await response.text();
      throw new Error(
        "LiveKitトークンを取得できませんでした: " + detail
      );
    }

    const data = await response.json();

    const serverUrl = data.url || data.serverUrl;
    const token = data.token;

    if (!serverUrl || !token) {
      throw new Error("LiveKitの接続情報が不足しています。");
    }

    liveRoom = new Room({
      adaptiveStream: true,
      dynacast: true
    });

    liveRoom.on(RoomEvent.TrackSubscribed,
      (track, publication, participant) => {

        if (track.source === Track.Source.ScreenShare) {
          showScreenTrack(track);
        }

        if (track.source === Track.Source.Camera) {
          showCameraTrack(track, false);
          $("remoteName").textContent =
            participant.name || "先生・生徒";
        }

        renderParticipants();
      }
    );

    liveRoom.on(RoomEvent.TrackUnsubscribed,
      (track, publication, participant) => {

        if (track.source === Track.Source.ScreenShare) {
          hideScreenTrack(track);
        }

        if (track.source === Track.Source.Camera) {
          hideCameraTrack(track, false);
        }

        renderParticipants();
      }
    );

    liveRoom.on(RoomEvent.ParticipantConnected, () => {
      renderParticipants();
    });

    liveRoom.on(RoomEvent.ParticipantDisconnected, () => {
      renderParticipants();
    });

    liveRoom.on(RoomEvent.LocalTrackPublished,
      publication => {
        if (
          publication.source === Track.Source.ScreenShare &&
          publication.track
        ) {
          showScreenTrack(publication.track);
        }

        if (
          publication.source === Track.Source.Camera &&
          publication.track
        ) {
          showCameraTrack(publication.track, true);
        }
      }
    );

    liveRoom.on(RoomEvent.LocalTrackUnpublished,
      publication => {
        if (publication.source === Track.Source.ScreenShare) {
          hideScreenTrack(publication.track);
        }

        if (publication.source === Track.Source.Camera) {
          hideCameraTrack(publication.track, true);
        }
      }
    );

    liveRoom.on(RoomEvent.Disconnected, () => {
      setConnection(false);
      toast("授業から切断されました。");
    });

    await liveRoom.connect(serverUrl, token);

    setConnection(true);

    $("localName").textContent =
      userProfile.displayName || "あなた";

    renderParticipants();
    attachExistingTracks();

    subscribeBoard();
    subscribeChat();

    resizeCanvas();
  }

  /* マイク */

  $("micButton").addEventListener("click", async () => {
    if (!liveRoom) return;

    try {
      micEnabled = !micEnabled;

      await liveRoom.localParticipant.setMicrophoneEnabled(
        micEnabled
      );

      $("micButton").textContent =
        micEnabled ? "マイク ON" : "マイク OFF";

      $("micButton").classList.toggle("active", micEnabled);
    } catch (error) {
      console.error(error);
      micEnabled = !micEnabled;
      toast("マイクを変更できませんでした。");
    }
  });

  /* カメラ */

  $("cameraButton").addEventListener("click", async () => {
    if (!liveRoom) return;

    try {
      cameraEnabled = !cameraEnabled;

      await liveRoom.localParticipant.setCameraEnabled(
        cameraEnabled
      );

      $("cameraButton").textContent =
        cameraEnabled ? "カメラ ON" : "カメラ OFF";

      $("cameraButton").classList.toggle(
        "active",
        cameraEnabled
      );
    } catch (error) {
      console.error(error);
      cameraEnabled = !cameraEnabled;
      toast("カメラを変更できませんでした。");
    }
  });

  /* 画面共有 */

  $("shareButton").addEventListener("click", async () => {
    if (!liveRoom) return;

    try {
      screenEnabled = !screenEnabled;

      await liveRoom.localParticipant.setScreenShareEnabled(
        screenEnabled
      );

      $("shareButton").textContent =
        screenEnabled ? "共有を停止" : "画面共有";

      $("shareButton").classList.toggle(
        "active",
        screenEnabled
      );

    } catch (error) {
      console.error(error);
      screenEnabled = false;
      $("shareButton").textContent = "画面共有";
      toast("画面共有を開始できませんでした。");
    }
  });

  /* サイドパネル切り替え */

  document.querySelectorAll(".side-tab").forEach(button => {
    button.addEventListener("click", () => {
      const tab = button.dataset.tab;

      document.querySelectorAll(".side-tab").forEach(item => {
        item.classList.toggle("active", item === button);
      });

      $("participantsPanel").classList.toggle(
        "active",
        tab === "participants"
      );

      $("chatPanel").classList.toggle(
        "active",
        tab === "chat"
      );
    });
  });

  $("chatButton").addEventListener("click", () => {
    document.querySelector('[data-tab="chat"]').click();

    if (window.innerWidth <= 650) {
      $("sidePanel").classList.remove("mobile-hidden");
    }
  });

  /* 退出 */

  async function leaveRoom() {
    if (!confirm("授業ルームから退出しますか？")) return;

    setConnection(false);

    if (unsubscribeBoard) unsubscribeBoard();
    if (unsubscribeChat) unsubscribeChat();

    if (liveRoom) {
      try {
        await liveRoom.disconnect();
      } catch (error) {
        console.error(error);
      }
    }

    location.href = "../login.html";
  }

  $("leaveButton").addEventListener("click", leaveRoom);

  /* 授業情報 */

  async function getLessonAndProfile() {
    if (!lessonId) {
      throw new Error("URLに授業IDが指定されていません。");
    }

    const profileSnapshot = await getDoc(
      doc(db, "users", currentUser.uid)
    );

    if (!profileSnapshot.exists()) {
      throw new Error("ユーザープロフィールが登録されていません。");
    }

    userProfile = profileSnapshot.data();

    if (userProfile.status && userProfile.status !== "active") {
      throw new Error("このアカウントは現在利用できません。");
    }

    if (
      !["student", "teacher", "admin"].includes(userProfile.role)
    ) {
      throw new Error("アカウントの権限が正しく設定されていません。");
    }

    const lessonSnapshot = await getDoc(
      doc(db, "lessons", lessonId)
    );

    if (!lessonSnapshot.exists()) {
      throw new Error("指定された授業が見つかりません。");
    }

    lessonData = lessonSnapshot.data();

    const role = userProfile.role;

    if (
      role === "teacher" &&
      lessonData.teacherId !== currentUser.uid
    ) {
      throw new Error("この授業の担当者ではありません。");
    }

    if (
      role === "student" &&
      lessonData.studentId !== currentUser.uid
    ) {
      throw new Error("この授業に参加する権限がありません。");
    }

    if (
      lessonData.status === "cancelled" ||
      lessonData.status === "completed"
    ) {
      throw new Error("この授業は終了またはキャンセルされています。");
    }

    $("lessonTitle").textContent =
      lessonData.title || "個別指導";

    $("lessonSubject").textContent =
      lessonData.subject || "授業";

    $("localName").textContent =
      userProfile.displayName || "あなた";
  }

  /* 起動 */

  async function start() {
    try {
      await authPersistenceReady;

      await new Promise((resolve, reject) => {
        const unsubscribe = onAuthStateChanged(
          auth,
          user => {
            unsubscribe();
            if (user) resolve(user);
            else reject(new Error("ログインしてください。"));
          },
          reject
        );
      }).then(user => {
        currentUser = user;
      });

      await getLessonAndProfile();
      await connectLiveKit();

      resizeCanvas();

    } catch (error) {
      showError(error);
    }
  }

  window.addEventListener("resize", resizeCanvas);

  start();
</script>
