
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14263f">
<title>端末セッション管理 | WEB Course-plus</title>
<style>
:root{
  font-family:Inter,"Noto Sans JP",system-ui,sans-serif;
  color:#182334;background:#f4f7fb;
  --navy:#14263f;--blue:#2563eb;
  --border:#dfe6ef;--muted:#64748b;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button{font:inherit;cursor:pointer}
.topbar{
  height:66px;position:fixed;z-index:5;inset:0 0 auto;
  background:var(--navy);color:white;
  display:flex;align-items:center;padding:0 22px;gap:16px
}
.toggle{
  background:none;border:1px solid #ffffff55;color:white;
  border-radius:7px;padding:8px 12px
}
.brand{font-weight:750}
.right{
  margin-left:auto;display:flex;align-items:center;
  gap:14px;font-size:13px
}
.logout{
  background:transparent;color:white;
  border:1px solid #ffffff55;border-radius:7px;
  padding:8px 12px
}
.sidebar{
  position:fixed;top:66px;bottom:0;width:250px;
  background:white;border-right:1px solid var(--border);
  padding:22px 14px;z-index:4;transition:.2s
}
.navhead{
  font-size:11px;color:#94a3b8;font-weight:bold;
  padding:9px 12px
}
.nav{
  display:block;padding:12px;border-radius:7px;
  text-decoration:none;color:#475569;
  font-size:13px;font-weight:600;margin:3px 0
}
.nav:hover{background:#f1f5f9}
.nav.active{background:#eff6ff;color:#1d4ed8}
main{
  margin-left:250px;padding:96px 30px 30px;
  max-width:1500px;transition:.2s
}
body.closed .sidebar{transform:translateX(-100%)}
body.closed main{margin-left:0}
h1{font-size:25px;color:var(--navy);margin:0 0 7px}
.sub{font-size:13px;color:var(--muted);margin:0 0 24px}
.panel{
  background:white;border:1px solid var(--border);
  border-radius:10px;padding:20px;margin-bottom:18px
}
.toolbar{
  display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap
}
.toolbar-title{font-size:14px;font-weight:700;color:var(--navy)}
.toolbar-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{
  padding:10px 15px;border:0;border-radius:7px;
  background:var(--blue);color:white;
  font-size:12px;font-weight:650
}
.btn:hover:not(:disabled){background:#1d4ed8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#e2e8f0;color:#334155}
.secondary:hover:not(:disabled){background:#cbd5e1}
.danger{
  background:#dc2626;color:white;
  padding:7px 10px;border:0;border-radius:6px;
  font-size:11px;font-weight:650
}
.danger:hover:not(:disabled){background:#b91c1c}
.danger:disabled{opacity:.4;cursor:not-allowed}
.notice{
  display:none;padding:12px 14px;border-radius:7px;
  font-size:12px;line-height:1.7;margin-bottom:15px
}
.notice.show{display:block}
.notice.error{background:#fef2f2;color:#991b1b}
.notice.success{background:#f0fdf4;color:#166534}
.stats{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;margin-bottom:18px
}
.stat{
  background:white;border:1px solid var(--border);
  border-radius:9px;padding:16px
}
.stat-label{font-size:11px;color:var(--muted)}
.stat-value{
  color:var(--navy);font-size:25px;
  font-weight:750;margin-top:7px
}
.table-wrap{overflow-x:auto;margin-top:17px}
table{
  width:100%;border-collapse:collapse;
  min-width:850px;text-align:left
}
th{
  background:#f8fafc;color:#64748b;
  font-size:11px;font-weight:700;
  padding:12px;border-bottom:1px solid var(--border);
  white-space:nowrap
}
td{
  padding:13px 12px;border-bottom:1px solid #edf1f5;
  font-size:12px;vertical-align:middle
}
td strong{font-size:12px;color:#334155}
.subtext{
  display:block;color:#94a3b8;font-size:11px;
  margin-top:4px;overflow-wrap:anywhere
}
.pill{
  display:inline-block;padding:5px 9px;
  border-radius:20px;font-size:10px;font-weight:700;
  white-space:nowrap
}
.pill.ok{background:#dcfce7;color:#166534}
.pill.off{background:#e2e8f0;color:#475569}
.pill.warn{background:#ffedd5;color:#9a3412}
.empty{
  text-align:center;color:#94a3b8;
  padding:35px 10px;font-size:13px
}
.filter{
  padding:9px 11px;border:1px solid #cbd5e1;
  border-radius:7px;font-size:12px;background:white;
  color:#334155
}
.updated{
  text-align:right;color:#94a3b8;
  font-size:11px;margin-top:13px
}
footer{
  text-align:center;border-top:1px solid var(--border);
  padding:20px;color:#94a3b8;font-size:11px;margin-top:30px
}
@media(max-width:800px){
  .sidebar{box-shadow:8px 0 20px #14263f12}
  main{margin-left:0;padding:88px 14px 25px}
  .topbar{padding:0 13px}
  .brand{font-size:14px}
  .right span{display:none}
}
@media(max-width:560px){
  .stats{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header class="topbar">
  <button class="toggle" id="menuToggle" type="button">メニュー</button>
  <div class="brand">WEB Course-plus</div>
  <div class="right">
    <span>システム管理者</span>
    <span id="adminName">管理者</span>
    <button class="logout" id="logout" type="button">ログアウト</button>
  </div>
</header>

<aside class="sidebar">
  <div class="navhead">ADMINISTRATION</div>
  <a class="nav" href="/admin/dashboard.html">ダッシュボード</a>
  <a class="nav active" href="/admin/sessions.html">端末セッション管理</a>
  <a class="nav" href="/admin/settings.html">システム設定</a>
  <a class="nav" href="/admin/logs.html">操作ログ・監査ログ</a>
</aside>

<main>
  <h1>端末セッション管理</h1>
  <p class="sub">アカウントにログインしている端末を確認・管理できます。</p>

  <div id="notice" class="notice" role="status"></div>

  <section class="stats">
    <div class="stat">
      <div class="stat-label">有効な端末</div>
      <div class="stat-value" id="activeCount">--</div>
    </div>
    <div class="stat">
      <div class="stat-label">解除済み端末</div>
      <div class="stat-value" id="revokedCount">--</div>
    </div>
    <div class="stat">
      <div class="stat-label">登録端末総数</div>
      <div class="stat-value" id="totalCount">--</div>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <div class="toolbar-title">登録端末一覧</div>
      <div class="toolbar-actions">
        <select class="filter" id="roleFilter">
          <option value="all">すべての権限</option>
          <option value="student">生徒</option>
          <option value="teacher">講師</option>
          <option value="admin">管理者</option>
        </select>
        <select class="filter" id="statusFilter">
          <option value="all">すべての状態</option>
          <option value="active">有効</option>
          <option value="revoked">解除済み</option>
          <option value="inactive">無効</option>
        </select>
        <button class="btn secondary" id="reload" type="button">
          再読み込み
        </button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>利用者</th>
            <th>権限</th>
            <th>端末セッションID</th>
            <th>最終アクセス</th>
            <th>状態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="sessionRows">
          <tr>
            <td colspan="6" class="empty">読み込み中です。</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="updated" id="updatedAt">最終更新：--</div>
  </section>

  <footer>
    © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
  </footer>
</main>

<script type="module">
import {
  auth,
  db,
  authPersistenceReady
} from "/assets/js/firebase.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const SESSION_KEY = "web-course-plus-device-session";

let currentUser = null;
let allSessions = [];
let loading = false;

function getSessionId(){
  let id = localStorage.getItem(SESSION_KEY);

  if(!id){
    id = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY,id);
  }

  return id;
}

function notice(message,type="error"){
  $("notice").textContent = message;
  $("notice").className = "notice show " + type;
}

function clearNotice(){
  $("notice").textContent = "";
  $("notice").className = "notice";
}

async function api(url,options={}){
  const headers = new Headers(options.headers || {});
  headers.set("Authorization","Bearer "+await currentUser.getIdToken());
  headers.set("X-Session-Id",getSessionId());

  if(options.body){
    headers.set("Content-Type","application/json");
  }

  const response = await fetch(url,{
    ...options,
    headers,
    cache:"no-store"
  });

  const data = await response.json().catch(()=>({}));

  if(response.status === 401 || response.status === 403){
    localStorage.removeItem(SESSION_KEY);
    await signOut(auth);
    location.replace("/login.html");
    throw new Error("認証または管理者権限を確認できません。");
  }

  if(!response.ok || data.success === false){
    throw new Error(data.error || "処理に失敗しました。");
  }

  return data;
}

function roleLabel(role){
  return {
    student:"生徒",
    teacher:"講師",
    admin:"管理者"
  }[role] || "不明";
}

function formatDate(value){
  if(!value) return "記録なし";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())) return "不明";

  return date.toLocaleString("ja-JP");
}

function sessionStatus(session){
  if(session.revoked){
    return {
      label:"解除済み",
      className:"off",
      filter:"revoked"
    };
  }

  if(session.active){
    return {
      label:"有効",
      className:"ok",
      filter:"active"
    };
  }

  return {
    label:"無効",
    className:"warn",
    filter:"inactive"
  };
}

function render(){
  const role = $("roleFilter").value;
  const status = $("statusFilter").value;

  const activeCount = allSessions.filter(
    s => s.active && !s.revoked
  ).length;

  const revokedCount = allSessions.filter(
    s => s.revoked
  ).length;

  $("activeCount").textContent = activeCount;
  $("revokedCount").textContent = revokedCount;
  $("totalCount").textContent = allSessions.length;

  const filtered = allSessions.filter(session=>{
    if(role !== "all" && session.role !== role) return false;

    const state = sessionStatus(session).filter;

    if(status !== "all" && state !== status) return false;

    return true;
  });

  const tbody = $("sessionRows");
  tbody.replaceChildren();

  if(!filtered.length){
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 6;
    td.className = "empty";
    td.textContent = "該当する端末はありません。";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }

  for(const session of filtered){
    const tr = document.createElement("tr");
    const userCell = document.createElement("td");

    const name = document.createElement("strong");
    name.textContent = session.displayName || "名称未設定";

    const email = document.createElement("span");
    email.className = "subtext";
    email.textContent = session.email || "メールアドレスなし";

    userCell.append(name,email);
    tr.appendChild(userCell);

    const roleCell = document.createElement("td");
    roleCell.textContent = roleLabel(session.role);
    tr.appendChild(roleCell);

    const idCell = document.createElement("td");
    const idText = document.createElement("span");
    idText.className = "subtext";
    idText.textContent = session.sessionId || "";
    idCell.appendChild(idText);
    tr.appendChild(idCell);

    const dateCell = document.createElement("td");
    dateCell.textContent = formatDate(session.lastSeen);
    tr.appendChild(dateCell);

    const stateCell = document.createElement("td");
    const state = sessionStatus(session);
    const pill = document.createElement("span");
    pill.className = "pill " + state.className;
    pill.textContent = state.label;
    stateCell.appendChild(pill);
    tr.appendChild(stateCell);

    const actionCell = document.createElement("td");

    if(
      session.active &&
      !session.revoked &&
      session.role !== "admin"
    ){
      const button = document.createElement("button");
      button.type = "button";
      button.className = "danger";
      button.textContent = "強制ログアウト";

      button.addEventListener("click",()=>{
        revokeSession(session,button);
      });

      actionCell.appendChild(button);
    }else{
      actionCell.textContent = "—";
    }

    tr.appendChild(actionCell);
    tbody.appendChild(tr);
  }
}

async function loadSessions(){
  if(loading) return;

  loading = true;
  clearNotice();

  $("reload").disabled = true;
  $("reload").textContent = "読み込み中...";

  try{
    const data = await api("/api/admin/sessions");

    allSessions = Array.isArray(data.sessions)
      ? data.sessions
      : [];

    render();

    $("updatedAt").textContent =
      "最終更新："+new Date().toLocaleString("ja-JP");

  }catch(error){
    notice(error.message);

    $("sessionRows").innerHTML =
      '<tr><td colspan="6" class="empty">一覧を取得できませんでした。</td></tr>';

  }finally{
    loading = false;
    $("reload").disabled = false;
    $("reload").textContent = "再読み込み";
  }
}

async function revokeSession(session,button){
  const confirmed = confirm(
    `${session.displayName || session.email || "この利用者"}の端末を強制ログアウトしますか？`
  );

  if(!confirmed) return;

  button.disabled = true;
  button.textContent = "処理中...";

  try{
    await api(
      `/api/admin/sessions/${encodeURIComponent(session.uid)}/${encodeURIComponent(session.sessionId)}`,
      {method:"DELETE"}
    );

    notice("端末セッションを解除しました。","success");

    await loadSessions();

  }catch(error){
    notice(error.message);
    button.disabled = false;
    button.textContent = "強制ログアウト";
  }
}

$("reload").addEventListener("click",loadSessions);
$("roleFilter").addEventListener("change",render);
$("statusFilter").addEventListener("change",render);

$("menuToggle").addEventListener("click",()=>{
  document.body.classList.toggle("closed");
});

$("logout").addEventListener("click",async()=>{
  if(!confirm("ログアウトしますか？")) return;

  try{
    await api("/api/sessions/logout",{
      method:"POST",
      body:JSON.stringify({
        sessionId:getSessionId()
      })
    });
  }catch(error){
    console.warn(error);
  }

  localStorage.removeItem(SESSION_KEY);
  await signOut(auth);
  location.replace("/login.html");
});

await authPersistenceReady;

onAuthStateChanged(auth,async user=>{
  if(!user){
    location.replace("/login.html");
    return;
  }

  currentUser = user;

  try{
    const profile = await getDoc(
      doc(db,"users",user.uid)
    );

    if(!profile.exists() || profile.data().role !== "admin"){
      throw new Error("管理者権限が必要です。");
    }

    $("adminName").textContent =
      profile.data().displayName ||
      user.email ||
      "管理者";

    await api("/api/sessions/heartbeat",{
      method:"POST",
      body:JSON.stringify({
        sessionId:getSessionId()
      })
    });

    await loadSessions();

  }catch(error){
    notice(error.message);
  }
});
</script>
</body>
</html>
