<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>端末セッション管理 | WEB Course-plus</title>
<style>
:root{font-family:Inter,"Noto Sans JP",sans-serif;color:#182334;background:#f4f7fb;--navy:#14263f;--blue:#2563eb;--border:#dfe6ef;--muted:#64748b}
*{box-sizing:border-box}body{margin:0}.topbar{height:66px;position:fixed;z-index:5;inset:0 0 auto;background:var(--navy);color:white;display:flex;align-items:center;padding:0 22px;gap:16px}.menu-toggle{background:none;border:1px solid #ffffff55;color:white;border-radius:7px;padding:8px 12px;cursor:pointer}.brand{font-weight:750}.topright{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px}.logout{background:transparent;color:white;border:1px solid #ffffff55;border-radius:7px;padding:8px 12px;cursor:pointer}
.sidebar{position:fixed;top:66px;bottom:0;width:250px;background:white;border-right:1px solid var(--border);padding:22px 14px;z-index:4;transition:.2s}.navhead{font-size:11px;color:#94a3b8;font-weight:bold;padding:9px 12px}.nav{display:block;padding:12px;border-radius:7px;text-decoration:none;color:#475569;font-size:13px;font-weight:600;margin:3px 0}.nav:hover{background:#f1f5f9}.nav.active{background:#eff6ff;color:#1d4ed8}
main{margin-left:250px;padding:96px 30px 30px;transition:.2s}body.closed .sidebar{transform:translateX(-100%)}body.closed main{margin-left:0}
h1{font-size:25px;color:var(--navy);margin:0 0 7px}.sub{font-size:13px;color:var(--muted);margin:0 0 24px}.panel{background:white;border:1px solid var(--border);border-radius:10px;margin-bottom:18px;overflow:hidden}.panelhead{padding:17px 19px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}.panelhead h2{font-size:14px;margin:0}.body{padding:19px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}input,select{padding:10px 12px;border:1px solid #cbd5e1;border-radius:7px;background:white;font:inherit;font-size:13px;min-width:160px}.btn{padding:9px 13px;border:0;border-radius:7px;background:var(--blue);color:white;font-size:12px;font-weight:650;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.danger{background:#dc2626}.secondary{background:#e2e8f0;color:#334155}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf1f5;font-size:12px}th{color:#64748b;background:#f8fafc;font-weight:700}td{color:#334155}.pill{padding:5px 8px;border-radius:20px;font-size:11px;font-weight:700}.activepill{background:#dcfce7;color:#166534}.offpill{background:#e2e8f0;color:#475569}.empty{text-align:center;color:#94a3b8;padding:30px}.notice{display:none;padding:12px;border-radius:7px;font-size:12px;margin-bottom:14px}.notice.show{display:block}.error{background:#fef2f2;color:#991b1b}.success{background:#f0fdf4;color:#166534}.muted{color:#94a3b8;font-size:11px}footer{text-align:center;border-top:1px solid var(--border);padding:20px;color:#94a3b8;font-size:11px;margin-top:30px}
@media(max-width:700px){.sidebar{box-shadow:8px 0 20px #14263f12}main{margin-left:0;padding:88px 14px 25px}.topbar{padding:0 13px}.brand{font-size:14px}.topright span{display:none}}
</style>
</head>
<body>
<header class="topbar">
<button class="menu-toggle" id="menuToggle">☰</button>
<div class="brand">WEB Course-plus</div>
<div class="topright"><span>システム管理者</span><span id="adminName">確認中</span><button class="logout" id="logout">ログアウト</button></div>
</header>
<aside class="sidebar">
<div class="navhead">ADMINISTRATION</div>
<a class="nav" href="/admin/dashboard.html">ダッシュボード</a>
<a class="nav active" href="/admin/sessions.html">端末セッション管理</a>
<a class="nav" href="/admin/settings.html">システム設定</a>
<a class="nav" href="/admin/logs.html">操作ログ</a>
</aside>
<main>
<h1>端末セッション管理</h1>
<p class="sub">ユーザーがログインしている端末を確認し、必要に応じて個別にセッションを解除します。</p>
<div id="notice" class="notice"></div>
<section class="panel">
<div class="panelhead"><h2>ログイン中の端末</h2><button class="btn secondary" id="refresh">再読み込み</button></div>
<div class="body">
<div class="toolbar">
<input id="search" type="search" placeholder="メールアドレス・ユーザーIDで検索">
<select id="statusFilter"><option value="all">すべての状態</option><option value="active">有効のみ</option><option value="inactive">無効のみ</option></select>
</div>
<div class="tablewrap">
<table>
<thead><tr><th>ユーザー</th><th>権限</th><th>端末セッションID</th><th>最終アクセス</th><th>状態</th><th>操作</th></tr></thead>
<tbody id="sessionRows"><tr><td colspan="6" class="empty">読み込み中...</td></tr></tbody>
</table>
</div>
<p class="muted">※ 強制解除後、対象端末は次回のサーバー確認時にログアウトされます。既に接続中のLiveKit通話を即時切断するには、サーバー側の参加者切断処理も必要です。</p>
</div>
</section>
<footer>© 2026 定期テスト対策プリント運営事務局. All Rights Reserved.</footer>
</main>
<script type="module">
import{auth,db,authPersistenceReady}from"/assets/js/firebase.js";
import{onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import{doc,getDoc}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
const $=id=>document.getElementById(id),KEY="web-course-plus-device-session";
let user=null,allSessions=[];
function sid(){let v=localStorage.getItem(KEY);if(!v){v=crypto.randomUUID();localStorage.setItem(KEY,v)}return v}
async function api(url,opt={}){const h=new Headers(opt.headers||{});h.set("Authorization","Bearer "+await user.getIdToken());h.set("X-Session-Id",sid());if(opt.body)h.set("Content-Type","application/json");const r=await fetch(url,{...opt,headers:h,cache:"no-store"});if(r.status===401){await signOut(auth);location.replace("/login.html");throw Error("セッションが無効です。再ログインしてください。")}return r}
function notice(msg,type="error"){$("notice").textContent=msg;$("notice").className="notice show "+type}
function dateText(v){if(!v)return"不明";const d=typeof v==="number"?new Date(v):new Date(v);return Number.isNaN(d.getTime())?"不明":d.toLocaleString("ja-JP")}
function render(){const q=$("search").value.trim().toLowerCase(),f=$("statusFilter").value;const rows=allSessions.filter(s=>{const hay=[s.email,s.uid,s.userId,s.displayName,s.sessionId].join(" ").toLowerCase();const active=s.active!==false&&s.revoked!==true;return(!q||hay.includes(q))&&(f==="all"||(f==="active"&&active)||(f==="inactive"&&!active))});const body=$("sessionRows");body.replaceChildren();if(!rows.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=6;td.className="empty";td.textContent="該当するセッションはありません。";tr.append(td);body.append(tr);return}for(const s of rows){const tr=document.createElement("tr");const vals=[s.displayName||s.email||s.uid||s.userId||"不明",s.role||"不明",s.sessionId||"不明",dateText(s.lastSeen||s.lastSeenAt||s.createdAt)];for(const v of vals){const td=document.createElement("td");td.textContent=String(v);tr.append(td)}const active=s.active!==false&&s.revoked!==true;const state=document.createElement("td"),pill=document.createElement("span");pill.className="pill "+(active?"activepill":"offpill");pill.textContent=active?"有効":"無効";state.append(pill);tr.append(state);const action=document.createElement("td");if(active){const b=document.createElement("button");b.className="btn danger";b.textContent="強制解除";b.addEventListener("click",()=>revoke(s));action.append(b)}else action.textContent="解除済み";tr.append(action);body.append(tr)}}
async function load(){ $("sessionRows").innerHTML='<tr><td colspan="6" class="empty">読み込み中...</td></tr>';try{const r=await api("/api/admin/sessions");const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"セッション一覧を取得できません。");allSessions=Array.isArray(d.sessions)?d.sessions:[];render()}catch(e){notice(e.message);$("sessionRows").innerHTML='<tr><td colspan="6" class="empty">読み込みに失敗しました。</td></tr>'}}
async function revoke(s){if(!s.uid&&!s.userId){notice("ユーザーIDが取得できないため解除できません。");return}if(!s.sessionId){notice("セッションIDが取得できないため解除できません。");return}if(!confirm(`${s.email||s.uid||s.userId} の端末セッションを強制解除しますか？`))return;try{const uid=encodeURIComponent(s.uid||s.userId),id=encodeURIComponent(s.sessionId);const r=await api(`/api/admin/sessions/${uid}/${id}`,{method:"DELETE"});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"セッションを解除できませんでした。");notice("端末セッションを解除しました。","success");await load()}catch(e){notice(e.message)}}
$("refresh").onclick=load;$("search").oninput=render;$("statusFilter").onchange=render;$("menuToggle").onclick=()=>document.body.classList.toggle("closed");
$("logout").onclick=async()=>{if(!confirm("ログアウトしますか？"))return;try{await api("/api/sessions/logout",{method:"POST",body:JSON.stringify({sessionId:sid()})})}catch(e){}await signOut(auth);localStorage.removeItem(KEY);location.replace("/login.html")};
await authPersistenceReady;onAuthStateChanged(auth,async u=>{if(!u){location.replace("/login.html");return}user=u;try{const p=await getDoc(doc(db,"users",u.uid));if(!p.exists()||p.data().role!=="admin")throw Error("管理者権限がありません。");$("adminName").textContent=p.data().displayName||u.email;const hb=await api("/api/sessions/heartbeat",{method:"POST",body:JSON.stringify({sessionId:sid()})});if(!hb.ok)throw Error("端末セッションを確認できません。");await load()}catch(e){alert(e.message);await signOut(auth);location.replace("/login.html")}});
</script>
</body>
</html>
