
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7fb">
  <title>ログイン | WEB Course-plus</title>

  <style>
    :root {
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      color: #182334;
      background: #f4f7fb;
      --primary: #2563eb;
      --border: #dfe6ef;
      --muted: #64748b;
      --navy: #14263f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f4f7fb;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 750;
      color: var(--navy);
    }

    .card,
    .maintenance {
      padding: 30px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(20, 38, 63, .06);
    }

    h2 {
      margin: 0 0 9px;
      font-size: 21px;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .google-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #fff;
      color: #1f1f1f;
      border: 1px solid #747775;
    }

    .google-button:hover:not(:disabled) {
      background: #f8faff;
    }

    .google-logo {
      display: block;
      flex: 0 0 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 21px 0;
      color: #94a3b8;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    .links {
      display: flex;
      justify-content: center;
      margin-top: 19px;
      font-size: 13px;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover { text-decoration: underline; }

    .message {
      display: none;
      margin-bottom: 17px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      color: #166534;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    .hidden { display: none !important; }

    .maintenance {
      display: none;
      padding: 0;
      overflow: hidden;
      text-align: center;
    }

    .maintenance-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 17px 20px;
      color: #fff;
      background: #14263f;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .wrench-icon {
      width: 23px;
      height: 23px;
      flex: 0 0 23px;
    }

    .maintenance-content {
      padding: 35px 28px 30px;
    }

    .maintenance-symbol {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: #b45309;
      background: #fff7ed;
    }

    .maintenance-symbol svg {
      width: 39px;
      height: 39px;
    }

    .maintenance h2 {
      margin: 0 0 13px;
      color: #14263f;
      font-size: 23px;
    }

    .maintenance p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .maintenance-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 23px;
      padding: 8px 13px;
      border-radius: 20px;
      color: #9a3412;
      background: #fff7ed;
      font-size: 12px;
      font-weight: 700;
    }

    .maintenance-status span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ea580c;
    }

    .maintenance-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.8;
    }

    .maintenance-actions {
      margin-top: 22px;
    }

    .secondary-button {
      color: #334155;
      background: #f1f5f9;
    }

    .secondary-button:hover:not(:disabled) {
      background: #e2e8f0;
    }

    footer {
      padding: 20px 12px;
      color: #94a3b8;
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .card { padding: 23px 19px; }
      .brand h1 { font-size: 25px; }
      .maintenance-content { padding: 29px 20px 24px; }
    }
  </style>
</head>

<body>
<main>
  <div class="container">

    <div class="brand">
      <h1>WEB Course-plus</h1>
    </div>

    <!-- ログイン画面 -->
    <section class="card" id="loginView">
      <h2>ログイン</h2>
      <p class="description">
        登録済みのアカウントでログインしてください。
      </p>

      <div id="loginMessage" class="message" role="alert"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">メールアドレス</label>
          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="example@email.com"
            required>
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="パスワードを入力"
            required>
        </div>

        <button id="loginButton" type="submit">ログイン</button>
      </form>

      <div class="links">
        <a href="/login.html?mode=reset" id="resetLink">
          パスワードを忘れた方
        </a>
      </div>

      <div class="divider">または</div>

      <!-- Google公式Gロゴ付きログイン -->
      <button id="googleButton" class="google-button" type="button">
        <svg class="google-logo" width="20" height="20"
          viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 38.08 46.98 31.8 46.98 24.55z"/>
          <path fill="#FBBC05"
            d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a24 24 0 0 0 0 21.56l7.98-6.19z"/>
          <path fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Googleでログイン</span>
      </button>
    </section>

    <!-- パスワード再設定 -->
    <section class="card hidden" id="resetView">
      <h2>パスワード再設定</h2>
      <p class="description">
        登録済みのメールアドレスに再設定メールを送信します。
      </p>

      <div id="resetMessage" class="message" role="alert"></div>

      <form id="resetForm">
        <div class="field">
          <label for="resetEmail">メールアドレス</label>
          <input id="resetEmail" type="email"
            autocomplete="email" required>
        </div>
        <button id="resetButton" type="submit">
          再設定メールを送信
        </button>
      </form>

      <div class="links">
        <a href="/login.html">ログイン画面に戻る</a>
      </div>
    </section>

    <!-- ログイン後のメンテナンス画面 -->
    <section class="maintenance" id="maintenanceView">
      <div class="maintenance-header">
        <svg class="wrench-icon" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4L14 13l-3-3 3.7-3.7Z"/>
        </svg>
        <span>SYSTEM MAINTENANCE</span>
      </div>

      <div class="maintenance-content">
        <div class="maintenance-symbol">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4L14 13l-3-3 3.7-3.7Z"/>
          </svg>
        </div>

        <h2>システムメンテナンス中</h2>
        <p id="maintenanceMessage">
          現在、システムメンテナンスを実施しています。
          メンテナンス終了までしばらくお待ちください。
        </p>

        <div class="maintenance-status">
          <span></span>
          メンテナンス実施中
        </div>

        <div class="maintenance-actions">
          <button id="maintenanceRetryButton"
            class="secondary-button" type="button">
            状態を再確認する
          </button>
        </div>

        <div class="maintenance-footer">
          WEB Course-plus<br>
          定期テスト対策プリント運営事務局
        </div>
      </div>
    </section>

  </div>
</main>

<footer>
  © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
</footer>

<script type="module">
  import {
    auth,
    db,
    googleProvider,
    authPersistenceReady
  } from "/assets/js/firebase.js";

  import {
    signInWithEmailAndPassword,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult,
    sendPasswordResetEmail,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  import {
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);
  const SESSION_KEY = "web-course-plus-device-session";

  let maintenance = false;
  let maintenanceMessage = "";
  let routing = false;
  let initialized = false;
  let currentMode = "login";

  function getSessionId() {
    let id = localStorage.getItem(SESSION_KEY);

    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem(SESSION_KEY, id);
    }

    return id;
  }

  function showMessage(id, message, type = "error") {
    const element = $(id);
    element.textContent = message;
    element.className = `message ${type}`;
  }

  function clearMessage(id) {
    $(id).textContent = "";
    $(id).className = "message";
  }

  function setLoading(button, loading, label) {
    button.disabled = loading;
    button.textContent = loading ? "処理しています..." : label;
  }

  function showLoginView() {
    currentMode = "login";
    $("loginView").classList.remove("hidden");
    $("resetView").classList.add("hidden");
    $("maintenanceView").style.display = "none";
  }

  function showResetView() {
    currentMode = "reset";
    $("loginView").classList.add("hidden");
    $("resetView").classList.remove("hidden");
    $("maintenanceView").style.display = "none";
  }

  function showMaintenanceView(message) {
    currentMode = "maintenance";
    $("loginView").classList.add("hidden");
    $("resetView").classList.add("hidden");
    $("maintenanceView").style.display = "block";

    $("maintenanceMessage").textContent =
      message ||
      "現在、システムメンテナンスを実施しています。メンテナンス終了までしばらくお待ちください。";
  }

  async function getToken(user = auth.currentUser) {
    if (!user) {
      throw new Error("ログイン状態を確認できません。");
    }
    return user.getIdToken();
  }

  async function apiFetch(url, options = {}) {
    const token = await getToken();
    const headers = new Headers(options.headers || {});

    headers.set("Authorization", `Bearer ${token}`);
    headers.set("X-Session-Id", getSessionId());

    if (options.body) {
      headers.set("Content-Type", "application/json");
    }

    return fetch(url, {
      ...options,
      headers,
      cache: "no-store"
    });
  }

  async function checkMaintenance() {
    const response = await fetch("/api/system/status", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("システム状態を取得できませんでした。");
    }

    const data = await response.json();
    maintenance = data.maintenance === true;
    maintenanceMessage = data.maintenanceMessage || "";

    return data;
  }

  async function loadProfile(user) {
    const snapshot = await getDoc(doc(db, "users", user.uid));

    if (!snapshot.exists()) {
      throw new Error("ユーザー情報が登録されていません。");
    }

    const profile = snapshot.data();

    if (
      profile.active === false ||
      ["inactive", "disabled", "suspended", "deleted"]
        .includes(String(profile.status || "").toLowerCase())
    ) {
      throw new Error("このアカウントは利用停止中です。");
    }

    if (!["admin", "teacher", "student"].includes(profile.role)) {
      throw new Error("アカウントの権限が正しくありません。");
    }

    return profile;
  }

  async function registerSession(user) {
    const token = await user.getIdToken();

    const response = await fetch("/api/sessions/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        sessionId: getSessionId()
      }),
      cache: "no-store"
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.success) {
      const error = new Error(
        data.error || "端末セッションを登録できませんでした。"
      );
      error.code = data.code;
      throw error;
    }

    return data;
  }

  async function routeUser(user) {
    if (!user || routing) return;

    routing = true;

    try {
      const profile = await loadProfile(user);

      // 管理者はメンテナンス中でも管理画面へ入れる
      if (maintenance && profile.role !== "admin") {
        await signOut(auth);
        localStorage.removeItem(SESSION_KEY);
        showMaintenanceView(maintenanceMessage);
        return;
      }

      await registerSession(user);

      if (profile.role === "admin") {
        location.replace("/admin/dashboard.html");
      } else if (profile.role === "teacher") {
        location.replace("/teacher/dashboard.html");
      } else {
        location.replace("/student/dashboard.html");
      }

    } catch (error) {
      console.error("ログイン処理エラー:", error);

      if (auth.currentUser) {
        await signOut(auth).catch(console.error);
      }

      if (error.code === "SESSION_LIMIT") {
        showMessage(
          "loginMessage",
          "同時ログイン上限の4端末に達しています。管理者に端末セッションの解除を依頼してください。"
        );
      } else {
        showMessage(
          "loginMessage",
          error.message || "ログインに失敗しました。"
        );
      }

    } finally {
      routing = false;
    }
  }

  async function refreshMaintenance() {
    const button = $("maintenanceRetryButton");
    button.disabled = true;
    button.textContent = "確認しています...";

    try {
      await checkMaintenance();

      if (!maintenance) {
        showLoginView();
        showMessage(
          "loginMessage",
          "メンテナンスが終了しました。もう一度ログインしてください。",
          "success"
        );
      } else {
        showMaintenanceView(maintenanceMessage);
      }
    } catch (error) {
      console.error(error);
      showMaintenanceView(
        "システム状態を確認できませんでした。時間をおいて再度お試しください。"
      );
    } finally {
      button.disabled = false;
      button.textContent = "状態を再確認する";
    }
  }

  $("maintenanceRetryButton").addEventListener(
    "click",
    refreshMaintenance
  );

  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage("loginMessage");

    const button = $("loginButton");
    setLoading(button, true, "ログイン");

    try {
      await authPersistenceReady;
      await checkMaintenance();

      const credential = await signInWithEmailAndPassword(
        auth,
        $("email").value.trim(),
        $("password").value
      );

      await routeUser(credential.user);

    } catch (error) {
      const messages = {
        "auth/invalid-email": "メールアドレスの形式が正しくありません。",
        "auth/invalid-credential": "メールアドレスまたはパスワードが正しくありません。",
        "auth/too-many-requests": "試行回数が多すぎます。しばらくしてからお試しください。",
        "auth/network-request-failed": "ネットワーク接続に失敗しました。"
      };

      showMessage(
        "loginMessage",
        messages[error.code] || error.message
      );
    } finally {
      setLoading(button, false, "ログイン");
    }
  });

  $("googleButton").addEventListener("click", async () => {
    clearMessage("loginMessage");

    const button = $("googleButton");
    button.disabled = true;

    try {
      await authPersistenceReady;
      await checkMaintenance();

      const credential = await signInWithPopup(
        auth,
        googleProvider
      );

      await routeUser(credential.user);

    } catch (error) {
      if (error.code === "auth/popup-blocked") {
        await signInWithRedirect(auth, googleProvider);
        return;
      }

      if (error.code === "auth/popup-closed-by-user") {
        showMessage("loginMessage", "Googleログインがキャンセルされました。");
      } else {
        showMessage(
          "loginMessage",
          error.message || "Googleログインに失敗しました。"
        );
      }
    } finally {
      button.disabled = false;
    }
  });

  $("resetForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage("resetMessage");

    const button = $("resetButton");
    setLoading(button, true, "再設定メールを送信");

    try {
      await sendPasswordResetEmail(
        auth,
        $("resetEmail").value.trim()
      );

      showMessage(
        "resetMessage",
        "再設定メールを送信しました。メールをご確認ください。",
        "success"
      );
    } catch (error) {
      showMessage(
        "resetMessage",
        error.message || "メールを送信できませんでした。"
      );
    } finally {
      setLoading(button, false, "再設定メールを送信");
    }
  });

  async function logoutDevice() {
    const user = auth.currentUser;

    if (user) {
      try {
        const token = await user.getIdToken();

        await fetch("/api/sessions/logout", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            sessionId: getSessionId()
          }),
          cache: "no-store"
        });
      } catch (error) {
        console.error("セッション終了エラー:", error);
      }
    }

    await signOut(auth);
    localStorage.removeItem(SESSION_KEY);
    location.replace("/login.html");
  }

  window.logoutDevice = logoutDevice;

  onAuthStateChanged(auth, async (user) => {
    if (!initialized || !user || routing) return;
    if (currentMode === "reset") return;

    try {
      await checkMaintenance();
      await routeUser(user);
    } catch (error) {
      console.error(error);
      showMessage(
        "loginMessage",
        error.message || "システム状態を確認できませんでした。"
      );
    }
  });

  async function initialize() {
    const params = new URLSearchParams(location.search);

    if (params.get("mode") === "reset") {
      showResetView();
    }

    try {
      await authPersistenceReady;
      await checkMaintenance();

      const result = await getRedirectResult(auth);

      if (result?.user) {
        await routeUser(result.user);
      }

      initialized = true;

      if (auth.currentUser && currentMode !== "reset") {
        await routeUser(auth.currentUser);
      } else if (maintenance && currentMode !== "reset") {
        // 未ログイン時はログイン画面を表示する。
        // ログイン後に一般ユーザーならメンテナンス画面へ切り替える。
        showLoginView();
      }

    } catch (error) {
      console.error("初期化エラー:", error);
      initialized = true;

      showMessage(
        "loginMessage",
        error.message || "システムの初期化に失敗しました。"
      );
    }
  }

  initialize();
</script>
</body>
</html>
