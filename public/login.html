<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン | WEB Course-plus</title>
<link rel="stylesheet" href="/assets/css/common.css">
<style>
*{box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;background:#f4f7fb}
.login-main{flex:1;display:flex;align-items:center;justify-content:center;padding:35px 16px}
.login-card{width:100%;max-width:440px;background:white;border:1px solid #e2e8f0;border-radius:16px;padding:35px;box-shadow:0 12px 35px rgba(15,23,42,.07)}
.login-brand{text-align:center;font-size:27px;font-weight:800;color:#172b4d;margin-bottom:8px}
.login-brand span{color:#2563eb}
.login-description{text-align:center;color:#64748b;font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
.form-group input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
.form-group input:focus{outline:2px solid #93c5fd;border-color:#2563eb}
.login-button{width:100%;padding:13px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:15px;font-weight:700;cursor:pointer}
.login-button:disabled{opacity:.55;cursor:not-allowed}
.google-button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#263445;font-size:14px;font-weight:600;cursor:pointer}
.separator{display:flex;align-items:center;gap:12px;margin:20px 0;color:#94a3b8;font-size:12px}
.separator:before,.separator:after{content:"";height:1px;background:#e2e8f0;flex:1}
.login-links{display:flex;justify-content:center;margin-top:18px}
.login-links button{border:0;background:none;color:#2563eb;cursor:pointer;font-size:13px}
.message{font-size:13px;margin-top:15px;white-space:pre-wrap;line-height:1.7}
.login-footer{text-align:center;padding:22px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>

<main class="login-main">
  <section class="login-card">
    <div class="login-brand">WEB <span>Course-plus</span></div>
    <p class="login-description">オンライン個別指導サービス</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="username"
          placeholder="メールアドレスを入力" required>
      </div>

      <div class="form-group">
        <label for="password">パスワード</label>
        <input id="password" type="password" autocomplete="current-password"
          placeholder="パスワードを入力" required>
      </div>

      <button type="submit" class="login-button" id="loginButton">
        ログイン
      </button>
    </form>

    <div class="separator">または</div>

    <button type="button" class="google-button" id="googleButton">
      Googleアカウントでログイン
    </button>

    <div class="login-links">
      <button type="button" id="resetButton">パスワードを忘れた場合</button>
    </div>

    <div id="message" class="message" role="status"></div>
  </section>
</main>

<footer class="login-footer">
© 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
</footer>

<script type="module">
import {auth,db,googleProvider} from "/assets/js/firebase.js";

import {
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signInWithPopup,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const form=document.getElementById("loginForm");
const loginButton=document.getElementById("loginButton");
const googleButton=document.getElementById("googleButton");
const resetButton=document.getElementById("resetButton");
const message=document.getElementById("message");

let processing=false;
let redirecting=false;

function showMessage(text,isError=true){
  message.textContent=text;
  message.style.color=isError?"#dc2626":"#15803d";
}

function setLoading(value){
  processing=value;
  loginButton.disabled=value;
  googleButton.disabled=value;
  resetButton.disabled=value;
  loginButton.textContent=value?"確認しています...":"ログイン";
}

async function redirectByRole(user){
  if(redirecting)return;
  redirecting=true;
  setLoading(true);
  showMessage("アカウント情報を確認しています。",false);

  try{
    const profileSnap=await getDoc(doc(db,"users",user.uid));

    if(!profileSnap.exists()){
      throw new Error("利用者情報が登録されていません。管理者にお問い合わせください。");
    }

    const profile=profileSnap.data();

    if(profile.status!=="active"){
      throw new Error("このアカウントは現在利用できません。管理者にお問い合わせください。");
    }

    const destinations={
      student:"/student/dashboard.html",
      teacher:"/teacher/dashboard.html",
      admin:"/admin/dashboard.html"
    };

    const destination=destinations[profile.role];

    if(!destination){
      throw new Error("アカウントの権限が正しく設定されていません。");
    }

    location.replace(destination);

  }catch(error){
    redirecting=false;
    setLoading(false);
    showMessage(error.message||"アカウント情報の確認に失敗しました。");

    // 不正な状態のアカウントをログイン状態のままにしない
    if(error.code!=="permission-denied"){
      // Firestoreの一時的なエラー時は再ログインを強制しない
    }
  }
}

form.addEventListener("submit",async event=>{
  event.preventDefault();
  if(processing||redirecting)return;

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email||!password)return;

  setLoading(true);
  showMessage("");

  try{
    const credential=await signInWithEmailAndPassword(auth,email,password);
    await redirectByRole(credential.user);
  }catch(error){
    setLoading(false);

    const errors={
      "auth/invalid-credential":"メールアドレスまたはパスワードが正しくありません。",
      "auth/user-disabled":"このアカウントは無効になっています。",
      "auth/too-many-requests":"ログイン試行回数が多すぎます。時間をおいて再度お試しください。",
      "auth/network-request-failed":"ネットワーク接続を確認してください。"
    };

    showMessage(errors[error.code]||"ログインできませんでした。入力内容を確認してください。");
  }
});

googleButton.addEventListener("click",async()=>{
  if(processing||redirecting)return;

  setLoading(true);
  showMessage("");

  try{
    const credential=await signInWithPopup(auth,googleProvider);
    await redirectByRole(credential.user);
  }catch(error){
    setLoading(false);

    const errors={
      "auth/popup-closed-by-user":"Googleログインがキャンセルされました。",
      "auth/popup-blocked":"ポップアップがブロックされました。ブラウザの設定を確認してください。",
      "auth/account-exists-with-different-credential":"このメールアドレスには別のログイン方法が登録されています。"
    };

    showMessage(errors[error.code]||"Googleログインに失敗しました。");
  }
});

resetButton.addEventListener("click",async()=>{
  const email=document.getElementById("email").value.trim();

  if(!email){
    showMessage("先にメールアドレスを入力してください。");
    document.getElementById("email").focus();
    return;
  }

  try{
    await sendPasswordResetEmail(auth,email);
    showMessage("パスワード再設定用のメールを送信しました。メールをご確認ください。",false);
  }catch(error){
    showMessage("メールを送信できませんでした。メールアドレスを確認してください。");
  }
});

// すでにログインしている場合も権限を確認して移動する
onAuthStateChanged(auth,user=>{
  if(user&&!redirecting&&!processing){
    redirectByRole(user);
  }
});
</script>
</body>
</html>
