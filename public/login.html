
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>ログイン | WEB Course-plus</title>

  <style>
    :root {
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      color: #182334;
      background: #f4f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --primary: #2563eb;
      --border: #dfe6ef;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 36px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      font-size: 25px;
      margin: 0;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand p {
      color: var(--muted);
      margin: 9px 0 0;
      font-size: 13px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(20, 38, 63, .06);
    }

    .card h2 {
      font-size: 21px;
      margin: 0 0 8px;
    }

    .description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin: 0 0 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: .15s;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .google-button {
      background: white;
      color: #263445;
      border: 1px solid var(--border);
    }

    .google-button:hover:not(:disabled) {
      background: #f8fafc;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #94a3b8;
      font-size: 12px;
      margin: 21px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: var(--border);
      flex: 1;
    }

    .links {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      font-size: 13px;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover { text-decoration: underline; }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 17px;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .maintenance {
      display: none;
      text-align: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 35px 25px;
    }

    .maintenance h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .maintenance p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      padding: 20px 12px;
      color: #94a3b8;
      font-size: 11px;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 12px;
    }

    @media (max-width: 480px) {
      .card { padding: 23px 19px; }
      .brand h1 { font-size: 22px; }
    }
  </style>
</head>

<body>
  <main>
    <div class="container">

      <div class="brand">
        <h1>WEB Course-plus</h1>
        <p>オンライン授業管理システム</p>
      </div>

      <section id="loginView" class="card">
        <h2>ログイン</h2>
        <p class="description">
          登録済みのアカウントでログインしてください。
        </p>

        <div id="loginMessage" class="message"></div>

        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">メールアドレス</label>
            <input
              id="loginEmail"
              type="email"
              autocomplete="username"
              placeholder="example@email.com"
              required
            >
          </div>

          <div class="field">
            <label for="loginPassword">パスワード</label>
            <input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
              placeholder="パスワードを入力"
              required
            >
          </div>

          <button id="loginButton" type="submit">
            ログイン
          </button>
        </form>

        <div class="links">
          <a href="/login.html?mode=reset" id="forgotPasswordLink">
            パスワードを忘れた方はこちら
          </a>
        </div>

        <div class="divider">または</div>

        <button id="googleButton" class="google-button" type="button">
          Googleアカウントでログイン
        </button>
      </section>

      <section id="resetView" class="card hidden">
        <h2>パスワード再設定</h2>
        <p class="description">
          登録済みのメールアドレスを入力してください。
          パスワード再設定用のメールを送信します。
        </p>

        <div id="resetMessage" class="message"></div>

        <form id="resetForm">
          <div class="field">
            <label for="resetEmail">メールアドレス</label>
            <input
              id="resetEmail"
              type="email"
              autocomplete="email"
              placeholder="example@email.com"
              required
            >
          </div>

          <button id="resetButton" type="submit">
            再設定メールを送信
          </button>
        </form>

        <div class="links">
          <a href="/login.html" id="backToLogin">
            ログイン画面に戻る
          </a>
        </div>
      </section>

      <section id="maintenanceView" class="maintenance">
        <h2>メンテナンス中</h2>
        <p id="maintenanceMessage">
          現在、システムメンテナンスを実施しています。
          しばらくしてから再度アクセスしてください。
        </p>
      </section>

      <div id="initialLoading" class="loading">
        システムを確認しています...
      </div>

    </div>
  </main>

  <footer>
    © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
  </footer>

  <script type="module">
    import {
      auth,
      db,
      googleProvider,
      authPersistenceReady
    } from "/assets/js/firebase.js";

    import {
      signInWithEmailAndPassword,
      signInWithPopup,
      sendPasswordResetEmail,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);

    const loginView = $("loginView");
    const resetView = $("resetView");
    const maintenanceView = $("maintenanceView");
    const initialLoading = $("initialLoading");

    let maintenanceEnabled = false;
    let initializationFinished = false;

    function showMessage(id, message, type = "error") {
      const element = $(id);
      element.textContent = message;
      element.className = `message ${type}`;
    }

    function clearMessage(id) {
      const element = $(id);
      element.textContent = "";
      element.className = "message";
    }

    function setButtonLoading(button, loading, normalText) {
      button.disabled = loading;
      button.textContent = loading ? "処理しています..." : normalText;
    }

    function isResetMode() {
      return new URLSearchParams(location.search).get("mode") === "reset";
    }

    function renderMode() {
      const reset = isResetMode();

      loginView.classList.toggle("hidden", reset);
      resetView.classList.toggle("hidden", !reset);

      document.title = reset
        ? "パスワード再設定 | WEB Course-plus"
        : "ログイン | WEB Course-plus";

      clearMessage("loginMessage");
      clearMessage("resetMessage");
    }

    function navigateMode(mode) {
      const url = mode === "reset"
        ? "/login.html?mode=reset"
        : "/login.html";

      history.pushState({}, "", url);
      renderMode();
    }

    $("forgotPasswordLink").addEventListener("click", (event) => {
      event.preventDefault();
      navigateMode("reset");
    });

    $("backToLogin").addEventListener("click", (event) => {
      event.preventDefault();
      navigateMode("login");
    });

    window.addEventListener("popstate", () => {
      renderMode();
    });

    async function checkMaintenance() {
      try {
        const response = await fetch("/api/system/status", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("システム状態を確認できませんでした。");
        }

        const data = await response.json();
        maintenanceEnabled = data.maintenance === true;

        if (maintenanceEnabled) {
          $("maintenanceMessage").textContent =
            data.maintenanceMessage ||
            "現在、システムメンテナンスを実施しています。";

          loginView.classList.add("hidden");
          resetView.classList.add("hidden");
          maintenanceView.style.display = "block";
        }

        return !maintenanceEnabled;
      } catch (error) {
        console.error(error);
        showMessage(
          "loginMessage",
          "システムに接続できません。時間をおいて再度お試しください。"
        );
        return false;
      }
    }

    async function routeUser(user) {
      if (!user) return;

      const profileSnapshot = await getDoc(
        doc(db, "users", user.uid)
      );

      if (!profileSnapshot.exists()) {
        await signOut(auth);
        showMessage(
          "loginMessage",
          "ユーザー情報が登録されていません。管理者にお問い合わせください。"
        );
        return;
      }

      const profile = profileSnapshot.data();

      if (
        profile.active === false ||
        ["inactive", "disabled", "suspended", "deleted"]
          .includes(String(profile.status || "").toLowerCase())
      ) {
        await signOut(auth);
        showMessage(
          "loginMessage",
          "このアカウントは現在利用できません。"
        );
        return;
      }

      switch (profile.role) {
        case "admin":
          location.replace("/admin/dashboard.html");
          break;

        case "teacher":
          location.replace("/teacher/dashboard.html");
          break;

        case "student":
          location.replace("/student/dashboard.html");
          break;

        default:
          await signOut(auth);
          showMessage(
            "loginMessage",
            "アカウントの権限が正しくありません。管理者にお問い合わせください。"
          );
      }
    }

    // メールアドレス・パスワードログイン
    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      clearMessage("loginMessage");

      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;
      const button = $("loginButton");

      if (maintenanceEnabled) return;

      setButtonLoading(button, true, "ログイン");

      try {
        await authPersistenceReady;

        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        await routeUser(credential.user);

      } catch (error) {
        console.error(error);

        const messages = {
          "auth/invalid-email": "メールアドレスの形式が正しくありません。",
          "auth/user-not-found": "アカウントが見つかりません。",
          "auth/wrong-password": "パスワードが正しくありません。",
          "auth/invalid-credential": "メールアドレスまたはパスワードが正しくありません。",
          "auth/too-many-requests": "ログイン試行回数が多すぎます。しばらくしてからお試しください。"
        };

        showMessage(
          "loginMessage",
          messages[error.code] ||
          "ログインに失敗しました。入力内容をご確認ください。"
        );

      } finally {
        setButtonLoading(button, false, "ログイン");
      }
    });

    // Googleログイン
    $("googleButton").addEventListener("click", async () => {
      clearMessage("loginMessage");

      const button = $("googleButton");

      if (maintenanceEnabled) return;

      setButtonLoading(
        button,
        true,
        "Googleアカウントでログイン"
      );

      try {
        await authPersistenceReady;

        const credential = await signInWithPopup(
          auth,
          googleProvider
        );

        await routeUser(credential.user);

      } catch (error) {
        console.error(error);

        showMessage(
          "loginMessage",
          error.code === "auth/popup-closed-by-user"
            ? "ログイン画面が閉じられました。"
            : "Googleログインに失敗しました。"
        );

      } finally {
        setButtonLoading(
          button,
          false,
          "Googleアカウントでログイン"
        );
      }
    });

    // パスワード再設定メール送信
    $("resetForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      clearMessage("resetMessage");

      const email = $("resetEmail").value.trim();
      const button = $("resetButton");

      if (!email) {
        showMessage(
          "resetMessage",
          "メールアドレスを入力してください。"
        );
        return;
      }

      setButtonLoading(
        button,
        true,
        "再設定メールを送信"
      );

      try {
        await authPersistenceReady;

        await sendPasswordResetEmail(auth, email);

        showMessage(
          "resetMessage",
          "パスワード再設定メールを送信しました。メールをご確認ください。",
          "success"
        );

        $("resetEmail").value = "";

      } catch (error) {
        console.error(error);

        const messages = {
          "auth/invalid-email":
            "メールアドレスの形式が正しくありません。",
          "auth/user-not-found":
            "このメールアドレスのアカウントが見つかりません。"
        };

        showMessage(
          "resetMessage",
          messages[error.code] ||
          "メールを送信できませんでした。入力内容をご確認ください。"
        );

      } finally {
        setButtonLoading(
          button,
          false,
          "再設定メールを送信"
        );
      }
    });

    // 初期化
    async function initialize() {
      renderMode();

      const systemAvailable = await checkMaintenance();

      initialLoading.classList.add("hidden");

      if (!systemAvailable) return;

      initializationFinished = true;

      await authPersistenceReady;

      onAuthStateChanged(auth, async (user) => {
        if (!initializationFinished || maintenanceEnabled) return;

        // 再設定画面ではログイン状態による自動遷移を行わない
        if (isResetMode()) return;

        if (user) {
          try {
            await routeUser(user);
          } catch (error) {
            console.error("ユーザー情報確認エラー:", error);
            showMessage(
              "loginMessage",
              "アカウント情報を確認できませんでした。"
            );
          }
        }
      });
    }

    initialize();
  </script>
</body>
</html>
