<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン | WEB Course-plus</title>
<link rel="stylesheet" href="/assets/css/common.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-wrap{width:100%;max-width:430px}
.login-brand{text-align:center;font-size:27px;font-weight:800;margin-bottom:25px}
.login-brand span{color:#2563eb}
.login-card{background:white;padding:35px;border:1px solid var(--border);border-radius:15px;box-shadow:0 10px 35px #14263f0c}
.login-card h1{font-size:23px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0 0 27px}
.login-card .btn{width:100%;margin-top:12px;min-height:45px}
.google{background:white;color:#243247;border:1px solid var(--border)}
.google:hover{background:#f8fafc}
.message{font-size:13px;line-height:1.6;margin-top:15px;color:#dc2626;white-space:pre-wrap}
.forgot{text-align:right;margin-top:10px;font-size:13px}
.forgot button{background:none;border:0;color:#2563eb;padding:0}
.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:24px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">WEB <span>Course-plus</span></div>
  <section class="login-card">
    <h1>ログイン</h1>
    <p class="sub">アカウント情報を入力してください。</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" id="loginButton" type="submit">ログイン</button>
    </form>

    <div class="forgot">
      <button type="button" id="resetButton">パスワードをお忘れの場合</button>
    </div>

    <button class="btn google" id="googleButton" type="button">
      Googleアカウントでログイン
    </button>

    <div id="message" class="message" role="alert"></div>
  </section>
  <div class="foot">© 2026 定期テスト対策プリント運営事務局. All Rights Reserved.</div>
</div>

<script type="module">
import { auth, db, googleProvider } from "/assets/js/firebase.js";

import {
  signInWithEmailAndPassword,
  signInWithPopup,
  sendPasswordResetEmail,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");
const googleButton = document.getElementById("googleButton");
const resetButton = document.getElementById("resetButton");

const destinations = {
  student: "/student/dashboard.html",
  teacher: "/teacher/dashboard.html",
  admin: "/admin/dashboard.html"
};

function showMessage(text, error = true) {
  message.style.color = error ? "#dc2626" : "#15803d";
  message.textContent = text;
}

function setBusy(busy) {
  loginButton.disabled = busy;
  googleButton.disabled = busy;
  resetButton.disabled = busy;
}

async function routeUser(user) {
  const profileRef = doc(db, "users", user.uid);
  const profileSnap = await getDoc(profileRef);

  if (!profileSnap.exists()) {
    await signOut(auth);
    throw new Error("アカウント情報が登録されていません。管理者にお問い合わせください。");
  }

  const profile = profileSnap.data();

  if (profile.status !== "active") {
    await signOut(auth);
    throw new Error("このアカウントは現在利用できません。");
  }

  const destination = destinations[profile.role];

  if (!destination) {
    await signOut(auth);
    throw new Error("アカウントの権限設定が正しくありません。");
  }

  location.replace(destination);
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  setBusy(true);
  showMessage("ログインを確認しています。", false);

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const result = await signInWithEmailAndPassword(auth, email, password);
    await routeUser(result.user);
  } catch (error) {
    showMessage(error.code === "auth/invalid-credential"
      ? "メールアドレスまたはパスワードが正しくありません。"
      : error.message || "ログインに失敗しました。");
    setBusy(false);
  }
});

googleButton.addEventListener("click", async () => {
  setBusy(true);
  showMessage("Googleアカウントを確認しています。", false);

  try {
    const result = await signInWithPopup(auth, googleProvider);
    await routeUser(result.user);
  } catch (error) {
    showMessage(error.message || "Googleログインに失敗しました。");
    setBusy(false);
  }
});

resetButton.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    showMessage("先にメールアドレスを入力してください。");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("パスワード再設定メールを送信しました。", false);
  } catch (error) {
    showMessage(error.message || "メールを送信できませんでした。");
  }
});

// すでにログイン済みなら権限を確認して移動
onAuthStateChanged(auth, async user => {
  if (!user) return;

  setBusy(true);
  try {
    await routeUser(user);
  } catch (error) {
    showMessage(error.message);
    setBusy(false);
  }
});
</script>
</body>
</html>
